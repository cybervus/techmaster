<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный кабинет — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--warn:#fa8c16;--warn-bg:#fff5e6;--soft:#fdecec;--blue:#2563eb;--blue-bg:#eef4ff;--gbg:#e6f8f1;--gbd:#00b578;--rbg:#fdecec;--rbd:#e52520;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 48px;max-width:640px;margin-inline:auto;overflow-x:clip}

/* Header */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 12px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{margin:0;line-height:0;flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:24px;height:24px;display:block}
.btxt{min-width:0}
h1{font-size:17px;font-weight:700;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.hacts{display:flex;align-items:center;gap:6px}
.icbtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;transition:border-color .15s,background .15s}
.icbtn svg{width:19px;height:19px;display:block}
.icbtn.chat-ic{background:var(--soft);border-color:transparent;color:var(--accent)}
.icdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:16px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:15px;height:10px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}

/* Top navigation tabs */
.obj-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
.obj-tabs::-webkit-scrollbar{display:none}
.otab{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);padding:6px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.otab.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}

.nav-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:var(--sh)}
.ntab{position:relative;border:0;background:none;color:var(--muted);border-radius:10px;padding:9px 6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:background .15s,color .15s}
.ntab.on{background:var(--accent);color:var(--on);box-shadow:0 2px 8px rgba(229,37,32,.22)}
.ntab .cnt{font-size:11px;font-weight:700;padding:0 5px;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--bg);color:var(--muted)}
.ntab.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.ntab .ddot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.ntab.on .ddot{background:#fff}

/* Cards & common */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.panel:first-child{margin-top:0}
.panel h2{margin:0 0 12px;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 .pill{font-weight:600;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:10px}
.link-act{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 0}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input[type=tel]{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=tel]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 10px rgba(229,37,32,.24)}
.btn.d{background:var(--soft);border-color:transparent;color:var(--danger)}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fff;color:var(--accent);font-size:11.5px;font-weight:700}

/* Master message banner */
.msg-banner{margin-bottom:12px;padding:12px 14px;background:var(--blue-bg);color:var(--text);border-left:3px solid var(--blue);border-radius:12px;font-size:13.5px;white-space:pre-wrap}
.msg-banner b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--blue);margin-bottom:3px}

/* Overview layout */
.ov-grid{display:flex;flex-direction:column;gap:12px}
.ov-grid>.panel{margin-top:0}
.prog-box{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:104px;height:104px;flex:none}
.donut svg{width:104px;height:104px;display:block;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-pct{font-size:22px;font-weight:700;line-height:1.1}
.donut-lbl{font-size:10.5px;color:var(--muted);margin-top:2px}
.stats{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.st-row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-l{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.pr{background:var(--accent)}.dot.td{background:var(--line)}
.st-v{font-weight:700}
.bar-wrap{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;margin-top:12px}
.bar-ok{background:var(--ok);height:100%}
.bar-pr{background:var(--accent);height:100%}

/* Finance KPI strip */
.kpi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 10px;min-width:0}
.kpi-k{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-size:16px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.debt{background:var(--rbg);border-color:transparent;color:var(--danger)}
.kpi.debt .kpi-k{color:var(--danger);opacity:.85}
.kpi.ok{background:var(--gbg);border-color:transparent;color:var(--ok)}
.kpi.ok .kpi-k{color:var(--ok);opacity:.85}
.fin-card-btn{cursor:pointer;transition:border-color .15s}

/* Quick actions */
.qacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qacts .btn{padding:11px 12px;font-size:13.5px}

/* Filter chips & sub-tabs */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;margin-left:5px;opacity:.8}

.sub-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}
.sseg{border:0;background:none;color:var(--muted);border-radius:9px;padding:8px 6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.sseg.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(15,23,42,.08)}
.sseg b{font-size:11.5px;color:var(--muted);font-weight:600}

/* Compact expandable task cards */
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--sh);transition:border-color .15s}
.titem.act{border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--soft) 180%)}
.titem.dn .tt{color:var(--muted)}
.titem.exp{cursor:pointer}
.thead{display:flex;align-items:flex-start;gap:10px}
.tic{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;margin-top:1px}
.tic.ok{background:var(--ok);color:#fff}
.tic.pr{background:var(--accent);color:var(--on)}
.tic.td{border:1.8px solid var(--muted);color:var(--muted)}
.tmain{flex:1;min-width:0}
.tt{font-weight:600;font-size:14.5px;line-height:1.35}
.tm{color:var(--muted);font-size:12.5px;margin-top:2px}
.tind{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.tchev{color:var(--muted);font-size:13px;line-height:1;padding:3px 2px;flex:none;transition:transform .15s}
.titem.open .tchev{transform:rotate(180deg);color:var(--accent)}
.tbody{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tn{font-size:13px;padding:8px 10px;background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;white-space:pre-wrap}
.badge{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;vertical-align:1px;background:var(--soft);color:var(--accent)}
.badge.ok{background:var(--gbg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* Equipment list */
.sub-its{display:flex;flex-direction:column;gap:8px}
.tbody .sub-its{margin-top:8px}
.sub-it{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:13.5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sub-it:last-child{padding-bottom:0;border-bottom:0}
.sub-it-l{flex:1;min-width:0}
.sub-it-m{font-size:12px;color:var(--muted);margin-top:2px}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}

/* Finance tables */
.ptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ptbl th{text-align:left;font-weight:600;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.ptbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ptbl th.r,.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:11px}
.pnote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.empty-s{color:var(--muted);font-size:13.5px;padding:16px 6px;text-align:center}

/* Profile modal info rows */
.info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-k{color:var(--muted);flex:none}
.info-v{font-weight:600;text-align:right;word-break:break-word}

/* Calendar */
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.free{background:var(--gbg);border-color:var(--gbd)}.busy{background:var(--rbg);border-color:var(--rbd)}.part{background:linear-gradient(135deg,var(--rbg) 50%,var(--gbg) 50%);border-color:var(--rbd)}
.ch{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;text-transform:capitalize;font-weight:700}
.ch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:5px 12px;font-size:16px;cursor:pointer}.ch button:disabled{opacity:.3;cursor:default}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.d{position:relative;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:0;cursor:pointer}
.d.past{opacity:.35}.d.sel{outline:2.5px solid var(--accent);outline-offset:1px;font-weight:700}
.d.mine::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.h{text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid;font-size:14px;font-weight:600}
h3.dayh{font-size:14px;font-weight:700;margin:12px 0 6px;text-transform:capitalize}

/* Footer & login links */
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.reg-link{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.reg-link a{color:var(--accent);font-weight:600;text-decoration:none}

/* Modals (Chat & Profile) */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-hd h3{margin:0;font-size:17px;font-weight:700}
.sheet-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-sheet{background:var(--card);width:100%;max-width:640px;height:86dvh;max-height:760px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.chat-hd h3{margin:0;font-size:16px;font-weight:700}
.chat-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat-day{align-self:center;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:6px 0 2px}
.mbub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mbub.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.mbub.them{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbub .mw{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.mbub .mt{font-size:11px;opacity:.75;margin-top:4px;text-align:right}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-bar textarea{flex:1;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:110px;resize:none}
.chat-bar .btn{padding:10px 16px;flex:none}

/* Responsive: small phones */
@media (max-width:420px){
  body{padding:0 10px 44px;font-size:14.5px}
  header{margin:0 -10px 10px;padding:10px;gap:6px}
  .logo{width:34px;height:34px}
  h1{font-size:15.5px}
  .icbtn{width:33px;height:33px}
  .lang button{padding:4px 6px;font-size:11px}
  .ntab{font-size:12px;padding:8px 4px;gap:3px}
  .panel{padding:14px 12px}
  .donut,.donut svg{width:92px;height:92px}
  .donut-pct{font-size:20px}
  .kpi3{gap:6px}
  .kpi{padding:9px 8px}
  .kpi-v{font-size:14.5px}
  .qacts{grid-template-columns:1fr}
  .ptbl{font-size:12px}
  .ptbl th,.ptbl td{padding:7px 4px}
  .d{height:36px;font-size:13px}
}
/* Responsive: hover feedback on desktop/mouse */
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(.96)}
  .btn.p:not(:disabled):hover{filter:brightness(1.05)}
  .icbtn:hover{border-color:var(--accent);color:var(--accent)}
  .ntab:not(.on):hover{color:var(--text);background:var(--bg)}

async function loadPortal() {
  if (D) return D;
  if (!loadPromise) {

      if (!snap.exists()) { loadPromise = null; return null; }
      D = snap.data();
      wh = Array.isArray(D.wh) && D.wh.length === 2 ? D.wh : [9, 18];
      N = wh[1] - wh[0];
      return D;
    }).catch(err => {
      loadPromise = null;
      throw err;
    });
  }
  return loadPromise;
}

/*CRYPTO*/
const norm = p => String(p).replace(/\D/g, '').slice(-9);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
async function unlock(phone) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(phone)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, km, 384));
  const recId = hex(bits.slice(0, 16));
  const rec = (D.recs || []).find(r => r.id === recId);
  if (!rec) return null;
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.iv) }, key, b64(rec.ct));
  const parsed = JSON.parse(new TextDecoder().decode(pt));
  parsed._chatId = recId;
  return parsed;
}

function donutSvg(pct, doneShare, progShare) {
  const r = 42, C = 2 * Math.PI * r;
  const okLen = Math.max(0, Math.min(1, doneShare)) * C;
  const prLen = Math.max(0, Math.min(1 - doneShare, progShare)) * C;
  return `<div class="donut">
    <svg viewBox="0 0 104 104" aria-hidden="true">
      <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
      ${prLen > 0.5 ? `<circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-dasharray="${prLen.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-okLen).toFixed(2)}"/>` : ''}
      ${okLen > 0.5 ? `<circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--ok)" stroke-width="10" stroke-dasharray="${okLen.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="0"/>` : ''}
    </svg>
    <div class="donut-c">
      <div class="donut-pct">${pct}%</div>
      <div class="donut-lbl">${esc(I18N[lang].pctSub)}</div>
    </div>
  </div>`;
}

  }

  return `<div class="titem${cls}"${canOpen ? ` data-tkey="${esc(key)}"` : ''}>
    <div class="thead">
      ${ic}
      <div class="tmain">
        <div class="tt">${esc(t.t)}${badge}</div>
        ${meta ? `<div class="tm">${esc(meta)}</div>` : ''}
        ${ind}
      </div>
      ${canOpen ? '<span class="tchev" aria-hidden="true">▾</span>' : ''}
    </div>
    ${body}
  </div>`;
}

function getClientFin(c) {
  const svcs = Array.isArray(c.svcs) ? c.svcs : [];
  const pays = Array.isArray(c.pays) ? [...c.pays].sort((a, b) => (b.d || '').localeCompare(a.d || '')) : [];
  const svcTotal = Math.round(svcs.reduce((acc, s) => acc + (Number(s.q) || 1) * (Number(s.p) || 0), 0) * 100) / 100;
  const paidTotal = Math.round(pays.reduce((acc, p) => acc + (Number(p.a) || 0), 0) * 100) / 100;
  const bal = Math.round((svcTotal - paidTotal) * 100) / 100;
  return { svcs, pays, svcTotal, paidTotal, bal };
}

function renderCabinet() {
  if (!unlocked || !unlocked.clients || !unlocked.clients.length) return;
  const L = I18N[lang];
  const list = unlocked.clients;
  if (activeIdx >= list.length) activeIdx = 0;
  const c = list[activeIdx];

  // Header subtitle shows active project or client name
  $('#hsub').textContent = c.proj || c.name || 'Techmaster IT Solutions';
  $('#hdrActs').hidden = false;

  // Multi-object selector when multiple clients share a phone number
  const objTabsEl = $('#objTabs');
  if (list.length > 1) {
    objTabsEl.hidden = false;
    objTabsEl.innerHTML = list.map((x, i) => `<button type="button" class="otab${i === activeIdx ? ' on' : ''}" data-cidx="${i}">${esc(x.proj || x.name)}</button>`).join('');
    objTabsEl.querySelectorAll('[data-cidx]').forEach(b => b.onclick = () => {
      activeIdx = Number(b.dataset.cidx);
      finSub = null;
      const s = loadSession();
      if (s && s.phone) saveSession(s.phone, activeIdx);
      renderCabinet();
    });
  } else {
    objTabsEl.hidden = true;
  }

  // Compute task groups
  const allTasks = Array.isArray(c.tasks) ? c.tasks : [];
  const inProg = allTasks.filter(t => taskStatus(t) === 'in_progress').sort(cmp);
  const todo = allTasks.filter(t => taskStatus(t) === 'todo').sort(cmp);
  const done = allTasks.filter(t => taskStatus(t) === 'done').sort(cmp).reverse();
  const total = allTasks.length;

  const hasManualPct = typeof c.pct === 'number' && Number.isFinite(c.pct);
  const pct = hasManualPct ? Math.max(0, Math.min(100, Math.round(c.pct))) : (total ? Math.round((done.length / total) * 100) : 0);
  const doneShare = hasManualPct ? (pct / 100) : (total ? done.length / total : 0);
  const progShare = hasManualPct ? 0 : (total ? inProg.length / total : 0);

  // Calendar dates for client's open tasks
  mine.clear();
  for (const t of [...inProg, ...todo]) { if (t.d) mine.add(t.d); }
  const showCal = c.cal !== false;
  if (!showCal && activeTab === 'schedule') activeTab = 'overview';

  // Finance & equipment summary
  const fin = getClientFin(c);
  const hasFin = fin.svcs.length > 0 || fin.pays.length > 0;
  const allItems = [];
  for (const t of allTasks) {
    if (Array.isArray(t.it)) {
      for (const x of t.it) allItems.push(Object.assign({ taskTitle: t.t }, x));
    }
  }
  const itemsSum = allItems.reduce((acc, x) => acc + (Number(x.p) > 0 ? Number(x.p) * (Number(x.q) || 1) : 0), 0);

  // Main 4 top tabs
  const tabs = [
    { id: 'overview', lbl: L.tabOv },
    { id: 'works', lbl: L.tabWorks, cnt: inProg.length + todo.length },
    { id: 'finance', lbl: L.tabFin, dot: hasFin && fin.bal > 0 }
  ];
  if (showCal) tabs.push({ id: 'schedule', lbl: L.tabCal });

  $('#mainTabs').innerHTML = tabs.map(tb => {
    const extra = tb.cnt ? `<span class="cnt">${tb.cnt}</span>` : (tb.dot ? '<span class="ddot"></span>' : '');
    return `<button type="button" role="tab" aria-selected="${activeTab === tb.id}" class="ntab${activeTab === tb.id ? ' on' : ''}" data-mtab="${tb.id}">${esc(tb.lbl)}${extra}</button>`;
  }).join('');
  $('#mainTabs').querySelectorAll('[data-mtab]').forEach(b => b.onclick = () => {
    activeTab = b.dataset.mtab;
    renderCabinet();
  });

  const bodyEl = $('#tabBody');
  const calSec = $('#calSec');
  calSec.hidden = true;

  if (activeTab === 'overview') {
    const unreadC = (chatData && Number(chatData.unreadClient)) || 0;
    const balCls = fin.bal > 0 ? ' debt' : ' ok';
    const balLbl = fin.bal > 0 ? L.kpiDebt : (fin.bal < 0 ? L.kpiOver : L.kpiZero);
    const balVal = fin.bal === 0 ? '0 ₼' : fmtAzn0(Math.abs(fin.bal));

    // Nearest active or upcoming task (max 2)
    const featured = inProg.length ? inProg.slice(0, 2) : todo.slice(0, 1);

    let html = '';
    if (c.msg) {
      html += `<div class="msg-banner"><b>${esc(L.masterNote)}</b>${esc(c.msg)}</div>`;
    }

    html += '<div class="ov-grid">';

    // Progress summary card
    html += `<section class="panel">
      <h2>${esc(L.progressTitle)}<span class="pill">${done.length} / ${total}</span></h2>
      <div class="prog-box">
        ${donutSvg(pct, doneShare, progShare)}
        <div class="stats">
          <div class="st-row"><span class="st-l"><i class="dot ok"></i>${esc(L.stDone)}</span><span class="st-v">${done.length}</span></div>
          <div class="st-row"><span class="st-l"><i class="dot pr"></i>${esc(L.stProg)}</span><span class="st-v">${inProg.length}</span></div>
          <div class="st-row"><span class="st-l"><i class="dot td"></i>${esc(L.stTodo)}</span><span class="st-v">${todo.length}</span></div>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-ok" style="width:${(doneShare * 100).toFixed(1)}%"></div>
        <div class="bar-pr" style="width:${(progShare * 100).toFixed(1)}%"></div>
      </div>
    </section>`;

    // Finance summary card (clickable -> Finance tab)
    html += `<section class="panel fin-card-btn" id="ovFinCard">
      <h2>${esc(L.finCardTitle)}<button type="button" class="link-act" data-jump="finance">${esc(L.finDetailsBtn)}</button></h2>
      ${hasFin
        ? `<div class="kpi3">
            <div class="kpi"><div class="kpi-k">${esc(L.kpiSvcs)}</div><div class="kpi-v">${esc(fmtAzn0(fin.svcTotal))}</div></div>
            <div class="kpi"><div class="kpi-k">${esc(L.kpiPaid)}</div><div class="kpi-v">${esc(fmtAzn0(fin.paidTotal))}</div></div>
            <div class="kpi${balCls}"><div class="kpi-k">${esc(balLbl)}</div><div class="kpi-v">${esc(balVal)}</div></div>
          </div>`
        : `<div class="muted">${esc(L.itemsTitle)}: <b>${allItems.length}</b>${itemsSum > 0 ? ' · ' + esc(fmtAzn(itemsSum)) : ''}</div>`}
    </section>`;

    // Nearest / active task card
    html += `<section class="panel span2">
      <h2>${esc(L.nearTitle)}<button type="button" class="link-act" data-jump="works">${esc(L.allWorksBtn)}</button></h2>
      ${featured.length
        ? `<div class="tlist">${featured.map((t, i) => compactTaskHtml(t, taskStatus(t), 'ov:' + taskKey(t, i), true)).join('')}</div>`
        : `<div class="empty-s">${esc(L.noTasksYet)}</div>`}
    </section>`;

    // Quick actions (Chat + Shop)
    html += `<div class="qacts span2">
      <button type="button" class="btn p" id="ovChatBtn">${esc(L.chatBtn)}<span class="cbadge" id="ovChatBadge"${unreadC ? '' : ' hidden'}>${unreadC}</span></button>
      <a class="btn" href="shop.html">${esc(L.openShop)}</a>
    </div>`;

    html += '</div>';
    bodyEl.innerHTML = html;

    $('#ovChatBtn').onclick = openChat;
    $('#ovFinCard').onclick = e => { if (!e.target.closest('button')) { activeTab = 'finance'; renderCabinet(); } };
    bodyEl.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => { activeTab = b.dataset.jump; renderCabinet(); });
    bindTaskExpand(bodyEl);
  } else if (activeTab === 'works') {
    const orderedAll = [...inProg, ...todo, ...done];
    const filters = [
      ['all', L.fAll, orderedAll.length],
      ['in_progress', L.fProg, inProg.length],
      ['todo', L.fTodo, todo.length],
      ['done', L.fDone, done.length]
    ];
    const shown = workFilter === 'all' ? orderedAll : (workFilter === 'in_progress' ? inProg : (workFilter === 'todo' ? todo : done));

    let html = `<div class="chips">${filters.map(([id, lb, cnt]) =>
      `<button type="button" class="chip${workFilter === id ? ' on' : ''}" data-wf="${id}">${esc(lb)}<b>${cnt}</b></button>`
    ).join('')}</div>`;

    if (shown.length) {
      html += `<div class="tlist grid2">${shown.map((t, i) => compactTaskHtml(t, taskStatus(t), taskKey(t, i), true)).join('')}</div>`;
    } else {
      html += `<section class="panel"><div class="empty-s">${esc(allTasks.length ? L.noTasksFilter : L.noTasksYet)}</div></section>`;
    }

    bodyEl.innerHTML = html;
    bodyEl.querySelectorAll('[data-wf]').forEach(b => b.onclick = () => { workFilter = b.dataset.wf; renderCabinet(); });
    bindTaskExpand(bodyEl);
  } else if (activeTab === 'finance') {
    if (!finSub) finSub = fin.svcs.length ? 'svcs' : (fin.pays.length ? 'pays' : 'items');
    const balCls = fin.bal > 0 ? ' debt' : ' ok';
    const balLbl = fin.bal > 0 ? L.kpiDebt : (fin.bal < 0 ? L.kpiOver : L.kpiZero);
    const balVal = fin.bal === 0 ? '0 ₼' : fmtAzn0(Math.abs(fin.bal));

    let html = '<div class="fin-wrap">';
    if (hasFin) {
      html += `<section class="panel" style="margin-bottom:12px">
        <div class="kpi3">
          <div class="kpi"><div class="kpi-k">${esc(L.kpiSvcs)}</div><div class="kpi-v">${esc(fmtAzn0(fin.svcTotal))}</div></div>
          <div class="kpi"><div class="kpi-k">${esc(L.kpiPaid)}</div><div class="kpi-v">${esc(fmtAzn0(fin.paidTotal))}</div></div>
          <div class="kpi${balCls}"><div class="kpi-k">${esc(balLbl)}</div><div class="kpi-v">${esc(balVal)}</div></div>
        </div>
      </section>`;
    }

    html += `<div class="sub-seg" role="tablist">
      <button type="button" class="sseg${finSub === 'svcs' ? ' on' : ''}" data-fsub="svcs">${esc(L.subSvcs)}<b>${fin.svcs.length}</b></button>
      <button type="button" class="sseg${finSub === 'pays' ? ' on' : ''}" data-fsub="pays">${esc(L.subPays)}<b>${fin.pays.length}</b></button>
      <button type="button" class="sseg${finSub === 'items' ? ' on' : ''}" data-fsub="items">${esc(L.subItems)}<b>${allItems.length}</b></button>
    </div>`;

    html += '<section class="panel">';
    if (finSub === 'svcs') {
      if (fin.svcs.length) {
        html += `<table class="ptbl"><thead><tr><th>${esc(L.thSvc)}</th><th class="r">${esc(L.thQty)}</th><th class="r">${esc(L.thSum)}</th></tr></thead><tbody>`
          + fin.svcs.map(s => {
            const q = Number(s.q) || 1, p = Number(s.p) || 0;
            return `<tr><td>${esc(s.n)}${s.cm ? `<span class="pnote">${esc(s.cm)}</span>` : ''}</td><td class="r">${q} × ${esc(fmtAzn0(p))}</td><td class="r">${esc(fmtAzn0(q * p))}</td></tr>`;
          }).join('')
          + `</tbody><tfoot><tr><td colspan="2">${esc(L.totSvc)}</td><td class="r">${esc(fmtAzn0(fin.svcTotal))}</td></tr></tfoot></table>`;
      } else {
        html += `<div class="empty-s">${esc(L.noSvcs)}</div>`;
      }
    } else if (finSub === 'pays') {
      if (fin.pays.length) {
        html += `<table class="ptbl"><thead><tr><th>${esc(L.thDate)}</th><th>${esc(L.thType)}</th><th class="r">${esc(L.thSum)}</th></tr></thead><tbody>`
          + fin.pays.map(p => `<tr><td>${esc(p.d ? fmtShortDate(p.d) : '—')}</td><td>${esc((L.ptypes && L.ptypes[p.tp]) || p.tp)}${p.cm ? `<span class="pnote">${esc(p.cm)}</span>` : ''}</td><td class="r">${esc(fmtAzn0(p.a))}</td></tr>`).join('')
          + `</tbody><tfoot><tr><td colspan="2">${esc(L.totPaid)}</td><td class="r">${esc(fmtAzn0(fin.paidTotal))}</td></tr></tfoot></table>`;
      } else {
        html += `<div class="empty-s">${esc(L.noPays)}</div>`;
      }
    } else {
      html += allItems.length
        ? `<div class="sub-its">${allItems.map(x => itemSubRowHtml(x, true)).join('')}</div>`
        : `<div class="empty-s">${esc(L.itemsEmpty)}</div>`;
      html += `<div class="shop-foot">
        <span>${itemsSum > 0 ? `${esc(L.itemsTotal)}: <b>${esc(fmtAzn(itemsSum))}</b>` : ''}</span>
        <a class="btn p" href="shop.html">${esc(L.openShop)}</a>
      </div>`;
    }
    html += '</section></div>';

    bodyEl.innerHTML = html;
    bodyEl.querySelectorAll('[data-fsub]').forEach(b => b.onclick = () => { finSub = b.dataset.fsub; renderCabinet(); });
  } else if (activeTab === 'schedule' && showCal) {
    bodyEl.innerHTML = '';
    calSec.hidden = false;
    drawCal();
    drawHours();
  }

  $('#upd').textContent = L.updText(D && D.upd);
  updateChatBadges();
}

function bindTaskExpand(root) {
  root.querySelectorAll('[data-tkey]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.tkey;
      if (openedTasks.has(k)) openedTasks.delete(k); else openedTasks.add(k);
      renderCabinet();
    };
  });
}

function drawCal() {
  const L = I18N[lang];
  const [y, m] = ym.split('-').map(Number), b = T0.split('-').map(Number), k = (y * 12 + m) - (b[0] * 12 + b[1]);
  const off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let h = `<div class="ch"><button id="pm" ${k <= 0 ? 'disabled' : ''}>‹</button><span>${new Date(y, m - 1, 1).toLocaleDateString(L.locale, { month: 'long', year: 'numeric' })}</span><button id="nm" ${k >= 3 ? 'disabled' : ''}>›</button></div><div class="g">` + L.wds.map(x => `<span class="wd">${x}</span>`).join('');
  for (let i = 0; i < off; i++) h += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const s = y + '-' + pad(m) + '-' + pad(d), st = stateOfDay(s);
    h += `<button type="button" class="d ${st === 'past' ? 'past' : st}${s === sel ? ' sel' : ''}${mine.has(s) ? ' mine' : ''}" data-d="${s}">${d}</button>`;
  }
  $('#cal').innerHTML = h + '</div>';
  $('#pm').onclick = () => { ym = iso(new Date(y, m - 2, 1)).slice(0, 7); drawCal(); };
  $('#nm').onclick = () => { ym = iso(new Date(y, m, 1)).slice(0, 7); drawCal(); };
  $('#cal').querySelectorAll('.d').forEach(e => e.onclick = () => { sel = e.dataset.d; drawCal(); drawHours(); });
}

function drawHours() {
  const L = I18N[lang];
  let h = `<h3 class="dayh">${esc(fmtD(sel))}</h3>`;
  if (sel < T0) h += `<p class="muted">${esc(L.dayPast)}</p>`;
  else {
    const b = hoursOf(sel);
    h += '<div class="hs">';
    for (let x = wh[0]; x < wh[1]; x++) h += `<div class="h ${b === 'all' || b.includes(x) ? 'busy' : 'free'}">${pad(x)}:00</div>`;
    h += '</div>';
  }
  $('#hrs').innerHTML = h;
}

const SESSION_KEY = 'tm-client-session';
function saveSession(phone, idx = 0) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ phone, idx })); } catch (e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return obj && typeof obj.phone === 'string' && norm(obj.phone).length >= 7 ? obj : null;
  } catch (e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function stopChatSub() {
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatData = null;
  chatId = null;
  updateChatBadges();
}

function startChatSub(id) {
  stopChatSub();
  chatId = id;
  if (!chatId) return;
  chatUnsub = onSnapshot(doc(db, 'chats', chatId), snap => {
    chatData = snap.exists() ? snap.data() : null;
    updateChatBadges();
    const u = (chatData && Number(chatData.unreadClient)) || 0;
    if (chatOpen) {
      renderChatMessages();
      if (u > 0) markClientRead();
    }
  }, () => {});
}

async function markClientRead() {
  if (!chatId || !chatData || !chatData.unreadClient) return;
  try { await updateDoc(doc(db, 'chats', chatId), { unreadClient: 0 }); } catch (e) {}
}

function fmtMsgTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString(I18N[lang].locale, { hour: '2-digit', minute: '2-digit' });
}
function fmtMsgDay(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString(I18N[lang].locale, { day: 'numeric', month: 'long' });
}

function renderChatMessages() {
  const log = $('#chatLog');
  if (!log) return;
  const L = I18N[lang];
  const msgs = (chatData && Array.isArray(chatData.messages)) ? chatData.messages : [];
  if (!msgs.length) {
    log.innerHTML = `<div class="muted" style="text-align:center;margin:auto;max-width:300px">${esc(L.chatEmpty)}</div>`;
    return;
  }
  let html = '', lastDay = '';
  for (const m of msgs) {
    const dStr = fmtMsgDay(m.ts);
    if (dStr && dStr !== lastDay) { lastDay = dStr; html += `<div class="chat-day">${esc(dStr)}</div>`; }
    const isMe = m.from === 'client';
    html += `<div class="mbub ${isMe ? 'me' : 'them'}">${!isMe ? `<div class="mw">${esc(L.chatMaster)}</div>` : ''}${esc(m.text)}<div class="mt">${esc(fmtMsgTime(m.ts))}</div></div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}

function openChat() {
  if (!chatId || !unlocked) return;
  const L = I18N[lang];
  chatOpen = true;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.id = 'chatOv';
  ov.innerHTML = `<div class="chat-sheet">
    <div class="chat-hd"><h3>${esc(L.chatTitle)}</h3><button type="button" class="btn" id="chatClose" aria-label="Закрыть">×</button></div>
    <div class="chat-log" id="chatLog"></div>
    <form class="chat-bar" id="chatForm">
      <textarea id="chatInp" rows="1" maxlength="1000" placeholder="${esc(L.chatPh)}"></textarea>
      <button type="submit" class="btn p" id="chatSendBtn">${esc(L.chatSend)}</button>
    </form>
  </div>`;
  document.body.appendChild(ov);
  renderChatMessages();
  markClientRead();

  const close = () => { chatOpen = false; ov.remove(); };
  ov.querySelector('#chatClose').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };

  const inp = ov.querySelector('#chatInp');
  const sendBtn = ov.querySelector('#chatSendBtn');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ov.querySelector('#chatForm').requestSubmit(); }
  });

  ov.querySelector('#chatForm').onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    const c = (unlocked.clients && unlocked.clients[activeIdx]) || (unlocked.clients && unlocked.clients[0]) || {};
    const now = Date.now();
    const msg = { id: Math.random().toString(36).slice(2, 10) + now.toString(36).slice(-4), from: 'client', text, ts: now };
    const cName = unlocked.clients.map(x => x.name).filter(Boolean).join(', ') || 'Клиент';
    const cPhone = c.phone || $('#ph').value.trim();
    try {
      const ref = doc(db, 'chats', chatId);
      if (chatData) {
        await updateDoc(ref, {
          clientName: cName,
          phone: cPhone,
          messages: arrayUnion(msg),
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: increment(1),
          unreadClient: 0
        });
      } else {
        await setDoc(ref, {
          clientName: cName,
          phone: cPhone,
          messages: [msg],
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: 1,
          unreadClient: 0
        });
      }
      inp.value = '';
    } catch (ex) {
      alert(I18N[lang].chatErr);
    } finally {
      sendBtn.disabled = false;
      inp.focus();
    }
  };
  inp.focus();
}

/* ===== 7-Digit Azerbaijan Phone Input & Dramatic Auth Transitions ===== */
const OP_CODES = ['50', '51', '55', '99', '70', '77', '10'];
const dBoxes = [...document.querySelectorAll('.dbox')];
let loginBusy = false;

function getOpCode() {
  const selOp = $('#phOp').value;
  return selOp === '__other' ? ($('#phOpC').value || '').replace(/\D/g, '').slice(0, 2) : selOp;
}

function getDigits7() {
  return dBoxes.map(b => (b.value || '').replace(/\D/g, '').slice(0, 1)).join('');
}

function syncHiddenPhone() {
  const op = getOpCode();
  const d7 = getDigits7();
  const formatted = d7.length === 7 ? `+994 ${op} ${d7.slice(0, 3)} ${d7.slice(3, 5)} ${d7.slice(5)}` : (op + d7);
  $('#ph').value = formatted;
  return { op, d7, full: formatted };
}

function fillPhoneFromRaw(raw, autoGo = false) {
  const digits = String(raw || '').replace(/\D/g, '');
  let d7 = '';
  if (digits.length >= 9) {
    const last9 = digits.slice(-9);
    const p2 = last9.slice(0, 2);
    d7 = last9.slice(2);
    if (OP_CODES.includes(p2)) {
      $('#phOp').value = p2;
      $('#phOpC').hidden = true;
    } else {
      $('#phOp').value = '__other';
      $('#phOpC').hidden = false;
      $('#phOpC').value = p2;
    }
  } else {
    d7 = digits.slice(0, 7);
  }
  dBoxes.forEach((b, i) => {
    b.value = d7[i] || '';
    b.classList.toggle('filled', Boolean(d7[i]));
  });
  syncHiddenPhone();
  if (autoGo && getOpCode().length === 2 && d7.length === 7) {
    dBoxes[6].blur();
    login();
  }
}

function clearPhoneBoxes() {
  dBoxes.forEach(b => { b.value = ''; b.classList.remove('filled', 'pop'); });
  $('#digitsRow').classList.remove('ok', 'shake');
  $('#ph').value = '';
}

function setAuthMode(on) {
  document.body.classList.toggle('auth-mode', on);
  $('#loginBg').hidden = !on;
  if (on) $('#loginBg').classList.remove('fade-out');
}

const SPIN_SVG = `<svg viewBox="0 0 68 68" fill="none">
  <circle cx="34" cy="34" r="28" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="34" cy="34" r="28" stroke="#f03e38" stroke-width="4" stroke-linecap="round" stroke-dasharray="56 125">
    <animateTransform attributeName="transform" type="rotate" from="0 34 34" to="360 34 34" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="34" r="19" stroke="rgba(96,165,250,0.65)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 96">
    <animateTransform attributeName="transform" type="rotate" from="360 34 34" to="0 34 34" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>`;

const OK_SVG = `<svg viewBox="0 0 68 68" fill="none">
  <circle cx="34" cy="34" r="28" fill="rgba(16,201,136,0.16)" stroke="#10c988" stroke-width="3.5">
    <animate attributeName="r" values="24;28" dur="0.3s" fill="freeze"/>
  </circle>
  <path d="M22 34.5 L30.5 43 L46.5 26" stroke="#10c988" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="42" stroke-dashoffset="42">
    <animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.35s" fill="freeze"/>
  </path>
</svg>`;

function showAuthOverlay(state, title, sub) {
  const ov = $('#authOv');
  if (!state) { ov.hidden = true; return; }
  $('#authSpin').innerHTML = state === 'ok' ? OK_SVG : SPIN_SVG;
  $('#authStTitle').textContent = title || '';
  $('#authStSub').textContent = sub || '';
  ov.hidden = false;
}

function shakeDigits() {
  const row = $('#digitsRow');
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
}

$('#phOp').onchange = () => {
  const isOth = $('#phOp').value === '__other';
  $('#phOpC').hidden = !isOth;
  syncHiddenPhone();
  if (isOth) $('#phOpC').focus();
  else {
    const firstEmpty = dBoxes.find(b => !b.value) || dBoxes[0];
    firstEmpty.focus();
    if (getDigits7().length === 7) login();
  }
};

$('#phOpC').oninput = () => {
  $('#phOpC').value = $('#phOpC').value.replace(/\D/g, '').slice(0, 2);
  syncHiddenPhone();
  if ($('#phOpC').value.length === 2) {
    const firstEmpty = dBoxes.find(b => !b.value) || dBoxes[0];
    firstEmpty.focus();
    if (getDigits7().length === 7) login();
  }
};

dBoxes.forEach((box, idx) => {
  box.addEventListener('focus', () => {
    setTimeout(() => { try { box.select(); } catch (e) {} }, 0);
  });
  box.addEventListener('input', () => {
    $('#err').textContent = '';
    const digits = (box.value || '').replace(/\D/g, '');
    if (digits.length > 1) {
      fillPhoneFromRaw(digits, true);
      return;
    }
    box.value = digits;
    box.classList.toggle('filled', Boolean(digits));
    if (digits) {
      box.classList.remove('pop');
      void box.offsetWidth;
      box.classList.add('pop');
      syncHiddenPhone();
      if (idx < 6) {
        dBoxes[idx + 1].focus();
      } else if (getOpCode().length === 2 && getDigits7().length === 7) {
        box.blur();
        login();
      }
    } else {
      syncHiddenPhone();
    }
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace') {
      if (!box.value && idx > 0) {
        e.preventDefault();
        dBoxes[idx - 1].value = '';
        dBoxes[idx - 1].classList.remove('filled');
        dBoxes[idx - 1].focus();
        syncHiddenPhone();
      }
    } else if (e.key === 'ArrowLeft' && idx > 0) {
      e.preventDefault(); dBoxes[idx - 1].focus();
    } else if (e.key === 'ArrowRight' && idx < 6) {
      e.preventDefault(); dBoxes[idx + 1].focus();
    } else if (e.key === 'Enter') {
      e.preventDefault(); login();
    }
  });
  box.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const d = txt.replace(/\D/g, '');
    if (d.length >= 2) {
      e.preventDefault();
      fillPhoneFromRaw(d, true);
    }
  });
});

function doLogout() {
  clearSession();
  stopChatSub();
  unlocked = null;
  activeTab = 'overview';
  workFilter = 'all';
  finSub = null;
  openedTasks.clear();
  clearPhoneBoxes();
  showAuthOverlay(null);
  $('#loginCard').classList.remove('exiting');
  $('#view').classList.remove('cab-enter');
  $('#hsub').textContent = 'Techmaster IT Solutions';
  $('#hdrActs').hidden = true;
  $('#view').hidden = true;
  $('#login').hidden = false;
  setAuthMode(true);
  $('#err').textContent = '';
  dBoxes[0].focus();
}

async function login() {
  if (loginBusy) return;
  const L = I18N[lang];
  const err = m => { $('#err').textContent = m; };
  const { op, d7, full } = syncHiddenPhone();
  if (op.length !== 2 || d7.length !== 7) {
    err(L.errShort);
    shakeDigits();
    if (op.length !== 2) { $('#phOpC').hidden = false; $('#phOpC').focus(); }
    else { (dBoxes.find(b => !b.value) || dBoxes[0]).focus(); }
    return;
  }
  if (!(window.crypto && crypto.subtle)) { err(L.errCrypto); return; }

  loginBusy = true;
  err('');
  showAuthOverlay('loading', L.checking, L.checkingSub);

  try {
    const portal = await loadPortal();
    if (!portal) {
      showAuthOverlay(null);
      err(L.errNoData);
      shakeDigits();
      return;
    }
    const data = await unlock(full);
    if (!data) {
      showAuthOverlay(null);
      err(L.errNotFound);
      shakeDigits();
      dBoxes[6].focus();
      return;
    }

    // Success! Show emerald check + personalized greeting, then dramatic reveal!
    $('#digitsRow').classList.add('ok');
    const firstName = (data.clients && data.clients[0] && data.clients[0].name) ? data.clients[0].name.split(/\s+/)[0] : '';
    showAuthOverlay('ok', firstName ? L.welcome(firstName) : L.pageTitle, L.welcomeSub);

    unlocked = data;
    activeIdx = 0;
    activeTab = 'overview';
    workFilter = 'all';
    finSub = null;
    openedTasks.clear();
    saveSession(full, 0);
    startChatSub(data._chatId);

    await new Promise(r => setTimeout(r, 760));
    $('#loginCard').classList.add('exiting');
    $('#loginBg').classList.add('fade-out');
    await new Promise(r => setTimeout(r, 380));

    showAuthOverlay(null);
    $('#loginCard').classList.remove('exiting');
    $('#login').hidden = true;
    setAuthMode(false);
    $('#view').hidden = false;
    $('#view').classList.remove('cab-enter');
    void $('#view').offsetWidth;
    $('#view').classList.add('cab-enter');
    renderCabinet();
    window.scrollTo(0, 0);
  } catch (e) {
    showAuthOverlay(null);
    err(L.errNet);
    shakeDigits();
  } finally {
    loginBusy = false;
  }
}

async function restoreSession() {
  const saved = loadSession();
  if (!saved || !(window.crypto && crypto.subtle)) {
    setAuthMode(true);
    return;
  }
  fillPhoneFromRaw(saved.phone, false);
  setAuthMode(true);
  $('#login').hidden = true;
  $('#loading').hidden = false;
  try {
    const portal = await loadPortal();
    if (!portal) {
      $('#loading').hidden = true;
      $('#login').hidden = false;
      $('#err').textContent = I18N[lang].errNoData;
      return;
    }
    const data = await unlock(saved.phone);
    if (!data) {
      clearSession();
      clearPhoneBoxes();
      $('#loading').hidden = true;
      $('#login').hidden = false;
      return;
    }
    unlocked = data;
    activeIdx = Number(saved.idx) || 0;
    startChatSub(data._chatId);
    $('#loading').hidden = true;
    setAuthMode(false);
    $('#view').hidden = false;
    $('#view').classList.add('cab-enter');
    renderCabinet();
  } catch (e) {
    $('#loading').hidden = true;
    $('#login').hidden = false;
    $('#err').textContent = I18N[lang].errNet;
  }
}

$('#hdrChatBtn').onclick = openChat;
$('#hdrProfBtn').onclick = openProfile;

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    lang = btn.dataset.lang;
    try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
    applyLangStatic();
    if (unlocked) renderCabinet();
  };
});

applyLangStatic();
restoreSession();
</script>
