<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный кабинет — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--warn:#fa8c16;--warn-bg:#fff5e6;--soft:#fdecec;--blue:#2563eb;--blue-bg:#eef4ff;--gbg:#e6f8f1;--gbd:#00b578;--rbg:#fdecec;--rbd:#e52520;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 48px;max-width:640px;margin-inline:auto}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{margin:0;line-height:0;flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:26px;height:26px;display:block}
h1{font-size:18px;font-weight:700;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:16px;height:11px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 span{font-weight:600;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:10px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input[type=tel]{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=tel]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 10px rgba(229,37,32,.24)}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:6px}
.tab{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.info-grid{display:grid;grid-template-columns:1fr}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-k{color:var(--muted);flex:none}
.info-v{font-weight:600;text-align:right;word-break:break-word}
.msg{margin-top:10px;padding:11px 13px;background:var(--blue-bg);color:var(--text);border-left:3px solid var(--blue);border-radius:10px;font-size:14px;white-space:pre-wrap}
.prog-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:116px;height:116px;flex:none}
.donut svg{width:116px;height:116px;display:block;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-pct{font-size:24px;font-weight:700;line-height:1.1}
.donut-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.stats{flex:1;min-width:170px;display:flex;flex-direction:column;gap:4px}
.st-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-l{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.pr{background:var(--accent)}.dot.td{background:var(--line)}
.st-v{font-weight:700}
.bar-wrap{height:7px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;margin-top:14px}
.bar-ok{background:var(--ok);height:100%}
.bar-pr{background:var(--accent);height:100%}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:flex-start;gap:10px}
.titem.act{background:var(--soft);border-color:var(--accent)}
.titem.dn .tt{color:var(--muted)}
.tic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.tic.ok{background:var(--ok);color:#fff}
.tic.pr{background:var(--accent);color:var(--on)}
.tic.td{border:1.8px solid var(--muted);color:var(--muted)}
.tmain{flex:1;min-width:0}
.tt{font-weight:600;font-size:15px}
.tm{color:var(--muted);font-size:13px;margin-top:2px}
.tn{margin-top:7px;font-size:13px;padding:7px 10px;background:var(--card);border-left:3px solid var(--accent);border-radius:8px;white-space:pre-wrap}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;vertical-align:1px;background:var(--soft);color:var(--accent)}
.badge.ok{background:var(--gbg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.sub-its{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:6px}
.sub-it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px}
.sub-it-l{flex:1;min-width:0}
.sub-it-m{font-size:12px;color:var(--muted)}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.fin-bal{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fin-bal.debt{background:var(--rbg);color:var(--danger)}
.fin-bal.ok{background:var(--gbg);color:var(--ok)}
.ptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ptbl th{text-align:left;font-weight:600;color:var(--muted);padding:7px 5px;border-bottom:1px solid var(--line);font-size:12px}
.ptbl td{padding:9px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.ptbl th.r,.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:10px}
.pnote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.subh{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.chat-btn-row{margin-top:12px;display:flex;gap:8px;align-items:center}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#fff;color:var(--accent);font-size:12px;font-weight:700;margin-left:8px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.chat-sheet{background:var(--card);width:100%;max-width:640px;height:86dvh;max-height:760px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.chat-hd h3{margin:0;font-size:16px;font-weight:700}
.chat-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat-day{align-self:center;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:6px 0 2px}
.mbub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mbub.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.mbub.them{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbub .mw{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.mbub .mt{font-size:11px;opacity:.75;margin-top:4px;text-align:right}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-bar textarea{flex:1;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:110px;resize:none}
.chat-bar .btn{padding:10px 16px;flex:none}
.empty-s{color:var(--muted);font-size:14px;padding:6px 0}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.free{background:var(--gbg);border-color:var(--gbd)}.busy{background:var(--rbg);border-color:var(--rbd)}.part{background:linear-gradient(135deg,var(--rbg) 50%,var(--gbg) 50%);border-color:var(--rbd)}
.ch{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;text-transform:capitalize;font-weight:700}
.ch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:5px 12px;font-size:16px;cursor:pointer}.ch button:disabled{opacity:.3;cursor:default}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.d{position:relative;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:0;cursor:pointer}
.d.past{opacity:.35}.d.sel{outline:2.5px solid var(--accent);outline-offset:1px;font-weight:700}
.d.mine::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.h{text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid;font-size:14px;font-weight:600}
h3.dayh{font-size:14px;font-weight:700;margin:12px 0 6px;text-transform:capitalize}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:12px;font-size:13px;color:var(--muted)}
.reg-link{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.reg-link a{color:var(--accent);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16.09 6.35 L16.57 2.33 L23.43 2.33 L23.91 6.35 A14.2 14.2 0 0 1 29.86 9.79 L33.58 8.19 L37.02 14.14 L33.78 16.56 A14.2 14.2 0 0 1 33.78 23.44 L37.02 25.86 L33.58 31.81 L29.86 30.21 A14.2 14.2 0 0 1 23.91 33.65 L23.43 37.67 L16.57 37.67 L16.09 33.65 A14.2 14.2 0 0 1 10.14 30.21 L6.42 31.81 L2.98 25.86 L6.22 23.44 A14.2 14.2 0 0 1 6.22 16.56 L2.98 14.14 L6.42 8.19 L10.14 9.79 A14.2 14.2 0 0 1 16.09 6.35 Z"/><circle cx="20" cy="20" r="8.8"/><path d="M20 20V14.2M20 20l4.2 2.4"/></svg></div>
    <div>
      <h1 id="htitle">Личный кабинет</h1>
      <div class="sub">Techmaster IT Solutions</div>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ru" id="btn-ru">
      <svg class="flag" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="4" fill="#ffffff"/><rect y="4" width="18" height="4" fill="#0039a6"/><rect y="8" width="18" height="4" fill="#d52b1e"/></svg>
      <span>RU</span>
    </button>
    <button type="button" data-lang="az" id="btn-az">
      <svg class="flag" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="4" fill="#00b5e2"/><rect y="4" width="18" height="4" fill="#ef3340"/><rect y="8" width="18" height="4" fill="#509e2f"/><circle cx="8.7" cy="6" r="1.45" fill="#ffffff"/><circle cx="9.15" cy="6" r="1.15" fill="#ef3340"/><circle cx="10.4" cy="6" r=".48" fill="#ffffff"/></svg>
      <span>AZ</span>
    </button>
  </div>
</header>

<main>
  <section id="loading" class="panel" hidden>
    <div class="muted" id="loadTxt" style="text-align:center;padding:18px 0">Загрузка кабинета…</div>
  </section>

  <section id="login" class="panel">
    <h2 id="lTitle">Вход в личный кабинет</h2>
    <div class="muted" id="lHint">Введите номер телефона, который вы указывали при заказе.</div>
    <label class="fld" for="ph" id="lPhLbl">Номер телефона</label>
    <input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="+994 50 123 45 67">
    <div id="err" class="err"></div>
    <div class="row"><button id="go" class="btn p full">Войти</button></div>
    <div class="reg-link">
      <span id="lNoAcc">Ещё не регистрировались?</span>
      <span><a href="register.html" id="lRegLink">Заполнить анкету</a> · <a href="shop.html" id="lShopLink">Магазин</a></span>
    </div>
  </section>

  <section id="view" hidden>
    <div id="objTabs" class="tabs" hidden></div>
    <div id="cabinet"></div>
    <section id="calSec" class="panel" hidden>
      <h2 id="calTitle">График занятости мастера</h2>
      <div class="leg" id="calLeg"></div>
      <div id="cal"></div>
      <div id="hrs"></div>
    </section>
    <div class="foot">
      <span id="upd"></span>
      <button type="button" class="btn" id="logoutBtn">Выйти</button>
    </div>
  </section>
</main>

<script type="module">

import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const I18N = {

    inProgTitle: 'Сейчас в работе',
    inProgBadge: 'В работе',
    inProgEmpty: 'Сейчас нет активного этапа в работе.',
    todoTitle: 'Запланировано',

    wds: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
    dayPast: 'Этот день уже прошёл.',
    updText: u => `Обновлено: ${u || '—'}. График может меняться, уточняйте время у мастера.`,
    logout: 'Выйти',
    shopLink: 'Магазин',
    openShop: 'Открыть магазин',
    itemsTitle: 'Товары и закупки',
    itemsEmpty: 'К вашим задачам пока не добавлены товары.',
    itemsTotal: 'Итого по товарам',
    etaLbl: 'Получение',

async function loadPortal() {
  if (D) return D;
  if (!loadPromise) {

      wh = Array.isArray(D.wh) && D.wh.length === 2 ? D.wh : [9, 18];
      N = wh[1] - wh[0];

    }).catch(err => {

/*CRYPTO*/
const norm = p => String(p).replace(/\D/g, '').slice(-9);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
async function unlock(phone) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(phone)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, km, 384));
  const recId = hex(bits.slice(0, 16));
  const rec = (D.recs || []).find(r => r.id === recId);
  if (!rec) return null;
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.iv) }, key, b64(rec.ct));
  const parsed = JSON.parse(new TextDecoder().decode(pt));
  parsed._chatId = recId;
  return parsed;
}

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const hoursOf = d => (D.full || []).includes(d) ? 'all' : ((D.busy && D.busy[d]) || []);
function stateOfDay(d) {
  if (d < T0) return 'past';
  const b = hoursOf(d), n = b === 'all' ? N : b.length;
  return n === 0 ? 'free' : n >= N ? 'busy' : 'part';
}

function donutSvg(pct, doneShare, progShare) {
  const r = 46, C = 2 * Math.PI * r;
  const okLen = Math.max(0, Math.min(1, doneShare)) * C;
  const prLen = Math.max(0, Math.min(1 - doneShare, progShare)) * C;
  return `<div class="donut">
    <svg viewBox="0 0 116 116" aria-hidden="true">
      <circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
      ${prLen > 0.5 ? `<circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--accent)" stroke-width="11" stroke-dasharray="${prLen.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-okLen).toFixed(2)}"/>` : ''}
      ${okLen > 0.5 ? `<circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--ok)" stroke-width="11" stroke-dasharray="${okLen.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="0"/>` : ''}
    </svg>
    <div class="donut-c">
      <div class="donut-pct">${pct}%</div>
      <div class="donut-lbl">${esc(I18N[lang].pctSub)}</div>
    </div>
  </div>`;
}

const IST_CLS = { pending: 'info', ordered: 'warn', bought: '', received: 'ok' };
const fmtAzn = p => { const n = Number(p); return (Number.isFinite(n) && n > 0) ? ((Number.isInteger(n) ? n : n.toFixed(2)) + ' ₼') : ''; };
const fmtAzn0 = p => { const n = Number(p) || 0; return (Number.isInteger(n) ? n : n.toFixed(2)) + ' ₼'; };
function fmtShortDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString(I18N[lang].locale, { day: 'numeric', month: 'short' });
}
function itemSubRowHtml(x) {
  const L = I18N[lang];
  const stLbl = (L.ist && L.ist[x.s]) || L.ist.pending;
  const stCls = IST_CLS[x.s] !== undefined ? IST_CLS[x.s] : 'info';
  const sum = x.p > 0 ? fmtAzn(x.p * (Number(x.q) || 1)) : '';
  const eta = x.dt ? `${L.etaLbl}: ${fmtShortDate(x.dt)}` : '';
  const meta = [sum, eta].filter(Boolean).join(' · ');
  return `<div class="sub-it">
    <div class="sub-it-l"><div><b>${esc(x.n)}</b> × ${Number(x.q) || 1}</div>${meta ? `<div class="sub-it-m">${esc(meta)}</div>` : ''}</div>
    <span class="badge ${stCls}" style="margin-left:0;flex:none">${esc(stLbl)}</span>
  </div>`;
}

function taskRowHtml(t, kind) {
  const L = I18N[lang];
  const meta = [fmtD(t.d) + (t.tm ? ', ' + t.tm : ''), t.w, t.e].filter(Boolean).join(' · ');
  const ic = kind === 'done'

}

function renderCabinet() {
  if (!unlocked || !unlocked.clients || !unlocked.clients.length) return;
  const L = I18N[lang];
  const list = unlocked.clients;
  if (activeIdx >= list.length) activeIdx = 0;
  const c = list[activeIdx];

  // Object switcher when multiple clients share a phone number
  const tabsEl = $('#objTabs');
  if (list.length > 1) {
    tabsEl.hidden = false;
    tabsEl.innerHTML = list.map((x, i) => `<button type="button" class="tab${i === activeIdx ? ' on' : ''}" data-cidx="${i}">${esc(x.proj || x.name)}</button>`).join('');
    tabsEl.querySelectorAll('[data-cidx]').forEach(b => b.onclick = () => {
      activeIdx = Number(b.dataset.cidx);
      const s = loadSession();
      if (s && s.phone) saveSession(s.phone, activeIdx);
      renderCabinet();
    });
  } else {
    tabsEl.hidden = true;
  }

  const allTasks = Array.isArray(c.tasks) ? c.tasks : [];
  const inProg = allTasks.filter(t => taskStatus(t) === 'in_progress').sort(cmp);
  const todo = allTasks.filter(t => taskStatus(t) === 'todo').sort(cmp);
  const done = allTasks.filter(t => taskStatus(t) === 'done').sort(cmp).reverse();
  const total = allTasks.length;

  const hasManualPct = typeof c.pct === 'number' && Number.isFinite(c.pct);
  const pct = hasManualPct ? Math.max(0, Math.min(100, Math.round(c.pct))) : (total ? Math.round((done.length / total) * 100) : 0);
  const doneShare = hasManualPct ? (pct / 100) : (total ? done.length / total : 0);
  const progShare = hasManualPct ? 0 : (total ? inProg.length / total : 0);

  // Update "my task dates" dots on calendar
  mine.clear();
  for (const t of [...inProg, ...todo]) { if (t.d) mine.add(t.d); }

  const phoneShow = c.phone || $('#ph').value.trim();

  let html = '';

  // 1. My data panel
  const unreadC = (chatData && Number(chatData.unreadClient)) || 0;
  html += `<section class="panel">
    <h2>${esc(L.myData)}</h2>
    <div class="info-grid">
      <div class="info-row"><span class="info-k">${esc(L.kName)}</span><span class="info-v">${esc(c.name || '—')}</span></div>
      ${phoneShow ? `<div class="info-row"><span class="info-k">${esc(L.kPhone)}</span><span class="info-v">${esc(phoneShow)}</span></div>` : ''}
      ${c.proj ? `<div class="info-row"><span class="info-k">${esc(L.kProj)}</span><span class="info-v">${esc(c.proj)}</span></div>` : ''}
      ${c.addr ? `<div class="info-row"><span class="info-k">${esc(L.kAddr)}</span><span class="info-v">${esc(c.addr)}</span></div>` : ''}
    </div>
    ${c.msg ? `<div class="msg">${esc(c.msg)}</div>` : ''}
    <div class="chat-btn-row">
      <button type="button" class="btn p full" id="openChatBtn">${esc(L.chatBtn)}<span class="cbadge" id="chatBadge"${unreadC ? '' : ' hidden'}>${unreadC}</span></button>
    </div>
  </section>`;

  // 2. Progress chart panel
  html += `<section class="panel">
    <h2>${esc(L.progressTitle)}<span>${done.length} / ${total}</span></h2>
    <div class="prog-box">
      ${donutSvg(pct, doneShare, progShare)}
      <div class="stats">
        <div class="st-row"><span class="st-l"><i class="dot ok"></i>${esc(L.stDone)}</span><span class="st-v">${done.length}</span></div>
        <div class="st-row"><span class="st-l"><i class="dot pr"></i>${esc(L.stProg)}</span><span class="st-v">${inProg.length}</span></div>
        <div class="st-row"><span class="st-l"><i class="dot td"></i>${esc(L.stTodo)}</span><span class="st-v">${todo.length}</span></div>
        <div class="st-row"><span class="st-l">${esc(L.stTotal)}</span><span class="st-v">${total}</span></div>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar-ok" style="width:${(doneShare * 100).toFixed(1)}%"></div>
      <div class="bar-pr" style="width:${(progShare * 100).toFixed(1)}%"></div>
    </div>
  </section>`;

  // 3. Currently in progress
  html += `<section class="panel">
    <h2>${esc(L.inProgTitle)}<span>${inProg.length}</span></h2>
    ${inProg.length
      ? `<div class="tlist">${inProg.map(t => taskRowHtml(t, 'in_progress')).join('')}</div>`
      : `<div class="empty-s">${esc(L.inProgEmpty)}</div>`}
  </section>`;

  // 4. Planned / upcoming
  if (todo.length) {
    html += `<section class="panel">
      <h2>${esc(L.todoTitle)}<span>${todo.length}</span></h2>
      <div class="tlist">${todo.map(t => taskRowHtml(t, 'todo')).join('')}</div>
    </section>`;
  }

  // 5. Completed works
  html += `<section class="panel">
    <h2>${esc(L.doneTitle)}<span>${done.length}</span></h2>
    ${done.length
      ? `<div class="tlist">${done.map(t => taskRowHtml(t, 'done')).join('')}</div>`
      : `<div class="empty-s">${esc(L.doneEmpty)}</div>`}
  </section>`;

  // 6. Services cost, payment schedule & balance
  const svcs = Array.isArray(c.svcs) ? c.svcs : [];
  const pays = Array.isArray(c.pays) ? [...c.pays].sort((a, b) => (b.d || '').localeCompare(a.d || '')) : [];
  if (svcs.length || pays.length) {
    const svcTotal = Math.round(svcs.reduce((acc, s) => acc + (Number(s.q) || 1) * (Number(s.p) || 0), 0) * 100) / 100;
    const paidTotal = Math.round(pays.reduce((acc, p) => acc + (Number(p.a) || 0), 0) * 100) / 100;
    const bal = Math.round((svcTotal - paidTotal) * 100) / 100;

        + `</tbody><tfoot><tr><td colspan="2">${esc(L.totSvc)}</td><td class="r">${esc(fmtAzn0(svcTotal))}</td></tr></tfoot></table>`;
    }
    finHtml += `<div class="subh">${esc(L.paySub)}</div>`;
    if (pays.length) {
      finHtml += `<table class="ptbl"><thead><tr><th>${esc(L.thDate)}</th><th>${esc(L.thType)}</th><th class="r">${esc(L.thSum)}</th></tr></thead><tbody>`
        + pays.map(p => `<tr><td>${esc(p.d ? fmtShortDate(p.d) : '—')}</td><td>${esc((L.ptypes && L.ptypes[p.tp]) || p.tp)}${p.cm ? `<span class="pnote">${esc(p.cm)}</span>` : ''}</td><td class="r">${esc(fmtAzn0(p.a))}</td></tr>`).join('')
        + `</tbody><tfoot><tr><td colspan="2">${esc(L.totPaid)}</td><td class="r">${esc(fmtAzn0(paidTotal))}</td></tr></tfoot></table>`;
    } else {
      finHtml += `<div class="empty-s">${esc(L.noPays)}</div>`;
    }
    finHtml += `<div class="fin-bal${balCls}"><span>${esc(balLbl)}</span><span>${esc(fmtAzn0(Math.abs(bal)))}</span></div></section>`;
    html += finHtml;
  }

  // 7. Equipment & purchases summary + link to shop
  const allItems = [];
  for (const t of allTasks) {
    if (Array.isArray(t.it)) {
      for (const x of t.it) allItems.push(Object.assign({ taskTitle: t.t }, x));

  }
  const itemsSum = allItems.reduce((acc, x) => acc + (Number(x.p) > 0 ? Number(x.p) * (Number(x.q) || 1) : 0), 0);
  html += `<section class="panel">
    <h2>${esc(L.itemsTitle)}<span>${allItems.length}</span></h2>
    ${allItems.length
      ? `<div class="sub-its" style="border-top:1px solid var(--line);margin-top:0;padding-top:8px">${allItems.map(itemSubRowHtml).join('')}</div>`
      : `<div class="empty-s">${esc(L.itemsEmpty)}</div>`}

      <span>${itemsSum > 0 ? `${esc(L.itemsTotal)}: <b>${esc(fmtAzn(itemsSum))}</b>` : ''}</span>
      <a class="btn p" href="shop.html">${esc(L.openShop)}</a>
    </div>

  $('#cabinet').innerHTML = html;
  const chatBtn = $('#openChatBtn');
  if (chatBtn) chatBtn.onclick = openChat;

  // 6. Master availability calendar (if enabled for this client)
  const showCal = c.cal !== false;
  $('#calSec').hidden = !showCal;
  if (showCal) { drawCal(); drawHours(); }

  $('#upd').textContent = L.updText(D && D.upd);
}

function drawCal() {
  const L = I18N[lang];
  const [y, m] = ym.split('-').map(Number), b = T0.split('-').map(Number), k = (y * 12 + m) - (b[0] * 12 + b[1]);
  const off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let h = `<div class="ch"><button id="pm" ${k <= 0 ? 'disabled' : ''}>‹</button><span>${new Date(y, m - 1, 1).toLocaleDateString(L.locale, { month: 'long', year: 'numeric' })}</span><button id="nm" ${k >= 3 ? 'disabled' : ''}>›</button></div><div class="g">` + L.wds.map(x => `<span class="wd">${x}</span>`).join('');
  for (let i = 0; i < off; i++) h += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const s = y + '-' + pad(m) + '-' + pad(d), st = stateOfDay(s);
    h += `<button type="button" class="d ${st === 'past' ? 'past' : st}${s === sel ? ' sel' : ''}${mine.has(s) ? ' mine' : ''}" data-d="${s}">${d}</button>`;
  }
  $('#cal').innerHTML = h + '</div>';
  $('#pm').onclick = () => { ym = iso(new Date(y, m - 2, 1)).slice(0, 7); drawCal(); };
  $('#nm').onclick = () => { ym = iso(new Date(y, m, 1)).slice(0, 7); drawCal(); };
  $('#cal').querySelectorAll('.d').forEach(e => e.onclick = () => { sel = e.dataset.d; drawCal(); drawHours(); });
}

function drawHours() {
  const L = I18N[lang];
  let h = `<h3 class="dayh">${esc(fmtD(sel))}</h3>`;
  if (sel < T0) h += `<p class="muted">${esc(L.dayPast)}</p>`;
  else {
    const b = hoursOf(sel);
    h += '<div class="hs">';
    for (let x = wh[0]; x < wh[1]; x++) h += `<div class="h ${b === 'all' || b.includes(x) ? 'busy' : 'free'}">${pad(x)}:00</div>`;
    h += '</div>';
  }
  $('#hrs').innerHTML = h;
}

const SESSION_KEY = 'tm-client-session';
function saveSession(phone, idx = 0) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ phone, idx })); } catch (e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return obj && typeof obj.phone === 'string' && norm(obj.phone).length >= 7 ? obj : null;
  } catch (e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function stopChatSub() {
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatData = null;
  chatId = null;
}

function startChatSub(id) {
  stopChatSub();
  chatId = id;
  if (!chatId) return;
  chatUnsub = onSnapshot(doc(db, 'chats', chatId), snap => {
    chatData = snap.exists() ? snap.data() : null;
    const badge = $('#chatBadge');
    const u = (chatData && Number(chatData.unreadClient)) || 0;
    if (badge) { badge.textContent = u; badge.hidden = u === 0; }
    if (chatOpen) {
      renderChatMessages();
      if (u > 0) markClientRead();
    }
  }, () => {});
}

async function markClientRead() {
  if (!chatId || !chatData || !chatData.unreadClient) return;
  try { await updateDoc(doc(db, 'chats', chatId), { unreadClient: 0 }); } catch (e) {}
}

function fmtMsgTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString(I18N[lang].locale, { hour: '2-digit', minute: '2-digit' });
}
function fmtMsgDay(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString(I18N[lang].locale, { day: 'numeric', month: 'long' });
}

function renderChatMessages() {
  const log = $('#chatLog');
  if (!log) return;
  const L = I18N[lang];
  const msgs = (chatData && Array.isArray(chatData.messages)) ? chatData.messages : [];
  if (!msgs.length) {
    log.innerHTML = `<div class="muted" style="text-align:center;margin:auto;max-width:300px">${esc(L.chatEmpty)}</div>`;
    return;
  }
  let html = '', lastDay = '';
  for (const m of msgs) {
    const dStr = fmtMsgDay(m.ts);
    if (dStr && dStr !== lastDay) { lastDay = dStr; html += `<div class="chat-day">${esc(dStr)}</div>`; }
    const isMe = m.from === 'client';
    html += `<div class="mbub ${isMe ? 'me' : 'them'}">${!isMe ? `<div class="mw">${esc(L.chatMaster)}</div>` : ''}${esc(m.text)}<div class="mt">${esc(fmtMsgTime(m.ts))}</div></div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}

function openChat() {
  if (!chatId || !unlocked) return;
  const L = I18N[lang];
  chatOpen = true;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.id = 'chatOv';
  ov.innerHTML = `<div class="chat-sheet">
    <div class="chat-hd"><h3>${esc(L.chatTitle)}</h3><button type="button" class="btn" id="chatClose" aria-label="Закрыть">×</button></div>
    <div class="chat-log" id="chatLog"></div>
    <form class="chat-bar" id="chatForm">
      <textarea id="chatInp" rows="1" maxlength="1000" placeholder="${esc(L.chatPh)}"></textarea>
      <button type="submit" class="btn p" id="chatSendBtn">${esc(L.chatSend)}</button>
    </form>
  </div>`;
  document.body.appendChild(ov);
  renderChatMessages();
  markClientRead();

  const close = () => { chatOpen = false; ov.remove(); };
  ov.querySelector('#chatClose').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };

  const inp = ov.querySelector('#chatInp');
  const sendBtn = ov.querySelector('#chatSendBtn');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ov.querySelector('#chatForm').requestSubmit(); }
  });

  ov.querySelector('#chatForm').onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    const c = (unlocked.clients && unlocked.clients[activeIdx]) || (unlocked.clients && unlocked.clients[0]) || {};
    const now = Date.now();
    const msg = { id: Math.random().toString(36).slice(2, 10) + now.toString(36).slice(-4), from: 'client', text, ts: now };
    const cName = unlocked.clients.map(x => x.name).filter(Boolean).join(', ') || 'Клиент';
    const cPhone = c.phone || $('#ph').value.trim();
    try {
      const ref = doc(db, 'chats', chatId);
      if (chatData) {
        await updateDoc(ref, {
          clientName: cName,
          phone: cPhone,
          messages: arrayUnion(msg),
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: increment(1),
          unreadClient: 0
        });
      } else {
        await setDoc(ref, {
          clientName: cName,
          phone: cPhone,
          messages: [msg],
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: 1,
          unreadClient: 0
        });
      }
      inp.value = '';
    } catch (ex) {
      alert(I18N[lang].chatErr);
    } finally {
      sendBtn.disabled = false;
      inp.focus();
    }
  };
  inp.focus();
}

async function login() {
  const L = I18N[lang];
  const err = m => { $('#err').textContent = m; }, btn = $('#go');
  const rawPhone = $('#ph').value.trim();
  if (norm(rawPhone).length < 7) { err(L.errShort); return; }
  if (!(window.crypto && crypto.subtle)) { err(L.errCrypto); return; }
  err('');
  btn.disabled = true;
  btn.textContent = L.checking;
  try {
    const portal = await loadPortal();
    if (!portal) { err(L.errNoData); return; }
    const data = await unlock(rawPhone);
    if (!data) { err(L.errNotFound); return; }
    unlocked = data;
    activeIdx = 0;
    saveSession(rawPhone, 0);
    startChatSub(data._chatId);
    $('#login').hidden = true;
    $('#view').hidden = false;
    renderCabinet();
    window.scrollTo(0, 0);
  } catch (e) {
    err(L.errNet);
  } finally {
    btn.disabled = false;
    btn.textContent = I18N[lang].enter;
  }
}

async function restoreSession() {
  const saved = loadSession();
  if (!saved || !(window.crypto && crypto.subtle)) return;
  $('#ph').value = saved.phone;
  $('#login').hidden = true;
  $('#loading').hidden = false;
  try {
    const portal = await loadPortal();
    if (!portal) {
      $('#loading').hidden = true;
      $('#login').hidden = false;
      $('#err').textContent = I18N[lang].errNoData;
      return;
    }
    const data = await unlock(saved.phone);
    if (!data) {
      clearSession();
      $('#loading').hidden = true;
      $('#login').hidden = false;
      return;
    }
    unlocked = data;
    activeIdx = Number(saved.idx) || 0;
    startChatSub(data._chatId);
    $('#loading').hidden = true;
    $('#view').hidden = false;
    renderCabinet();
  } catch (e) {
    $('#loading').hidden = true;
    $('#login').hidden = false;
    $('#err').textContent = I18N[lang].errNet;
  }
}

$('#go').onclick = login;
$('#ph').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logoutBtn').onclick = () => {
  clearSession();
  stopChatSub();
  unlocked = null;
  $('#ph').value = '';
  $('#view').hidden = true;
  $('#login').hidden = false;
  $('#err').textContent = '';
  $('#ph').focus();
};

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    lang = btn.dataset.lang;
    try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
    applyLangStatic();
    if (unlocked) renderCabinet();
  };
});

applyLangStatic();
restoreSession();
</script>
</body>
</html>
