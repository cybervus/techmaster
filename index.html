    <label class="inl"><input type="checkbox" name="showCal" ${c.showCal !== false ? 'checked' : ''}> Показывать график занятости мастера</label>
    <label class="inl"><input type="checkbox" name="showFin" ${c.showFin !== false ? 'checked' : ''}> Показывать бюджет, оплаты и остаток долга</label>
  </div>`,
  f => {
    const cid = id || uid();
    if (existing) {
      const objs = getClientObjects(existing);
      const first = objs[0];
      const docData = {
        name: f.name.trim(),
        phone: f.phone.trim(),
        address: first.address || existing.address || '',
        note: f.note.trim(),
        pubProject: first.name || '',
        budget: first.budget || 0,
        pubMsg: first.msg || '',
        pubPct: first.pct,
        showAddress: !!f.showAddress,
        showCal: !!f.showCal,
        showFin: !!f.showFin,
        objects: objs,
        services: first.services || [],
        payments: first.payments || [],
        created: existing.created || Date.now()
      };
      return save('clients', cid, docData);
    } else {
      const bRaw = Number(f.objBudget);
      const objBudget = (Number.isFinite(bRaw) && bRaw > 0) ? Math.round(bRaw * 100) / 100 : 0;
      const objName = (f.objName || '').trim() || 'Основной объект';
      const objAddr = (f.objAddr || '').trim();
      const objs = [{ id: 'main', name: objName, address: objAddr, budget: objBudget, msg: '', pct: null, items: [], services: [], payments: [] }];
      return save('clients', cid, {
        name: f.name.trim(),
        phone: f.phone.trim(),
        address: objAddr,
        note: f.note.trim(),
        pubProject: objName,
        budget: objBudget,
        pubMsg: '',
        pubPct: null,
        showAddress: !!f.showAddress,
        showCal: !!f.showCal,
        showFin: !!f.showFin,
        objects: objs,
        services: [],
        payments: [],
        created: Date.now()
      });
    }
  }, existing ? (() => {
    const cnt = tasks.filter(x => x.clientId === id).length;
    return { confirm: cnt ? `Удалить (+${cnt} зад.)?` : 'Точно удалить?', run: () => deleteClientWithTasks(id) };
  })() : null);
  wireContacts(ov);
}

function openObjectModal(clientId, objId) {
  const c = clients.find(x => x.id === clientId);
  if (!c) return;
  const objs = getClientObjects(c);
  const existing = objId ? objs.find(o => o.id === objId) : null;
  const o = existing || { id: uid(), name: '', address: '', budget: 0, msg: '', pct: null, items: [], services: [], payments: [] };
  const pctVal = (o.pct !== undefined && o.pct !== null && o.pct !== '') ? String(o.pct) : '';
  const budVal = Number(o.budget) > 0 ? String(o.budget) : '';
  const canDel = Boolean(existing && objs.length > 1);
  modal(existing ? 'Настройки объекта' : `Новый объект — ${c.name}`, `
    <label>Название объекта (видно клиенту на карточке)</label>
    <input type="text" name="name" required placeholder="Например, Офис на Низами — Сеть и камеры" value="${esc(o.name)}">
    <label>Адрес объекта</label>
    <input type="text" name="address" placeholder="Улица, район" value="${esc(o.address || '')}">
    <label>Бюджет объекта, ₼ (пусто = авто по товарам и задачам)</label>
    <input type="number" name="budget" min="0" step="0.5" placeholder="Авто по товарам и задачам" value="${esc(budVal)}">
    <label>Сообщение для клиента (вверху страницы объекта)</label>
    <textarea name="msg" placeholder="Например, Оборудование заказано, монтаж в пятницу" style="min-height:64px">${esc(o.msg || '')}</textarea>
    <label>Прогресс вручную, % (оставьте пустым для авторасчёта)</label>
    <input type="number" name="pct" min="0" max="100" step="1" placeholder="Авто по задачам" value="${esc(pctVal)}">`,
  async f => {
    const cur = clients.find(x => x.id === clientId);
    if (!cur) return;
    const curObjs = getClientObjects(cur);
    const bRaw = Number(f.budget);
    const pRaw = String(f.pct || '').trim();
    const updatedObj = {
      id: existing ? existing.id : o.id,
      name: (f.name || '').trim() || 'Объект',
      address: (f.address || '').trim(),
      budget: (Number.isFinite(bRaw) && bRaw > 0) ? Math.round(bRaw * 100) / 100 : 0,
      msg: (f.msg || '').trim(),
      pct: pRaw === '' ? null : Math.max(0, Math.min(100, Math.round(Number(pRaw)))),
      items: existing ? existing.items : [],
      services: existing ? existing.services : [],
      payments: existing ? existing.payments : []
    };
    const nextObjs = existing
      ? curObjs.map(x => x.id === existing.id ? updatedObj : x)
      : [...curObjs, updatedObj];
    await saveClientObjects(clientId, nextObjs, existing ? 'Объект обновлён' : 'Объект добавлен');
    if (view === 'clients') {
      activeClientId = clientId;
      activeObjId = updatedObj.id;
      render();
    }
  }, canDel ? {
    confirm: 'Удалить этот объект?',
    run: async () => {
      const cur = clients.find(x => x.id === clientId);
      if (!cur) return;
      const curObjs = getClientObjects(cur).filter(x => x.id !== existing.id);
      const fallbackId = curObjs[0] ? curObjs[0].id : 'main';
      for (const t of tasks.filter(x => x.clientId === clientId && x.objectId === existing.id)) {
        const updT = Object.assign({}, t, { objectId: fallbackId });
        delete updT.id;
        await setDoc(doc(db, 'tasks', t.id), updT);
      }
      await saveClientObjects(clientId, curObjs, 'Объект удалён');
      activeObjId = fallbackId;
      render();
    }
  } : null);
}

const WORKS = ['Монтаж', 'Настройка', 'Пусконаладка', 'Диагностика', 'Ремонт', 'Обслуживание', 'Замена', 'Прокладка кабеля', 'Демонтаж', 'Консультация'];
const EQUIPS = ['IP-камера', 'Видеорегистратор (NVR/DVR)', 'Wi-Fi точка доступа', 'Коммутатор', 'Маршрутизатор', 'Домофон / СКУД', 'Сигнализация', 'Сервер / NAS', 'Принтер / МФУ', 'Компьютер', 'Кабельная сеть'];
const val = (f, n) => f[n] === '__other' ? (f[n + 'Other'] || '').trim() : (f[n] || '');

function pick(name, label, list, v) {
  const other = !!v && !list.includes(v);
  return `<label>${label}</label><select name="${name}"><option value="">Не выбрано</option>${list.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}<option value="__other"${other ? ' selected' : ''}>Другое…</option></select><input type="text" name="${name}Other" placeholder="Укажите вручную" value="${other ? esc(v) : ''}"${other ? '' : ' hidden'}>`;
}

function openTask(id, clientId, prefill) {
  if (!clients.length) { toast('Сначала добавьте клиента'); view = 'clients'; render(); return openClient(); }
  const t = tasks.find(x => x.id === id) || Object.assign({ clientId: clientId || clientFilter || clients[0].id, objectId: '', assigneeId: staffFilter || '', title: '', date: today(), time: '', details: '', high: false, done: false, status: 'todo', pub: true, clientPrice: 0, pubNote: '', items: [], checklist: [], staffNote: '' }, prefill || {});
  const curSt = t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo');
  const opts = [...clients].sort((a, b) => a.name.localeCompare(b.name, 'ru')).map(c => `<option value="${c.id}" ${c.id === t.clientId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const staffOpts = [...staff].filter(s => s.active !== false || s.id === t.assigneeId).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'))
    .map(s => `<option value="${s.id}" ${s.id === t.assigneeId ? 'selected' : ''}>${esc(s.name)}${s.role ? ' (' + esc(s.role) + ')' : ''}</option>`).join('');
  const prodOpts = [...products].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru')).map(p => `<option value="${p.id}">${esc(p.name)}${p.price > 0 ? ' (' + fmtAzn(p.price) + ')' : ''}</option>`).join('');
  let draftItems = (Array.isArray(t.items) ? t.items : []).map(x => ({
    name: x.name || '',
    qty: Number(x.qty) || 1,
    price: Number(x.price) || 0,
    status: ITEM_ST[x.status] ? x.status : 'pending',
    eta: x.eta || ''
  }));
  let draftChk = (Array.isArray(t.checklist) ? t.checklist : []).map(c => ({ id: c.id || uid(), text: c.text || '', done: Boolean(c.done) }));

  const ov = modal(id ? 'Задача' : 'Новая задача', `<label>Клиент</label><select name="clientId" id="taskCliSel">${opts}</select>
  <label>Объект клиента</label><select name="objectId" id="taskObjSel"></select>
  <label>Исполнитель (делегирование)</label><select name="assigneeId"><option value="">Я сам (не делегировано)</option>${staffOpts}</select>
  <label>Оплата исполнителю за работу, ₼ (видна исполнителю)</label><input type="number" name="staffPay" min="0" step="0.5" placeholder="Например, 150" value="${Number(t.staffPay) > 0 ? esc(t.staffPay) : ''}">
  <label>Что нужно сделать</label><input type="text" name="title" required value="${esc(t.title)}">
  <label>Статус выполнения</label><select name="status">
    <option value="todo"${curSt === 'todo' ? ' selected' : ''}>Запланировано</option>
    <option value="in_progress"${curSt === 'in_progress' ? ' selected' : ''}>В работе (выделяется у клиента)</option>
    <option value="done"${curSt === 'done' ? ' selected' : ''}>Выполнено</option>
  </select>
  ${pick('work', 'Вид работ', WORKS, t.work || '')}${pick('equip', 'Тип оборудования', EQUIPS, t.equip || '')}
  <label>Дата</label><input type="hidden" name="date" value="${esc(t.date)}"><div id="seld" class="meta"></div>
  <div class="qk"><button type="button" class="btn" data-d="today">Сегодня</button><button type="button" class="btn" data-d="tom">Завтра</button><button type="button" class="btn" data-d="">Без даты</button></div><div id="cal"></div>
  <label>Время</label><input type="time" name="time" value="${esc(t.time)}">
  <div class="qk">${['08:00', '09:00', '10:00', '11:00', '12:00', '14:00', '16:00', '18:00'].map(x => `<button type="button" class="btn" data-t="${x}">${x}</button>`).join('')}<button type="button" class="btn" data-t="">Без времени</button></div>
  <label>Детали (видны исполнителю, клиенту не видны)</label><textarea name="details">${esc(t.details)}</textarea>
  <div class="sec">
    <div class="sec-t">Чек-лист пунктов (отмечает исполнитель)</div>
    <div id="chkWrap"></div>
    <div class="it-add">
      <input type="text" id="chkNewInp" placeholder="Новый пункт (напр., Протянуть кабель)" style="flex:1;padding:8px;font-size:14px">
      <button type="button" class="btn" id="chkAddBtn">+ Пункт</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-t">Товары и закупка (видны клиенту в кабинете)</div>
    <div id="itWrap"></div>
    <div class="it-add">
      ${prodOpts ? `<select id="itCatSel"><option value="">Выбрать из каталога…</option>${prodOpts}</select><button type="button" class="btn" id="itAddCat">+ Из каталога</button>` : ''}
      <button type="button" class="btn" id="itAddCust">+ Свой товар</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-t">Отображение в кабинете клиента</div>
    <label class="inl" style="margin-top:4px"><input type="checkbox" name="pub" ${t.pub !== false ? 'checked' : ''}> Показывать эту задачу клиенту</label>
    <label>Стоимость задачи для клиента, ₼ (видна клиенту в объекте)</label><input type="number" name="clientPrice" min="0" step="0.5" placeholder="Например, 120" value="${Number(t.clientPrice) > 0 ? esc(t.clientPrice) : ''}">
    <label>Комментарий для клиента (виден в кабинете)</label><textarea name="pubNote" placeholder="Например, Кабели проложены, настраиваем регистратор" style="min-height:64px">${esc(t.pubNote || '')}</textarea>
  </div>
  <label class="inl"><input type="checkbox" name="high" ${t.high ? 'checked' : ''}> Срочно</label>`,
  f => {
    const st = f.status === 'done' ? 'done' : (f.status === 'in_progress' ? 'in_progress' : 'todo');
    const cleanItems = draftItems
      .map(x => ({ name: String(x.name || '').trim(), qty: Math.max(1, Number(x.qty) || 1), price: Number(x.price) || 0, status: ITEM_ST[x.status] ? x.status : 'pending', eta: String(x.eta || '') }))
      .filter(x => x.name);
    const cleanChk = draftChk.map(c => ({ id: c.id || uid(), text: String(c.text || '').trim(), done: Boolean(c.done) })).filter(c => c.text);
    return save('tasks', id || uid(), {
      clientId: f.clientId,
      objectId: f.objectId || '',
      assigneeId: f.assigneeId || '',
      staffPay: Number(f.staffPay) > 0 ? Number(f.staffPay) : 0,
      title: f.title.trim(),
      work: val(f, 'work'),
      equip: val(f, 'equip'),
      date: f.date,
      time: f.time,
      details: f.details.trim(),
      high: !!f.high,
      done: st === 'done',
      status: st,
      pub: !!f.pub,
      clientPrice: Number(f.clientPrice) > 0 ? Math.round(Number(f.clientPrice) * 100) / 100 : 0,
      pubNote: (f.pubNote || '').trim(),
      items: cleanItems,
      checklist: cleanChk,
      staffNote: t.staffNote || '',
      staffSyncTs: Date.now(),
      created: t.created || Date.now()
    });
  }, id ? { confirm: 'Точно удалить?', run: () => del('tasks', id) } : null);

  function drawChk() {
    const wrap = ov.querySelector('#chkWrap');
    if (!draftChk.length) { wrap.innerHTML = '<div class="meta">Пункты не добавлены.</div>'; return; }
    wrap.innerHTML = draftChk.map((c, idx) => `<div class="it-top" style="margin-top:6px">
      <input type="checkbox" data-cdone="${idx}" ${c.done ? 'checked' : ''} style="width:18px;height:18px;flex:none">
      <input type="text" data-ctext="${idx}" value="${esc(c.text)}">
      <button type="button" class="btn d" data-crem="${idx}">×</button>
    </div>`).join('');
    wrap.querySelectorAll('[data-cdone]').forEach(cb => cb.onchange = () => { draftChk[Number(cb.dataset.cdone)].done = cb.checked; });
    wrap.querySelectorAll('[data-ctext]').forEach(inp => inp.oninput = () => { draftChk[Number(inp.dataset.ctext)].text = inp.value; });
    wrap.querySelectorAll('[data-crem]').forEach(b => b.onclick = () => { draftChk.splice(Number(b.dataset.crem), 1); drawChk(); });
  }
  drawChk();
  const addChk = () => {
    const inp = ov.querySelector('#chkNewInp');
    const txt = (inp.value || '').trim();
    if (!txt) { inp.focus(); return; }
    draftChk.push({ id: uid(), text: txt, done: false });
    inp.value = '';
    drawChk();
    inp.focus();
  };
  ov.querySelector('#chkAddBtn').onclick = addChk;
  ov.querySelector('#chkNewInp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addChk(); } });

  function drawItems() {
    const wrap = ov.querySelector('#itWrap');
    if (!draftItems.length) {
      wrap.innerHTML = '<div class="meta">Товары к задаче не добавлены.</div>';
      return;
    }
    wrap.innerHTML = draftItems.map((it, idx) => `<div class="it-box" data-idx="${idx}">
      <div class="it-top">
        <input type="text" data-if="name" placeholder="Название товара / модели" value="${esc(it.name)}">
        <button type="button" class="btn d" data-irem="${idx}" aria-label="Удалить товар">×</button>
      </div>
      <div class="it-g">
        <input type="number" data-if="qty" min="1" step="1" title="Кол-во" placeholder="Шт" value="${esc(it.qty)}">
        <input type="number" data-if="price" min="0" step="0.5" title="Цена, ₼" placeholder="Цена ₼" value="${it.price > 0 ? esc(it.price) : ''}">
        <select data-if="status">${Object.entries(ITEM_ST).map(([k, l]) => `<option value="${k}"${it.status === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
      </div>
      <div class="it-g2">
        <div class="meta" style="align-self:center">Дата получения:</div>
        <input type="date" data-if="eta" value="${esc(it.eta || '')}">
      </div>
    </div>`).join('');
    wrap.querySelectorAll('.it-box').forEach(box => {
      const idx = Number(box.dataset.idx);
      box.querySelectorAll('[data-if]').forEach(inp => {
        inp.oninput = inp.onchange = () => {
          const fld = inp.dataset.if;
          draftItems[idx][fld] = (fld === 'qty' || fld === 'price') ? Number(inp.value) : inp.value;
        };
      });
    });
    wrap.querySelectorAll('[data-irem]').forEach(b => b.onclick = () => {
      draftItems.splice(Number(b.dataset.irem), 1);
      drawItems();
    });
  }
  drawItems();
  const addCatBtn = ov.querySelector('#itAddCat');
  if (addCatBtn) {
    addCatBtn.onclick = () => {
      const pid = ov.querySelector('#itCatSel').value;
      const p = products.find(x => x.id === pid);
      if (!p) return;
      draftItems.push({ name: p.name, qty: 1, price: Number(p.price) || 0, status: 'pending', eta: '' });
      ov.querySelector('#itCatSel').value = '';
      drawItems();
    };
  }
  ov.querySelector('#itAddCust').onclick = () => {
    draftItems.push({ name: '', qty: 1, price: 0, status: 'pending', eta: '' });
    drawItems();
    const last = ov.querySelector('#itWrap .it-box:last-child input[data-if="name"]');
    if (last) last.focus();
  };

  initCal(ov);
  const cliSel = ov.querySelector('#taskCliSel'), objSel = ov.querySelector('#taskObjSel');
  function fillObjOpts(selObjId) {
    const cl = clients.find(x => x.id === cliSel.value);
    const objs = cl ? getClientObjects(cl) : [];
    objSel.innerHTML = objs.map(o => `<option value="${esc(o.id)}"${o.id === selObjId ? ' selected' : ''}>${esc(o.name)}</option>`).join('');
  }
  fillObjOpts(t.objectId || '');
  cliSel.onchange = () => fillObjOpts('');
  ['work', 'equip'].forEach(n => {
    const s = ov.querySelector('[name=' + n + ']'), o = ov.querySelector('[name=' + n + 'Other]');
    s.onchange = () => { o.hidden = s.value !== '__other'; if (!o.hidden) o.focus(); };
  });
}

function openLinkOrder(ordId) {
  const o = orders.find(x => x.id === ordId);
  if (!o) return;
  const p9 = normPhone(o.phone);
  const matchedClient = p9.length >= 7 ? clients.find(c => normPhone(c.phone) === p9) : null;
  const sortedClients = [...clients].sort((a, b) => {
    const am = matchedClient && a.id === matchedClient.id ? 0 : 1;
    const bm = matchedClient && b.id === matchedClient.id ? 0 : 1;
    return am - bm || a.name.localeCompare(b.name, 'ru');
  });
  const objOpts = sortedClients.flatMap(c =>
    getClientObjects(c).map(ob => `<option value="obj:${c.id}:${esc(ob.id)}">${esc(c.name)} · ${esc(ob.name)}</option>`)
  ).join('');
  const openTasks = [...tasks].filter(t => !t.done).sort((a, b) => {

function initCal(ov) {
  const inp = ov.querySelector('[name=date]'), tin = ov.querySelector('[name=time]'), box = ov.querySelector('#cal'), lab = ov.querySelector('#seld');
  const busy = new Set(tasks.filter(t => !t.done && t.date).map(t => t.date));
  let ym = (inp.value || today()).slice(0, 7);
  function draw() {
    const [y, m] = ym.split('-').map(Number), off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate(), t0 = today();
    lab.textContent = inp.value ? 'Выбрано: ' + new Date(inp.value + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Без даты';
    let h = '<div class="calh"><button type="button" class="btn" data-m="-1">‹</button><b>' + new Date(y, m - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }) + '</b><button type="button" class="btn" data-m="1">›</button></div><div class="calg">' + ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => '<span class="wd">' + d + '</span>').join('');
    for (let i = 0; i < off; i++) h += '<span></span>';
    for (let d = 1; d <= n; d++) {
      const s = y + '-' + pad(m) + '-' + pad(d);
      h += '<button type="button" class="day' + (s === inp.value ? ' sel' : '') + (s === t0 ? ' tod' : '') + '" data-d="' + s + '">' + d + (busy.has(s) ? '<i></i>' : '') + '</button>';
    }
    box.innerHTML = h + '</div>';
  }
  ov.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.m) { const [y, m] = ym.split('-').map(Number); ym = iso(new Date(y, m - 1 + Number(b.dataset.m), 1)).slice(0, 7); }
    else if (b.dataset.t !== undefined) { tin.value = b.dataset.t; return; }
    else if (b.dataset.d !== undefined) { const k = b.dataset.d; inp.value = k === 'today' ? today() : k === 'tom' ? addDays(today(), 1) : k; if (inp.value) ym = inp.value.slice(0, 7); }
    else return;
    draw();
  });
  draw();
}

function wireContacts(ov) {
  const ph = ov.querySelector('[name=phone]'), nm = ov.querySelector('[name=name]'), pk = ov.querySelector('[data-pick]');
  const can = 'contacts' in navigator && navigator.contacts && navigator.contacts.select;
  if (can) ov.querySelector('#chint').hidden = true; else pk.hidden = true;
  pk.onclick = async () => {
    try {
      const r = await navigator.contacts.select(['name', 'tel'], { multiple: false }), c = r && r[0];
      if (c) { if (c.tel && c.tel[0]) ph.value = c.tel[0]; if (c.name && c.name[0] && !nm.value) nm.value = c.name[0]; }
    } catch (e) { toast('Не удалось открыть контакты'); }
  };
  ov.querySelector('[data-paste]').onclick = async () => {
    let s = '';
    try { s = await navigator.clipboard.readText(); }
    catch (e) { toast('Нет доступа к буферу: нажмите на поле и выберите «Вставить»'); return; }
    if (/BEGIN:VCARD/i.test(s)) {
      const fn = (s.match(/^FN[^:]*:(.+)$/mi) || [])[1], tl = (s.match(/^(?:item\d+\.)?TEL[^:]*:(.+)$/mi) || [])[1];
      if (tl) ph.value = tl.trim(); if (fn && !nm.value) nm.value = fn.trim(); return;
    }
    const m = s.match(/\+?\d[\d\s().-]{6,}\d/);
    if (m) ph.value = m[0].trim(); else toast('В буфере нет номера');
  };
}

function renderAdminChatLog() {
  if (!openChatId) return;
  const log = $('#admChatLog');
  if (!log) return;
  const ch = chats.find(x => x.id === openChatId);
  const msgs = (ch && Array.isArray(ch.messages)) ? ch.messages : [];
  if (!msgs.length) {
    log.innerHTML = '<div class="meta" style="text-align:center;margin:auto">Сообщений пока нет. Напишите клиенту первым.</div>';
    return;
  }
  let html = '', lastDay = '';
  for (const m of msgs) {
    const dStr = m.ts ? new Date(m.ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '';
    const tStr = m.ts ? new Date(m.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    if (dStr && dStr !== lastDay) { lastDay = dStr; html += `<div class="chat-day">${esc(dStr)}</div>`; }
    const isMe = m.from === 'admin';
    html += `<div class="mbub ${isMe ? 'me' : 'them'}">${esc(m.text)}<div class="mt">${esc(tStr)}</div></div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
  if (ch && Number(ch.unreadAdmin) > 0) {
    updateDoc(doc(db, 'chats', openChatId), { unreadAdmin: 0 }).catch(() => {});
  }
}

          kind,

          lastTs: now,
          lastFrom: 'admin',
          lastText: text.slice(0, 140),

          unreadClient: 1

  schedulePortal(3000);
  try {
    const refs = [doc(db, 'clients', cid), ...cTasks.map(t => doc(db, 'tasks', t.id))];
    for (let i = 0; i < refs.length; i += 400) {
      const batch = writeBatch(db);
      for (const r of refs.slice(i, i + 400)) batch.delete(r);
      await batch.commit();
    }
    toast(cTasks.length ? `Клиент и ${cTasks.length} зад. удалены` : 'Клиент удалён');
  } catch (e) {
    toast('Не удалось удалить клиента');
  }
}

async function acceptRequest(reqId) {
  const r = requests.find(x => x.id === reqId);
  if (!r || !user) return;
  const p9 = normPhone(r.phone);
  const existing = p9.length >= 7 ? clients.find(c => normPhone(c.phone) === p9) : null;
  const noteBlock = reqNoteText(r);
  const firstObjName = fmtReqList(r.objects, REQ_OBJ, r.objectsOther) || 'Основной объект';
  let cid;
  if (existing) {
    cid = existing.id;
    const mergedNote = [existing.note, noteBlock].filter(Boolean).join('\n---\n');
    const updatedClient = Object.assign({}, existing, {
      name: existing.name || r.name || '',
      phone: existing.phone || r.phone || '',
      address: existing.address || '',
      note: mergedNote,
      objects: getClientObjects(existing),
      created: existing.created || Date.now()
    });
    delete updatedClient.id;
    await save('clients', cid, updatedClient);
    toast('Данные добавлены к существующему клиенту');
  } else {
    cid = uid();
    await save('clients', cid, {
      name: String(r.name || '').trim(),
      phone: String(r.phone || '').trim(),
      address: '',
      pubProject: firstObjName,
      budget: 0,
      note: noteBlock,
      showAddress: true,
      showCal: true,
      showFin: true,
      objects: [{ id: 'main', name: firstObjName, address: '', budget: 0, msg: '', pct: null, items: [], services: [], payments: [] }],
      services: [],
      payments: [],
      created: Date.now()
    });
    toast('Клиент создан из заявки');
  }
  const upd = Object.assign({}, r, { status: 'accepted', clientId: cid });
  delete upd.id;
  try { await setDoc(doc(db, 'requests', reqId), upd); } catch (e) {}
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'tab') {
    if (el.dataset.v === 'clients') { activeClientId = ''; activeObjId = ''; }
    view = el.dataset.v;
    render();
  }
  else if (a === 'fab') {
    if (view === 'tasks') openTask();
    else if (view === 'clients') { if (activeClientId) openObjectModal(activeClientId, null); else openClient(); }
    else if (view === 'finance') { view = 'clients'; activeClientId = ''; render(); }
    else if (view === 'staff') openStaff();
    else if (view === 'messages') openNewChatModal();
    else if (view === 'requests') copyUrl('register.html', 'Ссылка на анкету');
    else if (shopTab === 'catalog') openProduct();
    else copyUrl('shop.html', 'Ссылка на магазин');
  }
  else if (a === 'clrsearch') {
    if (id === 'clientSearch') clientQuery = '';
    else if (id === 'taskSearch') taskQuery = '';
    render();
    const inp = $('#' + id);
    if (inp) inp.focus();
  }
  else if (a === 'clears') { staffFilter = ''; render(); }
  else if (a === 'copystaff') { copyUrl('staff.html', 'Ссылка для исполнителей'); }
  else if (a === 'syncstaff') { await rebuildStaffPortal(true); }
  else if (a === 'spays') { openStaffPayments(id); }
  else if (a === 'stasks') { staffFilter = id; clientFilter = ''; filter = 'all'; view = 'tasks'; render(); }
  else if (a === 'schat') { await openStaffChatById(id); }
  else if (a === 'editstaff') { openStaff(id); }
  else if (a === 'delstaff') {
    if (armed !== 's:' + id) { armed = 's:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try {
      if (staffFilter === id) staffFilter = '';
      await deleteDoc(doc(db, 'staff', id));
      scheduleStaffPortal(600);
      toast('Исполнитель удалён');
    } catch (ex) { toast('Не удалось удалить'); }
  }
  else if (a === 'msgf') { msgFilter = el.dataset.mf; render(); }
  else if (a === 'togchk') {
    const t = tasks.find(x => x.id === id);
    const cid = el.dataset.cid;
    if (t && Array.isArray(t.checklist)) {
      const nextChk = t.checklist.map(c => c.id === cid ? Object.assign({}, c, { done: el.checked }) : c);
      const d = Object.assign({}, t, { checklist: nextChk, staffSyncTs: Date.now() });
      delete d.id;
      save('tasks', id, d);
    }
  }
  else if (a === 'openchat') { openAdminChat(id); }
  else if (a === 'delchat') {
    if (armed !== 'ch:' + id) { armed = 'ch:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'chats', id)); toast('Чат удалён'); } catch (ex) { toast('Не удалось удалить чат'); }
  }
  else if (a === 'shoptab') { shopTab = el.dataset.st; render(); }
  else if (a === 'impcat') { $('#impfile').click(); }
  else if (a === 'synccat') { await syncCatalog(true); }
  else if (a === 'newprod') { openProduct(); }
  else if (a === 'editprod') { openProduct(id); }
  else if (a === 'seedprod') { await seedSampleProducts(); }
  else if (a === 'linkord') { openLinkOrder(id); }
  else if (a === 'delprod') {
    if (armed !== 'p:' + id) { armed = 'p:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'products', id)); scheduleCatalog(800); toast('Товар удалён'); }
    catch (ex) { toast('Не удалось удалить товар'); }
  }
  else if (a === 'delord') {
    if (armed !== 'o:' + id) { armed = 'o:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'orders', id)); } catch (ex) { toast('Не удалось удалить заказ'); }
  }
  else if (a === 'menu') { openMenu(); }
  else if (a === 'filter') { filter = el.dataset.f; render(); }
  else if (a === 'clearc') { clientFilter = ''; render(); }
  else if (a === 'open') { opened.has(id) ? opened.delete(id) : opened.add(id); render(); }
  else if (a === 'toggle') {
    const t = tasks.find(x => x.id === id);
    if (t) {
      const nextDone = !t.done;
      const d = Object.assign({}, t, { done: nextDone, status: nextDone ? 'done' : 'todo', staffSyncTs: Date.now() });
      delete d.id;
      save('tasks', id, d);
    }
  }
  else if (a === 'inprog') {
    const t = tasks.find(x => x.id === id);
    if (t && !t.done) {
      const nextSt = t.status === 'in_progress' ? 'todo' : 'in_progress';
      const d = Object.assign({}, t, { status: nextSt, staffSyncTs: Date.now() });
      delete d.id;
      save('tasks', id, d);
      toast(nextSt === 'in_progress' ? 'Задача переведена «В работу»' : 'Статус «В работе» снят');
    }
  }
  else if (a === 'edittask') openTask(id);
  else if (a === 'newtask') openTask(null, id);
  else if (a === 'newobjtask') openTask(null, id, { objectId: el.dataset.oid || '' });
  else if (a === 'openclient') { activeClientId = id; activeObjId = ''; view = 'clients'; render(); window.scrollTo(0, 0); }
  else if (a === 'backclients') { activeClientId = ''; activeObjId = ''; render(); window.scrollTo(0, 0); }
  else if (a === 'selobj') { activeObjId = el.dataset.oid || ''; render(); }
  else if (a === 'addobj') openObjectModal(id, null);
  else if (a === 'editobj') openObjectModal(id, el.dataset.oid || '');
  else if (a === 'mergedups') { await mergeDuplicateClients(); }
  else if (a === 'cchat') {
    const c = clients.find(x => x.id === id);
    if (!c || normPhone(c.phone).length < 7) { toast('У клиента не указан телефон'); return; }
    toast('Открываем чат…');
    try {
      const saltB64 = await ensurePortalSalt();
      const { id: chId } = await deriveForPhone(normPhone(c.phone), saltB64);
      openAdminChat(chId, c.name, c.phone, 'client');
    } catch (ex) { toast('Не удалось открыть чат'); }
  }
  else if (a === 'cwfillcat') {
    const form = el.closest('form');
    const sel = form && form.querySelector('#cwCatSel');
    const p = sel && products.find(x => x.id === sel.value);
    if (!p) { toast('Выберите товар из списка'); return; }
    form.querySelector('[name=name]').value = p.name;
    form.querySelector('[name=price]').value = p.price > 0 ? p.price : '';
    form.querySelector('[name=qty]').focus();
  }
  else if (a === 'delobjitem') {
    const cur = clients.find(x => x.id === id);
    const oid = el.dataset.oid, iid = el.dataset.iid;
    if (!cur) return;
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { items: (o.items || []).filter(x => x.id !== iid) }) : o);
    await saveClientObjects(id, nextObjs, 'Товар удалён');
  }
  else if (a === 'delobjpay') {
    const cur = clients.find(x => x.id === id);
    const oid = el.dataset.oid, pid = el.dataset.pid;
    if (!cur) return;
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { payments: (o.payments || []).filter(p => p.id !== pid) }) : o);
    await saveClientObjects(id, nextObjs, 'Оплата удалена');
  }
  else if (a === 'delobjsvc') {
    const cur = clients.find(x => x.id === id);
    const oid = el.dataset.oid, sid = el.dataset.sid;
    if (!cur) return;
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { services: (o.services || []).filter(s => s.id !== sid) }) : o);
    await saveClientObjects(id, nextObjs, 'Услуга удалена');
  }
  else if (a === 'editclient') openClient(id);
  else if (a === 'cfin') { activeClientId = id; activeObjId = ''; view = 'clients'; render(); window.scrollTo(0, 0); }
  else if (a === 'ctasks') { clientFilter = id; filter = 'all'; view = 'tasks'; render(); }
  else if (a === 'accreq') { await acceptRequest(id); }
  else if (a === 'reqtask') {
    const r = requests.find(x => x.id === id);
    if (r && r.clientId) openTask(null, r.clientId, { title: fmtReqList(r.categories, REQ_CAT, r.categoriesOther) || 'Заявка с сайта', details: reqNoteText(r) });
  }
  else if (a === 'deltask') {
    if (armed !== 't:' + id) { armed = 't:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null; await del('tasks', id);
  }
  else if (a === 'delclient') {
    if (armed !== 'c:' + id) {
      const cnt = tasks.filter(x => x.clientId === id).length;
      armed = 'c:' + id;
      el.textContent = cnt ? `Удалить (+${cnt} зад.)?` : 'Точно удалить?';
      return;
    }
    armed = null; await deleteClientWithTasks(id);
  }
  else if (a === 'delreq') {
    if (armed !== 'r:' + id) { armed = 'r:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'requests', id)); } catch (ex) { toast('Не удалось удалить'); }
  }
});

document.addEventListener('input', e => {
  const inp = e.target.closest('input[data-search]'); if (!inp) return;
  const sid = inp.dataset.search;
  const pos = inp.selectionStart;
  if (sid === 'clientSearch') clientQuery = inp.value;
  else if (sid === 'taskSearch') taskQuery = inp.value;
  else return;
  render();
  const next = $('#' + sid);
  if (next) { next.focus(); if (pos !== null) try { next.setSelectionRange(pos, pos); } catch (ex) {} }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-ch]'); if (!el) return;
  const ch = el.dataset.ch;
  if (ch === 'objitemst') {
    const cid = el.dataset.cid, oid = el.dataset.oid, iid = el.dataset.iid;
    const st = ITEM_ST[el.value] ? el.value : 'pending';
    const cur = clients.find(x => x.id === cid);
    if (!cur) return;
    const nextObjs = getClientObjects(cur).map(o => o.id === oid
      ? Object.assign({}, o, { items: (o.items || []).map(x => x.id === iid ? Object.assign({}, x, { status: st }) : x) })
      : o);
    await saveClientObjects(cid, nextObjs, 'Статус товара обновлён');
  } else if (ch === 'taskitemst') {
    const tid = el.dataset.tid, idx = Number(el.dataset.iidx);
    const st = ITEM_ST[el.value] ? el.value : 'pending';
    const t = tasks.find(x => x.id === tid);
    if (!t || !Array.isArray(t.items) || !t.items[idx]) return;
    const nextItems = t.items.map((x, i) => i === idx ? Object.assign({}, x, { status: st }) : x);
    const d = Object.assign({}, t, { items: nextItems, staffSyncTs: Date.now() });
    delete d.id;
    await save('tasks', tid, d);
    toast('Статус товара обновлён');
  } else if (ch === 'taskst') {
    const tid = el.dataset.tid;
    const st = el.value === 'done' ? 'done' : (el.value === 'in_progress' ? 'in_progress' : 'todo');
    const t = tasks.find(x => x.id === tid);
    if (!t) return;
    const d = Object.assign({}, t, { status: st, done: st === 'done', staffSyncTs: Date.now() });
    delete d.id;
    await save('tasks', tid, d);
    toast('Статус задачи обновлён');
  } else if (ch === 'svcsel') {
    const form = el.closest('form');
    const oth = form && form.querySelector('[name=svcOther]');
    if (oth) { oth.hidden = el.value !== '__other'; if (!oth.hidden) oth.focus(); }
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-qform]'); if (!form) return;
  e.preventDefault();
  const qf = form.dataset.qform, cid = form.dataset.cid, oid = form.dataset.oid;
  const cur = clients.find(x => x.id === cid);
  if (!cur) return;
  const fd = new FormData(form);
  if (qf === 'additem') {
    const name = String(fd.get('name') || '').trim();
    if (!name) return;
    const item = normObjItem({ id: uid(), name, qty: fd.get('qty'), price: fd.get('price'), status: fd.get('status'), eta: fd.get('eta') });
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { items: [...(o.items || []), item] }) : o);
    await saveClientObjects(cid, nextObjs, 'Товар добавлен на объект');
  } else if (qf === 'addpay') {
    const amount = Number(fd.get('amount'));
    if (!Number.isFinite(amount) || amount <= 0) return;
    const rec = normObjPay({ id: uid(), date: fd.get('date') || today(), amount, type: fd.get('type'), note: fd.get('note') });
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { payments: [...(o.payments || []), rec] }) : o);
    await saveClientObjects(cid, nextObjs, 'Оплата записана');
  } else if (qf === 'addsvc') {
    const name = fd.get('svcSel') === '__other' ? String(fd.get('svcOther') || '').trim() : String(fd.get('svcSel') || '').trim();
    const price = Number(fd.get('price'));
    if (!name || !Number.isFinite(price) || price < 0) return;
    const rec = normObjSvc({ id: uid(), name, qty: fd.get('qty'), price, note: fd.get('note') });
    const nextObjs = getClientObjects(cur).map(o => o.id === oid ? Object.assign({}, o, { services: [...(o.services || []), rec] }) : o);
    await saveClientObjects(cid, nextObjs, 'Услуга добавлена');
  }
});

// --- Auth & Firestore subscriptions ---
render();
onAuthStateChanged(auth, u => {
  unsubs.forEach(fn => { try { fn(); } catch (e) {} });
  unsubs = [];
  if (portalTimer) { clearTimeout(portalTimer); portalTimer = null; }
  if (catTimer) { clearTimeout(catTimer); catTimer = null; }
  if (staffTimer) { clearTimeout(staffTimer); staffTimer = null; }
  user = u;
  authReady = true;
  clients = [];
  tasks = [];
  requests = [];
  products = [];
  orders = [];
  chats = [];
  staff = [];
  reqErr = false;
  prodErr = false;
  ordErr = false;
  chatErr = false;
  staffErr = false;
  openChatId = null;
  activeClientId = '';
  activeObjId = '';
  staffSalt = null;
  staffDirty = false;
  staffChecked = false;
  ready = 0;
  portalSalt = null;
  portalExists = false;
  portalLastUpd = '';
  portalStatus = '';
  portalDirty = false;
  portalChecked = false;
  note('');
  render();
  if (!user) return;

  if (!navigator.onLine) {
    note('Нет связи: показаны сохранённые данные, изменения синхронизируются при появлении сети.');
  }
  const timer = setTimeout(() => {
    if (ready < 2) note('Данные загружаются медленно — проверьте подключение или правила Firestore.');
  }, 10000);

  const sub = (col, set) => {
    let first = true;
    const unsub = onSnapshot(collection(db, col), s => {
      set(s.docs.map(d => Object.assign({ id: d.id }, d.data())));
      if (first) { first = false; ready++; }
      if (!s.metadata.fromCache) { clearTimeout(timer); if (navigator.onLine) note(''); }
      render();
      if (ready >= 2) checkInitialPortal();
    }, err => {
      clearTimeout(timer);
      note(err && err.code === 'permission-denied'
        ? 'Нет доступа к базе: проверьте User UID в правилах Firestore.'
        : 'Ошибка загрузки данных из Firestore.');
      ready = 2;
      render();
    });
    unsubs.push(unsub);
  };
  sub('clients', v => clients = v);
  sub('tasks', v => tasks = v);
  unsubs.push(onSnapshot(collection(db, 'requests'), s => {
    reqErr = false;
    requests = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    reqErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'products'), s => {
    prodErr = false;
    products = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    prodErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'orders'), s => {
    ordErr = false;
    orders = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    ordErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'chats'), s => {
    chatErr = false;
    chats = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
    if (openChatId) renderAdminChatLog();
  }, () => {
    chatErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'staff'), s => {
    staffErr = false;
    staff = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
    if (!staffChecked && staff.length && ready >= 2) {
      staffChecked = true;
      getDoc(doc(db, 'pub', 'staff')).then(snap => {
        if (snap.exists() && snap.data().salt) staffSalt = snap.data().salt;
        else scheduleStaffPortal(600);
      }).catch(() => {});
    }
  }, () => {
    staffErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'staff_updates'), s => {
    const docs = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    applyStaffUpdates(docs);
  }, () => {}));
});
</script>
