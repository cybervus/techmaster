<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи и клиенты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачи">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--accent-h:#c81d18;--soft:#fdecec;--on:#ffffff;--danger:#e52520;--ok:#00b578;--ok-bg:#e6f8f1;--warn:#fa8c16;--warn-bg:#fff5e6;--blue:#2563eb;--blue-bg:#eef4ff;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--accent-h:#d92d27;--soft:#331819;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--ok-bg:#112e24;--warn:#fb923c;--warn-bg:#332211;--blue:#60a5fa;--blue-bg:#17253d;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--accent-h:#d92d27;--soft:#331819;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--ok-bg:#112e24;--warn:#fb923c;--warn-bg:#332211;--blue:#60a5fa;--blue-bg:#17253d;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 96px;max-width:640px;margin-inline:auto;overflow-x:clip}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
h1{font-size:19px;font-weight:700;margin:0;line-height:1.2}
#date{color:var(--muted);font-size:13px;font-weight:500;line-height:1.3;text-transform:capitalize}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{margin:0;line-height:0;flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:26px;height:26px;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hact{display:flex;align-items:center;gap:6px;flex:none}
.hact .btn.ic{padding:8px 11px;border-radius:10px}
#note{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 10px;margin-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;margin-left:5px;opacity:.85}
h2{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 4px 8px;padding:0}
h2 span{font-weight:600;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
h2.late{color:var(--danger)}
h2.late span{background:var(--soft);border-color:transparent;color:var(--danger)}
.tr{display:grid;grid-template-columns:22px 3.5rem 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.tr.hi{border-left:4px solid var(--danger)}
.tr.done{opacity:.72}
.tr.done .ttl{text-decoration:line-through;color:var(--muted)}
.tm{font-weight:600;font-size:14px;padding-top:1px;color:var(--text)}
.tm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.chk{position:relative;width:22px;height:22px;margin-top:1px;border-radius:6px;border:1.8px solid var(--muted);background:none;color:transparent;font-size:13px;font-weight:700;line-height:1;padding:0;cursor:pointer;transition:all .15s ease}
.chk::after{content:'';position:absolute;inset:-10px}
.tr.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border:0;background:var(--soft);color:var(--danger);border-radius:10px;font-size:11px;font-weight:600;vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.prog{background:var(--blue-bg);color:var(--blue)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--bg);color:var(--muted)}
.it-list{margin:8px 0;border-top:1px solid var(--line)}
.it-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.it-box{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--bg)}
.it-top{display:flex;gap:6px;align-items:center}
.it-top input{flex:1;padding:8px 10px;font-size:14px}
.it-top .btn{padding:7px 10px;font-size:13px}
.it-g{display:grid;grid-template-columns:64px 86px 1fr;gap:6px;margin-top:6px}
.it-g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.it-box input,.it-box select{padding:8px 9px;font-size:14px}
.it-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.it-add select{flex:1;min-width:160px;padding:8px;font-size:14px}
.nbadge{display:inline-block;margin-left:5px;padding:0 5px;min-width:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;line-height:17px;vertical-align:1px}
.kv{margin-top:8px;font-size:13px;line-height:1.5;background:var(--bg);border-radius:10px;padding:8px 10px}
.kv div{margin-top:2px}
.kv b{color:var(--muted);font-weight:600}
.cl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.main{flex:1;min-width:0}
.head{cursor:pointer}
.ttl{font-weight:600;font-size:15px}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.more p{margin:0 0 8px;white-space:pre-wrap}
.links a{color:var(--blue);margin-right:16px;text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:opacity .15s ease}
.btn:active{opacity:.75}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 8px rgba(229,37,32,.22)}
.btn.d{background:var(--soft);color:var(--danger);border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.empty{color:var(--muted);text-align:center;padding:42px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;font-size:13.5px;margin:8px 0 10px;box-shadow:var(--sh)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(15,23,42,.06);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);padding:9px 4px 8px;font:inherit;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap}
nav button svg{width:20px;height:20px;display:block;flex:none}
nav button .nbadge{position:absolute;top:4px;right:8px;margin-left:0;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-size:10px}
nav button.on{color:var(--accent);font-weight:700}
nav button.on::before{content:'';position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.chat-sheet{background:var(--card);width:100%;max-width:640px;height:86dvh;max-height:760px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.chat-hd h3{margin:0;font-size:16px;font-weight:700}
.chat-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat-day{align-self:center;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:6px 0 2px}
.mbub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mbub.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.mbub.them{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbub .mt{font-size:11px;opacity:.75;margin-top:4px;text-align:right}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-bar textarea{flex:1;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:110px;resize:none}
.chat-bar .btn{padding:10px 16px;flex:none}
.mprev{margin-top:5px;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-bal{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fin-bal.owe-staff{background:var(--soft);color:var(--danger)}
.fin-bal.owe-master{background:var(--ok-bg);color:var(--ok)}
.ptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ptbl th{text-align:left;font-weight:600;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.ptbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ptbl th.r,.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:10px}
.pnote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.irow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.irow span:first-child{color:var(--muted)}
.irow b{font-weight:600}

/* Unified Client Workspace & Object Manager */
.cw-wrap{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px}
.cw-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cw-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.cw-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cw-name{font-size:20px;font-weight:700;margin:0;line-height:1.25}
.cw-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.ckpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.ckpi-k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckpi-v{font-size:16px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckpi.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.ckpi.ok .ckpi-k{color:var(--ok);opacity:.85}
.ckpi.debt{background:var(--soft);border-color:transparent;color:var(--danger)}
.ckpi.debt .ckpi-k{color:var(--danger);opacity:.85}
.obj-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;align-items:center}
.obj-bar::-webkit-scrollbar{display:none}
.otab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.otab.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.otab.add{border-style:dashed;color:var(--accent);border-color:rgba(229,37,32,.45);background:transparent;box-shadow:none}
.cw-grid{display:grid;grid-template-columns:1fr;gap:12px}
.cw-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.cw-card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cw-card-hd h3{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.cw-pill{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:10px}
.pbar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;margin-top:10px}
.pbar-ok{background:var(--ok);height:100%}
.pbar-pr{background:var(--accent);height:100%}
.inline-sel{width:auto;padding:5px 8px;font-size:12.5px;font-weight:600;border-radius:8px;min-width:112px}
.inline-sel.st-pending{color:var(--muted)}
.inline-sel.st-ordered{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.inline-sel.st-bought{color:var(--blue);border-color:var(--blue);background:var(--blue-bg)}
.inline-sel.st-received{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.inline-sel.ts-todo{color:var(--muted)}
.inline-sel.ts-in_progress{color:var(--blue);border-color:var(--blue);background:var(--blue-bg)}
.inline-sel.ts-done{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.cw-trow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cw-trow:last-child{border-bottom:0}
.cw-trow.done .ttl{text-decoration:line-through;color:var(--muted)}
.cw-tacts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none;justify-content:flex-end}
.cw-price{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap}
.cw-tot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:2px solid var(--line);font-weight:700;font-size:14px}
.cw-tot b{color:var(--accent);font-size:15.5px}
.qform{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.qform-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid .full{grid-column:1 / -1}
.qform input,.qform select{padding:8px 10px;font-size:14px;background:var(--card)}
.obj-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ochip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.dup-banner{grid-column:1 / -1;background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.sbar{grid-column:1 / -1;position:relative;display:flex;align-items:center}
.sbar svg{position:absolute;left:12px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.sbar input{width:100%;height:42px;padding:0 36px 0 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14.5px;box-shadow:var(--sh)}
.sbar .sclr{position:absolute;right:6px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.fin-kpi4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:768px){.fin-kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fin-row:last-child{border-bottom:0}
@media (max-width:520px){
  .cw-kpi{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
  .cw-trow{flex-wrap:wrap}
  .cw-tacts{width:100%;justify-content:space-between;margin-top:4px;padding-left:32px}
}
@media (min-width:960px){
  .cw-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .cw-grid>.span2{grid-column:1 / -1}
}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov form,.ov .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.ov h3{margin:0 0 8px;font-size:18px;font-weight:700}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:15.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s ease}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
textarea{min-height:84px;resize:vertical}
.two{display:flex;gap:10px}.two>div{flex:1}
.inl{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--text);font-size:14.5px;font-weight:500}
.inl input{width:18px;height:18px;accent-color:var(--accent)}
.calh{display:flex;align-items:center;justify-content:space-between;margin:8px 0;text-transform:capitalize;font-weight:600}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:3px 0}
.day{position:relative;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;height:40px;font:inherit;font-size:14px;font-weight:500;padding:0;cursor:pointer}
.day.tod{border-color:var(--accent);color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

let activeClientId = '', activeObjId = '', clientQuery = '', taskQuery = '';

const fmtAzn0 = p => { const n = Number(p) || 0; return (Number.isInteger(n) ? n : n.toFixed(2)) + ' ₼'; };

function normObjItem(x) {
  return {
    id: String(x && x.id || uid()),
    name: String(x && x.name || '').trim(),
    qty: Math.max(1, Number(x && x.qty) || 1),

    status: ITEM_ST[x && x.status] ? x.status : 'pending',
    eta: String(x && x.eta || '')
  };
}
function normObjSvc(s) {
  return {
    id: String(s && s.id || uid()),
    name: String(s && s.name || '').trim(),
    qty: Math.max(1, Number(s && s.qty) || 1),
    price: Number(s && s.price) >= 0 ? Math.round((Number(s.price) || 0) * 100) / 100 : 0,
    note: String(s && s.note || '').trim()
  };
}
function normObjPay(p) {
  return {
    id: String(p && p.id || uid()),
    date: String(p && p.date || ''),
    amount: Number(p && p.amount) > 0 ? Math.round(Number(p.amount) * 100) / 100 : 0,
    type: CLI_PAY_TYPES[p && p.type] ? p.type : 'final',
    note: String(p && p.note || '').trim()
  };
}
function getClientObjects(c) {
  if (!c) return [];
  if (Array.isArray(c.objects) && c.objects.length) {
    return c.objects.map((o, idx) => ({
      id: String(o.id || (idx === 0 ? 'main' : uid())),
      name: String(o.name || (idx === 0 ? (c.pubProject || 'Основной объект') : `Объект ${idx + 1}`)).trim(),
      address: String(o.address !== undefined ? o.address : (idx === 0 ? (c.address || '') : '')).trim(),
      budget: Number(o.budget) > 0 ? Math.round(Number(o.budget) * 100) / 100 : 0,
      msg: String(o.msg || '').trim(),
      pct: (o.pct !== undefined && o.pct !== '' && o.pct !== null && Number.isFinite(Number(o.pct))) ? Math.max(0, Math.min(100, Math.round(Number(o.pct)))) : null,
      items: Array.isArray(o.items) ? o.items.map(normObjItem).filter(x => x.name) : [],
      services: Array.isArray(o.services) ? o.services.map(normObjSvc).filter(s => s.name) : [],
      payments: Array.isArray(o.payments) ? o.payments.map(normObjPay).filter(p => p.amount > 0) : []
    }));
  }
  const pctRaw = c.pubPct;
  const pct = (pctRaw !== undefined && pctRaw !== '' && pctRaw !== null && Number.isFinite(Number(pctRaw))) ? Math.max(0, Math.min(100, Math.round(Number(pctRaw)))) : null;
  return [{
    id: 'main',
    name: String(c.pubProject || c.address || 'Основной объект').trim(),
    address: String(c.address || '').trim(),
    budget: Number(c.budget) > 0 ? Math.round(Number(c.budget) * 100) / 100 : 0,
    msg: String(c.pubMsg || '').trim(),
    pct,
    items: Array.isArray(c.items) ? c.items.map(normObjItem).filter(x => x.name) : [],
    services: Array.isArray(c.services) ? c.services.map(normObjSvc).filter(s => s.name) : [],
    payments: Array.isArray(c.payments) ? c.payments.map(normObjPay).filter(p => p.amount > 0) : []
  }];
}
function tasksForObject(c, objId, tasksList = tasks) {
  const objs = getClientObjects(c);
  if (!objs.length) return [];
  const validIds = new Set(objs.map(o => o.id));
  const firstId = objs[0].id;
  return tasksList.filter(t => {
    if (t.clientId !== c.id) return false;
    const tid = (t.objectId && validIds.has(t.objectId)) ? t.objectId : firstId;
    return tid === objId;
  });
}
function objSummary(c, obj, tasksList = tasks) {
  const objTasks = tasksForObject(c, obj.id, tasksList);
  const doneCnt = objTasks.filter(t => t.done).length;
  const progCnt = objTasks.filter(t => !t.done && t.status === 'in_progress').length;
  const todoCnt = objTasks.length - doneCnt - progCnt;
  const pct = (typeof obj.pct === 'number' && Number.isFinite(obj.pct))
    ? obj.pct
    : (objTasks.length ? Math.round((doneCnt / objTasks.length) * 100) : 0);

  const directItems = (obj.items || []).map(x => Object.assign({ source: 'obj' }, x));
  const taskItems = [];
  for (const t of objTasks) {
    if (Array.isArray(t.items)) {
      t.items.forEach((x, idx) => taskItems.push(Object.assign({ source: 'task', taskId: t.id, taskTitle: t.title, itemIdx: idx }, x)));
    }
  }
  const allItems = [...directItems, ...taskItems];
  const itemsSum = Math.round(allItems.reduce((acc, x) => acc + (Number(x.price) > 0 ? Number(x.price) * (Number(x.qty) || 1) : 0), 0) * 100) / 100;
  const tasksSum = Math.round(objTasks.reduce((acc, t) => acc + (Number(t.clientPrice) > 0 ? Number(t.clientPrice) : 0), 0) * 100) / 100;
  const svcs = Array.isArray(obj.services) ? obj.services : [];
  const svcTotal = Math.round(svcs.reduce((acc, s) => acc + (Number(s.qty) || 1) * (Number(s.price) || 0), 0) * 100) / 100;
  const pays = Array.isArray(obj.payments) ? [...obj.payments].sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
  const paidTotal = Math.round(pays.reduce((acc, p) => acc + (Number(p.amount) || 0), 0) * 100) / 100;
  const factTotal = Math.round((itemsSum + tasksSum + svcTotal) * 100) / 100;
  const manualBudget = Number(obj.budget) > 0 ? Math.round(Number(obj.budget) * 100) / 100 : 0;
  const objBudget = manualBudget > 0 ? manualBudget : factTotal;
  const bal = Math.round((objBudget - paidTotal) * 100) / 100;
  return { objTasks, doneCnt, progCnt, todoCnt, pct, directItems, taskItems, allItems, itemsSum, tasksSum, svcs, svcTotal, pays, paidTotal, factTotal, manualBudget, objBudget, bal };
}
function clientFinSummary(c) {
  const objs = getClientObjects(c);
  let totalBudget = 0, itemsSum = 0, tasksSum = 0, svcTotal = 0, paidTotal = 0, openTasks = 0;
  const allSvcs = [], allPays = [];
  for (const o of objs) {
    const s = objSummary(c, o);
    totalBudget += s.objBudget;
    itemsSum += s.itemsSum;
    tasksSum += s.tasksSum;
    svcTotal += s.svcTotal;
    paidTotal += s.paidTotal;
    openTasks += (s.progCnt + s.todoCnt);
    allSvcs.push(...s.svcs);
    allPays.push(...s.pays);
  }
  totalBudget = Math.round(totalBudget * 100) / 100;
  paidTotal = Math.round(paidTotal * 100) / 100;
  const bal = Math.round((totalBudget - paidTotal) * 100) / 100;
  return { objs, svcs: allSvcs, pays: allPays, totalBudget, itemsSum, tasksSum, svcTotal, paidTotal, bal, openTasks };
}

  const cur = clients.find(x => x.id === clientId);

  const first = cleanObjs[0];

    objects: cleanObjs,
    pubProject: first.name || '',
    address: first.address || cur.address || '',

function objNameOf(clientId, objectId) {
  const c = clients.find(x => x.id === clientId);
  if (!c) return '';
  const objs = getClientObjects(c);
  if (objs.length <= 1) return objs[0] ? objs[0].name : '';
  const found = objs.find(o => o.id === objectId) || objs[0];
  return found ? found.name : '';
}

function staffFinSummary(s) {
  const pays = Array.isArray(s.payments) ? [...s.payments].sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
  const myTasks = tasks.filter(t => t.assigneeId === s.id);
  const earnedDone = myTasks.filter(t => t.done).reduce((acc, t) => acc + (Number(t.staffPay) || 0), 0);
  const plannedPay = myTasks.filter(t => !t.done).reduce((acc, t) => acc + (Number(t.staffPay) || 0), 0);
  const paidWork = pays.filter(p => p.type === 'work' || p.type === 'advance').reduce((acc, p) => acc + (Number(p.amount) || 0), 0);
  const paidExp = pays.filter(p => p.type === 'expense' || p.type === 'materials').reduce((acc, p) => acc + (Number(p.amount) || 0), 0);
  const totalPaid = paidWork + paidExp;
  const bal = Math.round((earnedDone - paidWork) * 100) / 100;
  return { pays, earnedDone, plannedPay, paidWork, paidExp, totalPaid, bal };
}

// --- Portal (pub/portal) sync state & crypto ---
const PORTAL_ITER = 600000;
const PORTAL_WH = [9, 18];
const PORTAL_DUR_H = 1;
const keyCache = new Map();
let portalSalt = null;
let portalExists = false;
let portalLastUpd = '';
let portalStatus = '';
let portalTimer = null;
let portalRunning = false;
let portalDirty = false;
let portalChecked = false;

const toB64 = u8 => {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
};
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toHex = u8 => Array.from(u8, x => x.toString(16).padStart(2, '0')).join('');
const normPhone = p => String(p || '').replace(/\D/g, '').slice(-9);

function toast(m) {
  const old = $('#toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function note(m) {
  const n = $('#note');
  n.textContent = m;
  n.hidden = !m;
}

async function ensurePortalSalt() {
  if (portalSalt) return portalSalt;
  try {
    const snap = await getDoc(doc(db, 'pub', 'portal'));
    if (snap.exists()) {
      const d = snap.data();
      portalExists = true;
      portalLastUpd = d.upd || '';
      if (typeof d.salt === 'string' && fromB64(d.salt).length === 16) {
        portalSalt = d.salt;
        return portalSalt;
      }
    }
  } catch (e) {}
  portalSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  return portalSalt;
}

async function deriveForPhone(phone9, saltB64) {
  const ck = saltB64 + ':' + phone9;
  if (keyCache.has(ck)) return keyCache.get(ck);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(phone9), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({
    name: 'PBKDF2',
    salt: fromB64(saltB64),
    iterations: PORTAL_ITER,
    hash: 'SHA-256'
  }, km, 384));
  const id = toHex(bits.slice(0, 16));
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['encrypt']);
  const entry = { id, key };
  keyCache.set(ck, entry);
  return entry;
}

async function buildPortalPayload(clientsList, tasksList, saltB64) {
  const busyMap = new Map();
  const fullSet = new Set();
  for (const t of tasksList) {
    const d = t.date;
    if (t.done || !d) continue;
    const tm = (t.time || '').trim();
    if (!tm) {
      fullSet.add(d);
      continue;
    }
    const parts = tm.split(':');
    const h = Number(parts[0]), m = Number(parts[1] || 0);
    if (!Number.isFinite(h) || !Number.isFinite(m)) {
      fullSet.add(d);
      continue;
    }
    const s = h * 60 + m, e = s + PORTAL_DUR_H * 60;
    for (let H = PORTAL_WH[0]; H < PORTAL_WH[1]; H++) {
      if (H * 60 < e && (H + 1) * 60 > s) {
        if (!busyMap.has(d)) busyMap.set(d, new Set());
        busyMap.get(d).add(H);
      }
    }
  }
  const busy = {};
  for (const [d, hs] of busyMap.entries()) {
    busy[d] = [...hs].sort((a, b) => a - b);
  }
  const full = [...fullSet].sort();

  const groups = new Map();
  for (const c of clientsList) {
    const n = normPhone(c.phone);
    if (n.length < 7) continue;
    const objs = getClientObjects(c);
    const showFin = c.showFin !== false;
    if (!groups.has(n)) groups.set(n, []);
    for (const o of objs) {
      const ts = tasksForObject(c, o.id, tasksList)
        .filter(t => t.pub !== false)
        .map(t => ({
          t: t.title || '',
          w: t.work || '',
          e: t.equip || '',
          d: t.date || '',
          tm: t.time || '',
          x: Boolean(t.done),
          st: t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo'),
          pr: Number(t.clientPrice) > 0 ? Number(t.clientPrice) : 0,
          n: t.pubNote || '',
          it: Array.isArray(t.items) ? t.items.map(x => ({
            n: x.name || '',
            q: Number(x.qty) || 1,
            p: Number(x.price) || 0,
            s: x.status || 'pending',
            dt: x.eta || ''
          })) : []
        }));
      const objIts = Array.isArray(o.items) ? o.items.map(x => ({
        n: x.name || '',
        q: Number(x.qty) || 1,
        p: Number(x.price) || 0,
        s: x.status || 'pending',
        dt: x.eta || ''
      })) : [];
      const svcs = showFin && Array.isArray(o.services) ? o.services.map(s => ({
        n: s.name || '',
        q: Number(s.qty) || 1,
        p: Number(s.price) || 0,
        cm: s.note || ''
      })) : [];
      const pays = showFin && Array.isArray(o.payments) ? o.payments.map(p => ({
        d: p.date || '',
        a: Number(p.amount) || 0,
        tp: CLI_PAY_TYPES[p.type] ? p.type : 'final',
        cm: p.note || ''
      })) : [];
      groups.get(n).push({
        name: c.name || '',
        phone: c.phone || '',
        addr: c.showAddress !== false ? (o.address || c.address || '') : '',
        proj: o.name || '',
        budget: Number(o.budget) > 0 ? Number(o.budget) : 0,
        msg: o.msg || '',
        pct: (typeof o.pct === 'number' && Number.isFinite(o.pct)) ? o.pct : null,
        cal: c.showCal !== false,
        items: objIts,
        tasks: ts,
        svcs,
        pays
      });
    }
  }

  const enc = new TextEncoder();
  const recs = [];
  for (const [n, cl] of groups.entries()) {
    const { id, key } = await deriveForPhone(n, saltB64);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const pt = enc.encode(JSON.stringify({ clients: cl }));
    const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt);
    recs.push({ id, iv: toB64(iv), ct: toB64(new Uint8Array(ctBuf)) });
  }

  const upd = new Date().toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  return { salt: saltB64, iter: PORTAL_ITER, wh: [...PORTAL_WH], busy, full, recs, upd };
}

async function rebuildPortal(notify = false) {
  if (!user || ready < 2) return;
  if (!(window.crypto && crypto.subtle)) {
    portalStatus = 'WebCrypto недоступен';
    updatePortalStatusEl();
    return;

  if (!navigator.onLine) {
    portalDirty = true;
    portalStatus = 'Ожидает подключения к сети';
    updatePortalStatusEl();
    return;
  }
  if (portalRunning) {
    portalDirty = true;
    return;
  }
  portalRunning = true;
  portalDirty = false;
  portalStatus = 'Обновляется…';
  updatePortalStatusEl();
  try {
    const saltB64 = await ensurePortalSalt();
    const payload = await buildPortalPayload(clients, tasks, saltB64);
    await setDoc(doc(db, 'pub', 'portal'), payload);
    portalExists = true;
    portalLastUpd = payload.upd;
    portalStatus = 'Обновлено: ' + payload.upd;
    updatePortalStatusEl();
    if (notify) toast('Страница клиента обновлена');
  } catch (e) {
    portalDirty = true;
    portalStatus = 'Ошибка обновления';
    updatePortalStatusEl();
    if (notify) toast('Не удалось обновить страницу клиента');
  } finally {
    portalRunning = false;
    if (portalDirty && navigator.onLine) schedulePortal(1500);
  }
}

async function ensureStaffSalt() {
  if (staffSalt) return staffSalt;
  try {
    const snap = await getDoc(doc(db, 'pub', 'staff'));
    if (snap.exists() && typeof snap.data().salt === 'string' && fromB64(snap.data().salt).length === 16) {
      staffSalt = snap.data().salt;
      return staffSalt;
    }
  } catch (e) {}
  staffSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  return staffSalt;
}

async function deriveForStaffPhone(phone9, saltB64) {
  const ck = saltB64 + ':staff:' + phone9;
  if (staffKeyCache.has(ck)) return staffKeyCache.get(ck);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode('staff:' + phone9), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({
    name: 'PBKDF2',
    salt: fromB64(saltB64),
    iterations: PORTAL_ITER,
    hash: 'SHA-256'
  }, km, 384));
  const id = toHex(bits.slice(0, 16));
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['encrypt']);
  const entry = { id, key };
  staffKeyCache.set(ck, entry);
  return entry;
}

function scheduleStaffPortal(delayMs = 2500) {

  staffDirty = true;

async function rebuildStaffPortal(notify = false) {
  if (!user || ready < 2) return;
  if (!(window.crypto && crypto.subtle) || !navigator.onLine) { staffDirty = true; return; }
  if (staffRunning) { staffDirty = true; return; }
  staffRunning = true;
  staffDirty = false;
  try {
    const saltB64 = await ensureStaffSalt();
    const enc = new TextEncoder();
    const recs = [];
    for (const s of staff) {
      if (s.active === false) continue;
      const n = normPhone(s.phone);
      if (n.length < 7) continue;
      // Delegated tasks for this staff member (NO client phone number!)
      const myTasks = tasks
        .filter(t => t.assigneeId === s.id)
        .map(t => {
          const cl = clients.find(c => c.id === t.clientId);
          const objs = cl ? getClientObjects(cl) : [];
          const obj = objs.find(o => o.id === t.objectId) || objs[0] || null;
          return {
            id: t.id,
            t: t.title || '',
            cl: cl ? (cl.name || '') : '',
            obj: obj ? (obj.name || '') : '',
            addr: (obj && obj.address) ? obj.address : (cl ? (cl.address || '') : ''),
            w: t.work || '',
            e: t.equip || '',
            d: t.date || '',
            tm: t.time || '',
            dtls: t.details || '',
            hi: Boolean(t.high),
            x: Boolean(t.done),
            st: t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo'),
            chk: Array.isArray(t.checklist) ? t.checklist.map(c => ({ id: c.id, t: c.text || '', x: Boolean(c.done) })) : [],
            sn: t.staffNote || '',
            ut: Number(t.staffSyncTs) || 0,
            pay: Number(t.staffPay) || 0,
            it: Array.isArray(t.items) ? t.items.map(x => ({ n: x.name || '', q: Number(x.qty) || 1 })) : []
          };
        });
      const myPays = (Array.isArray(s.payments) ? s.payments : []).map(p => ({
        id: p.id || '',
        d: p.date || '',
        a: Number(p.amount) || 0,
        tp: PAY_TYPES[p.type] ? p.type : 'work',
        n: p.note || ''
      }));
      const { id, key } = await deriveForStaffPhone(n, saltB64);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const payloadObj = {
        staff: { id: s.id, name: s.name || '', role: s.role || '', phone: s.phone || '' },
        tasks: myTasks,
        payments: myPays
      };
      const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(payloadObj)));
      recs.push({ id, iv: toB64(iv), ct: toB64(new Uint8Array(ctBuf)) });
    }
    const upd = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    await setDoc(doc(db, 'pub', 'staff'), { salt: saltB64, iter: PORTAL_ITER, wh: [...PORTAL_WH], recs, upd });
    if (notify) toast('Кабинет исполнителей обновлён');
  } catch (e) {
    staffDirty = true;
    if (notify) toast('Не удалось обновить кабинет исполнителей');
  } finally {
    staffRunning = false;
    if (staffDirty && navigator.onLine) scheduleStaffPortal(1500);
  }
}

async function applyStaffUpdates(docs) {
  if (!user || ready < 2) return;
  let changed = false;
  for (const d of docs) {
    const upds = d.updates || {};
    for (const [tid, u] of Object.entries(upds)) {
      if (!u || !u.ts) continue;
      const t = tasks.find(x => x.id === tid);
      if (!t || (d.staffId && t.assigneeId !== d.staffId)) continue;
      if (Number(u.ts) <= (Number(t.staffSyncTs) || 0)) continue;
      const nextSt = u.st === 'done' ? 'done' : (u.st === 'in_progress' ? 'in_progress' : 'todo');
      const nextChk = Array.isArray(t.checklist) ? t.checklist.map(c => ({
        id: c.id,
        text: c.text,
        done: u.chk && typeof u.chk[c.id] === 'boolean' ? u.chk[c.id] : Boolean(c.done)
      })) : [];
      const nextDoc = Object.assign({}, t, {
        status: nextSt,
        done: nextSt === 'done',
        checklist: nextChk,
        staffNote: typeof u.note === 'string' ? u.note : (t.staffNote || ''),
        staffSyncTs: Number(u.ts)
      });
      delete nextDoc.id;
      try {
        await setDoc(doc(db, 'tasks', tid), nextDoc);
        changed = true;
      } catch (e) {}
    }
  }
  if (changed) {
    schedulePortal(2000);
    scheduleStaffPortal(2000);
  }
}

  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planner-backup-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Файл резервной копии скачан');
}

async function importJsonFile(file) {
  if (!user || !file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    toast('Ошибка чтения JSON-файла');
    return;
  }
  const impClients = Array.isArray(data.clients) ? data.clients : [];
  const impTasks = Array.isArray(data.tasks) ? data.tasks : [];
  const impProds = Array.isArray(data.products) ? data.products : [];
  const impStaff = Array.isArray(data.staff) ? data.staff : [];
  if (!impClients.length && !impTasks.length && !impProds.length && !impStaff.length) {
    toast('В файле нет данных для импорта');
    return;
  }
  const ops = [];
  for (const c of impClients) {
    const id = String(c.id || uid());
    const docData = {
      name: String(c.name || '').trim(),
      phone: String(c.phone || '').trim(),
      address: String(c.address || '').trim(),
      note: String(c.note || '').trim(),
      created: Number(c.created) || Date.now()
    };
    if (c.showAddress !== undefined) docData.showAddress = Boolean(c.showAddress);
    if (c.showCal !== undefined) docData.showCal = Boolean(c.showCal);
    if (c.showFin !== undefined) docData.showFin = Boolean(c.showFin);
    if (c.pubProject) docData.pubProject = String(c.pubProject).trim();
    if (Number(c.budget) > 0) docData.budget = Number(c.budget);
    if (c.pubMsg) docData.pubMsg = String(c.pubMsg).trim();
    if (c.pubPct !== undefined && c.pubPct !== '' && c.pubPct !== null && Number.isFinite(Number(c.pubPct))) docData.pubPct = Number(c.pubPct);
    if (Array.isArray(c.objects) && c.objects.length) docData.objects = getClientObjects(c);
    if (Array.isArray(c.services)) docData.services = c.services.map(normObjSvc).filter(s => s.name);
    if (Array.isArray(c.payments)) docData.payments = c.payments.map(normObjPay).filter(p => p.amount > 0);
    ops.push({ col: 'clients', id, doc: docData });
  }
  for (const t of impTasks) {
    const id = String(t.id || uid());
    const isDone = Boolean(t.done);
    const st = isDone ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo');
    const docData = {
      clientId: String(t.clientId || ''),
      objectId: String(t.objectId || ''),
      title: String(t.title || '').trim(),
      work: String(t.work || ''),
      equip: String(t.equip || ''),
      date: String(t.date || ''),
      time: String(t.time || ''),
      details: String(t.details || '').trim(),
      high: Boolean(t.high),
      done: isDone,
      status: st,
      pub: t.pub !== false,
      clientPrice: Number(t.clientPrice) > 0 ? Number(t.clientPrice) : 0,
      pubNote: String(t.pubNote || '').trim(),
      assigneeId: String(t.assigneeId || ''),
      staffPay: Number(t.staffPay) > 0 ? Number(t.staffPay) : 0,
      checklist: Array.isArray(t.checklist) ? t.checklist.map(c => ({ id: String(c.id || uid()), text: String(c.text || '').trim(), done: Boolean(c.done) })).filter(c => c.text) : [],
      staffNote: String(t.staffNote || '').trim(),
      staffSyncTs: Number(t.staffSyncTs) || 0,
      items: Array.isArray(t.items) ? t.items.map(x => ({
        name: String(x.name || '').trim(),
        qty: Math.max(1, Number(x.qty) || 1),
        price: Number(x.price) || 0,
        status: ITEM_ST[x.status] ? x.status : 'pending',
        eta: String(x.eta || '')
      })).filter(x => x.name) : [],
      created: Number(t.created) || Date.now()
    };
    ops.push({ col: 'tasks', id, doc: docData });
  }
  for (const p of impProds) {
    const id = String(p.id || uid());
    ops.push({
      col: 'products',
      id,
      doc: {
        name: String(p.name || '').trim(),
        cat: SHOP_CATS[p.cat] ? p.cat : 'other',
        sku: String(p.sku || '').trim(),
        price: Number(p.price) || 0,
        unit: String(p.unit || 'шт.').trim(),
        desc: String(p.desc || '').trim(),
        img: String(p.img || '').trim(),
        inStock: p.inStock !== false,
        active: p.active !== false,
        created: Number(p.created) || Date.now()
      }
    });
  }
  for (const s of impStaff) {
    const id = String(s.id || uid());
    ops.push({
      col: 'staff',
      id,
      doc: {
        name: String(s.name || '').trim(),
        phone: String(s.phone || '').trim(),
        role: String(s.role || '').trim(),
        note: String(s.note || '').trim(),
        active: s.active !== false,
        payments: Array.isArray(s.payments) ? s.payments.map(p => ({ id: String(p.id || uid()), date: String(p.date || ''), amount: Number(p.amount) || 0, type: PAY_TYPES[p.type] ? p.type : 'work', note: String(p.note || '').trim() })).filter(p => p.amount > 0) : [],
        created: Number(s.created) || Date.now()
      }
    });
  }
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const batch = writeBatch(db);
      for (const op of ops.slice(i, i + 400)) {
        batch.set(doc(db, op.col, op.id), op.doc);
      }
      await batch.commit();
    }
    const parts = [];
    if (impClients.length) parts.push(`${impClients.length} кл.`);
    if (impTasks.length) parts.push(`${impTasks.length} зад.`);
    if (impProds.length) parts.push(`${impProds.length} тов.`);
    if (impStaff.length) parts.push(`${impStaff.length} исп.`);
    toast('Импортировано: ' + parts.join(', '));
    if (impClients.length || impTasks.length) schedulePortal(500);
    if (impProds.length) scheduleCatalog(500);
    if (impStaff.length || impTasks.length) scheduleStaffPortal(600);
  } catch (e) {
    toast('Ошибка импорта: проверьте доступ к базе');
  }
}

function dayLabel(d) {
  if (!d) return 'Без даты';
  const t = today();
  if (d < t) return 'Просрочено';
  if (d === t) return 'Сегодня';
  if (d === addDays(t, 1)) return 'Завтра';
  return new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
}
const shortDate = d => new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

function wireLoginForm() {
  const form = $('#loginForm');
  if (!form) return;
  form.onsubmit = async e => {
    e.preventDefault();
    const email = form.email.value.trim();
    const pass = form.password.value;
    const btn = $('#l-btn');
    const err = $('#l-err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Входим…';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (ex) {
      const code = ex && ex.code || '';
      if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
        err.textContent = 'Неверная почта или пароль.';
      } else if (code === 'auth/invalid-email') {
        err.textContent = 'Проверьте формат почты.';
      } else if (code === 'auth/too-many-requests') {
        err.textContent = 'Слишком много попыток. Подождите немного.';
      } else if (code === 'auth/network-request-failed') {
        err.textContent = 'Нет подключения к интернету.';
      } else if (code === 'auth/unauthorized-domain') {
        err.textContent = 'Домен не добавлен в Authorized domains в Firebase.';
      } else {
        err.textContent = 'Не удалось войти (' + (code || 'ошибка') + ').';
      }
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  };
}

    return hay.includes(q);

  if (!list.length) return h + `<div class="empty">${q ? 'По запросу ничего не найдено.' : (tasks.length || clients.length ? 'Здесь пока пусто.' : 'Начните с вкладки «Клиенты» или импортируйте данные в меню (⋯).')}</div>`;

  return h;

function findDuplicatePhoneGroups() {
  const byPh = new Map();
  for (const c of clients) {
    const p9 = normPhone(c.phone);
    if (p9.length < 7) continue;
    if (!byPh.has(p9)) byPh.set(p9, []);
    byPh.get(p9).push(c);
  }
  return [...byPh.values()].filter(g => g.length > 1);
}

async function mergeDuplicateClients() {
  const groups = findDuplicatePhoneGroups();
  if (!groups.length || !user) return;
  let mergedCount = 0;
  for (const grp of groups) {
    grp.sort((a, b) => (Number(a.created) || 0) - (Number(b.created) || 0));
    const primary = grp[0];
    const nextObjs = [...getClientObjects(primary)];
    const notes = [primary.note].filter(Boolean);
    const delIds = [];
    for (const dup of grp.slice(1)) {
      if (dup.note && !notes.includes(dup.note)) notes.push(dup.note);
      const dupObjs = getClientObjects(dup);
      const idMap = new Map();
      for (const o of dupObjs) {
        const newId = nextObjs.some(x => x.id === o.id) ? uid() : o.id;
        idMap.set(o.id, newId);
        nextObjs.push(Object.assign({}, o, { id: newId }));
      }
      const fallbackObjId = idMap.get(dupObjs[0].id);
      for (const t of tasks.filter(x => x.clientId === dup.id)) {
        const mappedObj = (t.objectId && idMap.has(t.objectId)) ? idMap.get(t.objectId) : fallbackObjId;
        const updT = Object.assign({}, t, { clientId: primary.id, objectId: mappedObj });
        delete updT.id;
        await setDoc(doc(db, 'tasks', t.id), updT);
      }
      delIds.push(dup.id);
    }
    const first = nextObjs[0];
    const updP = Object.assign({}, primary, {
      note: notes.join('\n---\n'),
      objects: nextObjs,
      pubProject: first.name || '',
      address: first.address || primary.address || '',
      budget: first.budget || 0,
      pubMsg: first.msg || '',
      pubPct: first.pct,
      services: first.services || [],
      payments: first.payments || []
    });
    delete updP.id;
    await setDoc(doc(db, 'clients', primary.id), updP);
    for (const did of delIds) {
      await deleteDoc(doc(db, 'clients', did));
      if (activeClientId === did) activeClientId = primary.id;
      if (clientFilter === did) clientFilter = primary.id;
      mergedCount++;
    }
  }
  schedulePortal(800);
  scheduleStaffPortal(1200);
  toast(`Объединено дубликатов: ${mergedCount}`);
}

            <td class="r">${p > 0 ? `${q} × ${esc(fmtAzn0(p))}<span class="pnote"><b>${esc(fmtAzn0(lineSum))}</b></span>` : `× ${q}`}</td>

      </table>`
    : '<div class="meta" style="text-align:center;padding:12px 0">Товары на этот объект пока не добавлены.</div>';

  // Tasks list with 1-click checkbox + inline status dropdown + price
  const orderedTasks = [...s.objTasks].sort((a, b) => Number(Boolean(a.done)) - Number(Boolean(b.done)) || ((a.date || '9999') + (a.time || '')).localeCompare((b.date || '9999') + (b.time || '')));
  const tasksListHtml = orderedTasks.length
    ? orderedTasks.map(t => {
        const curSt = t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo');
        const asg = t.assigneeId ? sname(t.assigneeId) : '';
        const metaStr = [
          t.date ? shortDate(t.date) + (t.time ? ', ' + t.time : '') : '',
          t.work,
          asg ? 'Исп.: ' + asg : '',
          t.pub === false ? 'Скрыто от клиента' : ''

  // Payments table for this object
  const paysTbl = s.pays.length

        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">Итого получено по объекту</td><td class="r" colspan="2">${esc(fmtAzn0(s.paidTotal))}</td></tr></tfoot>

  // Optional services table for this object
  const svcsTbl = s.svcs.length
    ? `<div class="sec"><div class="sec-t">Дополнительные услуги по объекту</div>

              <td class="r">${Number(sv.qty) || 1} × ${esc(fmtAzn0(sv.price))}</td>
              <td class="r">${esc(fmtAzn0(ls))}</td>
              <td class="r"><button type="button" class="btn d" data-act="delobjsvc" data-id="${c.id}" data-oid="${esc(obj.id)}" data-sid="${esc(sv.id)}" style="padding:2px 7px;font-size:12px" aria-label="Удалить">×</button></td>
            </tr>`;

          <tfoot><tr><td colspan="2">Итого услуги</td><td class="r" colspan="2">${esc(fmtAzn0(s.svcTotal))}</td></tr></tfoot>
        </table>

    <div class="cw-top">

        <div class="ckpi${totBalCls}"><div class="ckpi-k">${esc(totBalLbl)}</div><div class="ckpi-v">${finAll.bal === 0 ? '0 ₼' : esc(fmtAzn0(Math.abs(finAll.bal)))}</div></div>

          ${obj.address ? `<div class="links meta"><a href="https://maps.apple.com/?q=${encodeURIComponent(obj.address)}" target="_blank" rel="noopener">${esc(obj.address)}</a></div>` : ''}
          ${obj.msg ? `<div class="meta">💬 Для клиента: ${esc(obj.msg)}</div>` : ''}
        </div>
        <button type="button" class="btn" data-act="editobj" data-id="${c.id}" data-oid="${esc(obj.id)}">Настройки объекта</button>
      </div>
      <div class="pbar">
        <div class="pbar-ok" style="width:${doneW.toFixed(1)}%"></div>
        <div class="pbar-pr" style="width:${progW.toFixed(1)}%"></div>

    <div class="cw-grid">
      <div class="cw-card span2">
        <div class="cw-card-hd">
          <h3>Товары объекта<span class="cw-pill">${s.allItems.length}</span></h3>

        ${itemsTbl}

          <div class="qform-t">Добавить товар на «${esc(obj.name)}»</div>
          ${prodOpts ? `<div class="it-add" style="margin:0 0 8px">
            <select id="cwCatSel"><option value="">Выбрать из каталога магазина…</option>${prodOpts}</select>
            <button type="button" class="btn" data-act="cwfillcat">Подставить</button>

          <div class="qgrid">
            <input class="full" type="text" name="name" required placeholder="Название товара / модели">
            <input type="number" name="qty" min="1" step="1" value="1" placeholder="Кол-во">
            <input type="number" name="price" min="0" step="0.5" placeholder="Цена за шт., ₼">
            <select name="status">${Object.entries(ITEM_ST).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select>
            <input type="date" name="eta" title="Дата получения">

          <div class="row"><button type="submit" class="btn p">+ Добавить товар</button></div>

      </div>

      <div class="cw-card span2">
        <div class="cw-card-hd">
          <h3>Задачи объекта<span class="cw-pill">${s.objTasks.length}</span></h3>

            <input type="number" name="amount" min="0.5" step="0.5" required placeholder="Сумма, ₼ (напр. 300)">

          <div class="row"><button type="submit" class="btn p">+ Записать оплату</button></div>
        </form>

        <div class="sec">
          <div class="sec-t">История оплат по объекту (видна клиенту)</div>
          ${paysTbl}
        </div>

        ${svcsTbl}
        <details style="margin-top:12px">
          <summary class="meta" style="cursor:pointer;font-weight:600">+ Добавить доп. услугу в смету объекта</summary>
          <form class="qform" data-qform="addsvc" data-cid="${c.id}" data-oid="${esc(obj.id)}">
            <div class="qgrid">

            </div>
            <div class="row"><button type="submit" class="btn p">+ Добавить услугу</button></div>
          </form>

    </div>
  </div>`;
}

function clientsHtml() {
  if (!clients.length) return '<div class="empty">Клиентов пока нет. Нажмите «Новый клиент» или импортируйте данные в меню (⋯).</div>';
  if (activeClientId) {
    const active = clients.find(x => x.id === activeClientId);
    if (active) return clientWorkspaceHtml(active);
    activeClientId = '';
    activeObjId = '';
  }
  const dups = findDuplicatePhoneGroups();
  let banner = searchBarHtml('clientSearch', clientQuery, 'Поиск по имени, телефону, адресу или объекту…');
  if (dups.length) {
    const extraCount = dups.reduce((a, g) => a + g.length - 1, 0);
    banner += `<div class="dup-banner">
      <div><b>Найдены дубликаты клиентов (${extraCount})</b> с одинаковым номером телефона. Объедините их в 1 карточку клиента с вложенными объектами — все задачи и оплаты сохранятся.</div>
      <button type="button" class="btn p" data-act="mergedups">Объединить сейчас</button>
    </div>`;
  }
  const q = clientQuery.trim().toLowerCase();
  const filtered = [...clients]
    .filter(c => {
      if (!q) return true;
      const objs = getClientObjects(c);
      const hay = [c.name, c.phone, c.address, c.note, ...objs.map(o => o.name + ' ' + (o.address || ''))].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  if (!filtered.length) return banner + '<div class="empty">По запросу клиенты не найдены.</div>';
  return banner + filtered.map(c => {
    const fin = clientFinSummary(c);
    const hasFin = fin.totalBudget > 0 || fin.paidTotal > 0;
    const balTag = hasFin
      ? (fin.bal > 0 ? `<span class="tag">Долг: ${esc(fmtAzn0(fin.bal))}</span>`
        : fin.bal < 0 ? `<span class="tag ok">Переплата: ${esc(fmtAzn0(Math.abs(fin.bal)))}</span>`
        : '<span class="tag ok">Оплачено</span>')
      : '';
    const finLine = hasFin
      ? `<div class="meta">Бюджет: <b>${esc(fmtAzn0(fin.totalBudget))}</b> · Получено: <b style="color:var(--ok)">${esc(fmtAzn0(fin.paidTotal))}</b>${fin.bal > 0 ? ' · Остаток: <b style="color:var(--danger)">' + esc(fmtAzn0(fin.bal)) + '</b>' : ''}</div>`
      : '';
    const objChips = fin.objs.map(o => `<span class="ochip">${esc(o.name)}</span>`).join('');
    return `<div class="cl"><div class="main">
      <div class="head" data-act="openclient" data-id="${c.id}">
        <div class="ttl">${esc(c.name)}${balTag}</div>
        <div class="meta">Объектов: <b>${fin.objs.length}</b> · Открытых задач: <b>${fin.openTasks}</b></div>
        <div class="obj-chips">${objChips}</div>
        ${finLine}
      </div>
      ${c.phone ? `<div class="links meta" style="margin-top:6px"><a href="tel:${esc(tel(c.phone))}">${esc(c.phone)}</a></div>` : ''}
      ${c.note ? `<div class="meta" style="white-space:pre-wrap">${esc(c.note)}</div>` : ''}
      <div class="row">
        <button class="btn p" data-act="openclient" data-id="${c.id}">Открыть клиента</button>
        <button class="btn" data-act="addobj" data-id="${c.id}">+ Объект</button>
        <button class="btn" data-act="editclient" data-id="${c.id}">Изменить</button>
        <button class="btn d" data-act="delclient" data-id="${c.id}">Удалить</button>
      </div>
    </div></div>`;
  }).join('');
}

function requestsHtml() {
  if (reqErr) return '<div class="empty">Нет доступа к разделу заявок. Обновите правила Firestore (раздел <code>requests</code>) и обновите страницу.</div>';
  if (!requests.length) return '<div class="empty">Новых заявок пока нет. Нажмите «Ссылка на анкету», чтобы отправить форму клиенту.</div>';
  const list = [...requests].sort((a, b) => (Number(b.created) || 0) - (Number(a.created) || 0));
  return list.map(r => {
    const dt = r.created ? new Date(r.created).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    const objs = fmtReqList(r.objects, REQ_OBJ, r.objectsOther);
    const role = fmtReqList(r.role, REQ_ROLE, r.roleOther);
    const svcs = fmtReqList(r.services, REQ_SVC, r.servicesOther);
    const cats = fmtReqList(r.categories, REQ_CAT, r.categoriesOther);
    const accepted = r.status === 'accepted';
    const existing = r.clientId ? clients.find(c => c.id === r.clientId) : null;
    const badge = accepted ? '<span class="tag ok">Принята</span>' : '<span class="tag">Новая</span>';
    const langTag = r.lang ? `<span class="tag info">${esc(String(r.lang).toUpperCase())}</span>` : '';
    const acts = accepted && existing
      ? `<button class="btn p" data-act="reqtask" data-id="${r.id}">Новая задача</button><button class="btn" data-act="editclient" data-id="${existing.id}">Клиент</button><button class="btn d" data-act="delreq" data-id="${r.id}">Удалить</button>`
      : `<button class="btn p" data-act="accreq" data-id="${r.id}">Принять в клиенты</button><button class="btn d" data-act="delreq" data-id="${r.id}">Удалить</button>`;
    return `<div class="cl"><div class="main">
      <div class="ttl">${esc(r.name || 'Без имени')}${badge}${langTag}</div>
      ${dt ? `<div class="meta">${esc(dt)}</div>` : ''}
      ${r.phone ? `<div class="links meta"><a href="tel:${esc(tel(r.phone))}">${esc(r.phone)}</a></div>` : ''}
      <div class="kv">
        ${objs ? `<div><b>Объект:</b> ${esc(objs)}</div>` : ''}
        ${role ? `<div><b>Статус:</b> ${esc(role)}</div>` : ''}
        ${svcs ? `<div><b>Услуги:</b> ${esc(svcs)}</div>` : ''}
        ${cats ? `<div><b>Задачи:</b> ${esc(cats)}</div>` : ''}
      </div>
      <div class="row">${acts}</div>
    </div></div>`;
  }).join('');
}

function shopHtml() {
  const newOrds = orders.filter(o => o.status !== 'linked').length;
  let h = `<div class="chips">
    <button class="chip ${shopTab === 'orders' ? 'on' : ''}" data-act="shoptab" data-st="orders">Заказы<b>${newOrds || orders.length}</b></button>
    <button class="chip ${shopTab === 'catalog' ? 'on' : ''}" data-act="shoptab" data-st="catalog">Каталог<b>${products.length}</b></button>
  </div>`;

  if (shopTab === 'orders') {
    if (ordErr) return h + '<div class="empty">Нет доступа к заказам. Обновите правила Firestore (разделы <code>products</code> и <code>orders</code>) и обновите страницу.</div>';
    if (!orders.length) return h + '<div class="empty">Заказов из магазина пока нет. Отправьте клиенту ссылку на магазин.</div>';
    const list = [...orders].sort((a, b) => (Number(b.created) || 0) - (Number(a.created) || 0));
    return h + list.map(o => {
      const dt = o.created ? new Date(o.created).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
      const linked = o.status === 'linked';
      const badge = linked ? '<span class="tag ok">В задаче</span>' : '<span class="tag">Новый</span>';
      const langTag = o.lang ? `<span class="tag info">${esc(String(o.lang).toUpperCase())}</span>` : '';
      const its = Array.isArray(o.items) ? o.items : [];
      const tot = Number(o.total) > 0 ? fmtAzn(o.total) : '';
      return `<div class="cl"><div class="main">
        <div class="ttl">${esc(o.name || 'Без имени')}${badge}${langTag}</div>
        ${dt ? `<div class="meta">${esc(dt)}${tot ? ' · Итого: ' + esc(tot) : ''}</div>` : ''}
        ${o.phone ? `<div class="links meta"><a href="tel:${esc(tel(o.phone))}">${esc(o.phone)}</a></div>` : ''}
        <div class="it-list">${its.map(x => `<div class="it-row"><div><b>${esc(x.name)}</b> × ${Number(x.qty) || 1}</div><div>${x.price > 0 ? esc(fmtAzn(x.price * (x.qty || 1))) : ''}</div></div>`).join('')}</div>
        ${o.comment ? `<div class="meta" style="white-space:pre-wrap;margin-top:4px">Комментарий: ${esc(o.comment)}</div>` : ''}
        <div class="row">
          <button class="btn p" data-act="linkord" data-id="${o.id}">${linked ? 'Добавить ещё раз' : 'Привязать к задаче'}</button>
          <button class="btn d" data-act="delord" data-id="${o.id}">Удалить</button>
        </div>
      </div></div>`;
    }).join('');
  }

}

function messagesHtml() {
  if (chatErr) return '<div class="empty">Нет доступа к сообщениям. Обновите правила Firestore (раздел <code>chats</code>) и обновите страницу.</div>';
  const isStaffChat = ch => ch.kind === 'staff';
  const cAll = chats.length;
  const cCli = chats.filter(ch => !isStaffChat(ch)).length;
  const cStf = chats.filter(isStaffChat).length;
  let h = `<div class="chips">
    <button class="chip ${msgFilter === 'all' ? 'on' : ''}" data-act="msgf" data-mf="all">Все<b>${cAll}</b></button>
    <button class="chip ${msgFilter === 'client' ? 'on' : ''}" data-act="msgf" data-mf="client">Клиенты<b>${cCli}</b></button>
    <button class="chip ${msgFilter === 'staff' ? 'on' : ''}" data-act="msgf" data-mf="staff">Исполнители<b>${cStf}</b></button>
  </div>`;
  const filtered = chats.filter(ch => msgFilter === 'all' ? true : (msgFilter === 'staff' ? isStaffChat(ch) : !isStaffChat(ch)));
  if (!filtered.length) return h + '<div class="empty">Сообщений пока нет. Нажмите «Написать», чтобы начать чат с клиентом или исполнителем.</div>';

    const person = p9.length >= 7
      ? (stf ? staff.find(s => normPhone(s.phone) === p9) : clients.find(c => normPhone(c.phone) === p9))
      : null;
    const title = (person && person.name) || ch.clientName || (stf ? 'Исполнитель' : 'Клиент');
    const dt = ch.lastTs ? new Date(ch.lastTs).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

    const badge = u > 0 ? `<span class="tag">${u} нов.</span>` : '';
    const pref = ch.lastFrom === 'admin' ? 'Вы: ' : '';
    return `<div class="cl"><div class="main">
      <div class="head" data-act="openchat" data-id="${ch.id}">
        <div class="ttl">${esc(title)}${roleTag}${badge}</div>

        <button class="btn d" data-act="delchat" data-id="${ch.id}">Удалить</button>
      </div>
    </div></div>`;
  }).join('');
}

function financeHtml() {
  const ymNow = today().slice(0, 7);
  let totBudget = 0, totReceived = 0, monthReceived = 0, totCliDebt = 0;
  const debtors = [];
  const allPays = [];
  for (const c of clients) {
    const fin = clientFinSummary(c);
    totBudget += fin.totalBudget;
    totReceived += fin.paidTotal;
    if (fin.bal > 0) {
      totCliDebt += fin.bal;
      debtors.push({ c, fin });
    }
    for (const o of fin.objs) {
      for (const p of (o.payments || [])) {
        if ((p.date || '').slice(0, 7) === ymNow) monthReceived += Number(p.amount) || 0;
        allPays.push({ date: p.date || '', amount: Number(p.amount) || 0, type: p.type, note: p.note || '', clientId: c.id, clientName: c.name, objId: o.id, objName: o.name });
      }
    }
  }
  debtors.sort((a, b) => b.fin.bal - a.fin.bal);
  allPays.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  let totStaffPaid = 0, totStaffDebt = 0;
  const staffRows = [];
  for (const s of staff) {
    const sf = staffFinSummary(s);
    totStaffPaid += sf.totalPaid;
    if (sf.bal > 0) totStaffDebt += sf.bal;
    if (sf.earnedDone > 0 || sf.totalPaid > 0 || sf.plannedPay > 0) staffRows.push({ s, sf });
  }
  staffRows.sort((a, b) => b.sf.bal - a.sf.bal);

  const netCash = Math.round((totReceived - totStaffPaid) * 100) / 100;
  const monthLabel = new Date(ymNow + '-15T12:00:00').toLocaleDateString('ru-RU', { month: 'long' });

  const debtorsHtml = debtors.length
    ? debtors.map(({ c, fin }) => `<div class="fin-row">
        <div>
          <div class="ttl">${esc(c.name)}</div>
          <div class="meta">Объектов: ${fin.objs.length} · Бюджет: ${esc(fmtAzn0(fin.totalBudget))} · Получено: ${esc(fmtAzn0(fin.paidTotal))}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <b style="color:var(--danger);white-space:nowrap">${esc(fmtAzn0(fin.bal))}</b>
          <button type="button" class="btn" data-act="openclient" data-id="${c.id}">Открыть</button>
        </div>
      </div>`).join('')
    : '<div class="meta" style="text-align:center;padding:12px 0">Долгов у клиентов нет.</div>';

  const staffHtmlList = staffRows.length
    ? staffRows.map(({ s, sf }) => `<div class="fin-row">
        <div>
          <div class="ttl">${esc(s.name)}</div>
          <div class="meta">Начислено: ${esc(fmtAzn0(sf.earnedDone))} · Выплачено: ${esc(fmtAzn0(sf.totalPaid))}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <b style="color:${sf.bal > 0 ? 'var(--danger)' : 'var(--ok)'};white-space:nowrap">${sf.bal > 0 ? 'Долг: ' + esc(fmtAzn0(sf.bal)) : (sf.bal < 0 ? 'Аванс: ' + esc(fmtAzn0(Math.abs(sf.bal))) : 'Закрыто')}</b>
          <button type="button" class="btn" data-act="spays" data-id="${s.id}">Выплаты</button>
        </div>
      </div>`).join('')
    : '<div class="meta" style="text-align:center;padding:12px 0">Начислений и выплат исполнителям пока нет.</div>';

  const recentPaysHtml = allPays.length
    ? `<table class="ptbl">
        <thead><tr><th>Дата</th><th>Клиент / за что</th><th class="r">Сумма</th></tr></thead>
        <tbody>${allPays.slice(0, 20).map(p => `<tr>
          <td>${esc(p.date ? shortDate(p.date) : '—')}</td>
          <td><b>${esc(p.clientName)}</b> · ${esc(p.objName)}<span class="pnote">${esc(CLI_PAY_TYPES[p.type] || p.type)}${p.note ? ' — ' + esc(p.note) : ''}</span></td>
          <td class="r"><b style="color:var(--ok)">+${esc(fmtAzn0(p.amount))}</b></td>
        </tr>`).join('')}</tbody>
      </table>`
    : '<div class="meta" style="text-align:center;padding:12px 0">Оплат от клиентов пока не записано.</div>';

  return `<div class="cw-wrap">
    <div class="cw-card">
      <div class="cw-card-hd"><h3>Общая сводка</h3><span class="cw-pill">Бюджет всех объектов: ${esc(fmtAzn0(totBudget))}</span></div>
      <div class="fin-kpi4">
        <div class="ckpi ok"><div class="ckpi-k">Получено (${esc(monthLabel)})</div><div class="ckpi-v">${esc(fmtAzn0(monthReceived))}</div></div>
        <div class="ckpi"><div class="ckpi-k">Получено всего</div><div class="ckpi-v">${esc(fmtAzn0(totReceived))}</div></div>
        <div class="ckpi${totCliDebt > 0 ? ' debt' : ' ok'}"><div class="ckpi-k">Должны клиенты</div><div class="ckpi-v">${esc(fmtAzn0(totCliDebt))}</div></div>
        <div class="ckpi${netCash >= 0 ? ' ok' : ' debt'}"><div class="ckpi-k">Чистый остаток</div><div class="ckpi-v">${esc(fmtAzn0(netCash))}</div></div>
      </div>
      <div class="meta" style="margin-top:10px">Выплачено исполнителям: <b>${esc(fmtAzn0(totStaffPaid))}</b> · Ваш долг исполнителям: <b style="color:${totStaffDebt > 0 ? 'var(--danger)' : 'var(--ok)'}">${esc(fmtAzn0(totStaffDebt))}</b></div>
    </div>
    <div class="cw-grid">
      <div class="cw-card">
        <div class="cw-card-hd"><h3>Долги клиентов<span class="cw-pill">${debtors.length}</span></h3></div>
        ${debtorsHtml}
      </div>
      <div class="cw-card">
        <div class="cw-card-hd"><h3>Исполнители<span class="cw-pill">${staffRows.length}</span></h3></div>
        ${staffHtmlList}
      </div>
      <div class="cw-card span2">
        <div class="cw-card-hd"><h3>Последние поступления от клиентов<span class="cw-pill">${allPays.length}</span></h3></div>
        ${recentPaysHtml}
      </div>
    </div>
  </div>`;
}

// --- Modals ---
function modal(title, body, onSave, delOpts) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  const delBtn = delOpts ? `<button class="btn d" type="button" data-del style="margin-left:auto">Удалить</button>` : '';
  ov.innerHTML = `<form><h3>${title}</h3>${body}<div class="row"><button class="btn p" type="submit">Сохранить</button><button class="btn" type="button" data-x>Отмена</button>${delBtn}</div></form>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-x]').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  if (delOpts) {
    let sure = false;
    const dbBtn = ov.querySelector('[data-del]');
    dbBtn.onclick = async () => {
      if (!sure) { sure = true; dbBtn.textContent = delOpts.confirm || 'Точно удалить?'; return; }
      ov.remove();
      await delOpts.run();
    };
  }
  ov.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    e.target.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.name) f[cb.name] = cb.checked; });
    ov.remove();
    await onSave(f);
  };
  const first = ov.querySelector('input[type=text]');
  if (first) first.focus();
  return ov;
}
