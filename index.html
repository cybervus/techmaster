<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#1a2330;--muted:#5a6675;--line:#d3d9e1;--accent:#1e3a5f;--on:#fff;--danger:#9e2a2b;--ok:#2f6b4f;--warn:#8a5a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#181d24;--text:#e4e8ee;--muted:#9aa5b4;--line:#2b333d;--accent:#8db1dc;--on:#10151b;--danger:#e27d7e;--ok:#6fbf94;--warn:#e0b05a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#181d24;--text:#e4e8ee;--muted:#9aa5b4;--line:#2b333d;--accent:#8db1dc;--on:#10151b;--danger:#e27d7e;--ok:#6fbf94;--warn:#e0b05a;color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "IBM Plex Sans",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 90px;max-width:640px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px;border-bottom:2px solid var(--text)}
h1{font-size:21px;font-weight:600;margin:0;line-height:1.2}
#date{color:var(--muted);font-size:13px;line-height:1.3}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{margin:0;line-height:0;color:var(--accent);flex:none}
.logo svg{width:48px;height:48px;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hact{display:flex;align-items:center;gap:6px;flex:none}
.hact .btn.ic{padding:8px 10px}
#note{background:var(--card);border:1px solid var(--warn);border-left-width:4px;color:var(--warn);border-radius:3px;padding:8px 12px;font-size:13px;margin:10px 0}
.chips{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:4px}
.chip{flex:none;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:12px 0 10px;margin-bottom:-1px;font:inherit;font-weight:500}
.chip.on{color:var(--text);border-bottom-color:var(--accent)}
.chip b{font-weight:400;margin-left:6px}
h2{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);font-size:15px;font-weight:600;margin:20px 0 0;padding:9px 8px 7px;border-top:2px solid var(--text)}
h2 span{font-weight:400;font-size:13px;color:var(--muted)}
h2.late{color:var(--danger);border-top-color:var(--danger)}
.tr{display:grid;grid-template-columns:20px 3.4rem 1fr;gap:12px;align-items:start;background:var(--card);border-bottom:1px solid var(--line);padding:11px 8px}
.tr.hi{box-shadow:inset 3px 0 0 var(--danger)}
.tr.done .ttl{text-decoration:line-through;color:var(--muted)}
.tm{font-weight:600;padding-top:1px}
.tm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chk{position:relative;width:20px;height:20px;margin-top:2px;border-radius:3px;border:1.5px solid var(--muted);background:none;color:transparent;font-size:13px;line-height:1;padding:0}
.chk::after{content:'';position:absolute;inset:-12px}
.tr.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{margin-left:8px;padding:1px 6px;border:1px solid var(--danger);color:var(--danger);border-radius:2px;font-size:12px;font-weight:500;vertical-align:1px}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.prog{border-color:var(--accent);color:var(--accent)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.info{border-color:var(--line);color:var(--muted)}
.it-list{margin:8px 0;border-top:1px solid var(--line)}
.it-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.it-box{border:1px solid var(--line);border-radius:3px;padding:8px;margin-top:8px;background:var(--bg)}
.it-top{display:flex;gap:6px;align-items:center}
.it-top input{flex:1;padding:7px 8px;font-size:14px}
.it-top .btn{padding:6px 10px;font-size:13px}
.it-g{display:grid;grid-template-columns:64px 86px 1fr;gap:6px;margin-top:6px}
.it-g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.it-box input,.it-box select{padding:7px 8px;font-size:14px}
.it-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.it-add select{flex:1;min-width:160px;padding:8px;font-size:14px}
.nbadge{display:inline-block;margin-left:5px;padding:0 5px;min-width:18px;border-radius:2px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;line-height:17px;vertical-align:1px}
.kv{margin-top:6px;font-size:13px;line-height:1.45}
.kv div{margin-top:2px}
.kv b{color:var(--muted);font-weight:500}
.cl{background:var(--card);border-bottom:1px solid var(--line);padding:12px 8px}
.cl:first-child{border-top:2px solid var(--text)}
.main{flex:1;min-width:0}
.head{cursor:pointer}
.ttl{font-weight:600}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.more p{margin:0 0 8px;white-space:pre-wrap}
.links a{color:var(--accent);margin-right:16px;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--muted);background:var(--card);color:var(--text);border-radius:3px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.d{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.6;cursor:default}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 6px 6px 12px;font-size:14px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-top:2px solid transparent;margin-top:-1px;background:none;color:var(--muted);padding:14px 2px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
nav button.on{color:var(--text);border-top-color:var(--accent);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov form,.ov .sheet{background:var(--card);width:100%;max-width:640px;border-radius:4px 4px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.ov h3{margin:0 0 6px;font-size:18px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--muted);border-radius:3px;padding:10px}
textarea{min-height:90px;resize:vertical}
.two{display:flex;gap:10px}.two>div{flex:1}
.inl{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text);font-size:15px}
.inl input{width:auto}
.calh{display:flex;align-items:center;justify-content:space-between;margin:6px 0;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.day{position:relative;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:3px;height:40px;font:inherit;font-size:15px;padding:0;cursor:pointer}
.day.tod{border-color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--on)}
.day i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--warn)}
.day.sel i{background:var(--on)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.qk .btn{padding:6px 10px;font-size:13px}
.auth{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--text);border-radius:3px;padding:18px 16px;margin:24px 0}
.auth h3{margin:0 0 4px;font-size:18px;font-weight:600}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:3px;font-size:14px;z-index:30}
</style>

<body>
<header>
  <div class="brand">
    <h1 class="logo"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16.09 6.35 L16.57 2.33 L23.43 2.33 L23.91 6.35 A14.2 14.2 0 0 1 29.86 9.79 L33.58 8.19 L37.02 14.14 L33.78 16.56 A14.2 14.2 0 0 1 33.78 23.44 L37.02 25.86 L33.58 31.81 L29.86 30.21 A14.2 14.2 0 0 1 23.91 33.65 L23.43 37.67 L16.57 37.67 L16.09 33.65 A14.2 14.2 0 0 1 10.14 30.21 L6.42 31.81 L2.98 25.86 L6.22 23.44 A14.2 14.2 0 0 1 6.22 16.56 L2.98 14.14 L6.42 8.19 L10.14 9.79 A14.2 14.2 0 0 1 16.09 6.35 Z"/><circle cx="20" cy="20" r="8.8"/><path d="M20 20V14.2M20 20l4.2 2.4"/></svg><span id="ttl" class="vh">Задачи</span></h1>

<input type="file" id="impfile" accept=".json,application/json" hidden>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {
  initializeFirestore,
  getFirestore,
  persistentLocalCache,
  collection,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  onSnapshot,
  writeBatch
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache() });
} catch (e) {
  db = getFirestore(app);
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

let clients = [], tasks = [], requests = [], products = [], orders = [];
let reqErr = false, prodErr = false, ordErr = false, view = 'tasks', filter = 'today', shopTab = 'orders', clientFilter = '';
let user = null, authReady = false, ready = 0, armed = null, unsubs = [], catTimer = null;
const opened = new Set();

const SHOP_CATS = { security: 'Видеонаблюдение', network: 'Сеть и Wi-Fi', access: 'Домофония и СКУД', smarthome: 'Умный дом', av: 'Аудио-видео', cable: 'Кабель и расходники', other: 'Другое' };
const ITEM_ST = { pending: 'К заказу', ordered: 'Заказано', bought: 'Куплено', received: 'Получено' };
const ITEM_CLS = { pending: 'info', ordered: 'warn', bought: 'prog', received: 'ok' };
const fmtAzn = p => { const n = Number(p); return (Number.isFinite(n) && n > 0) ? ((Number.isInteger(n) ? n : n.toFixed(2)) + ' ₼') : ''; };

function scheduleCatalog(delayMs = 1500) {
  if (!user) return;
  if (catTimer) clearTimeout(catTimer);
  catTimer = setTimeout(() => { catTimer = null; syncCatalog(false); }, delayMs);
}
async function syncCatalog(notify = false) {
  if (!user || !navigator.onLine) return;
  const active = [...products]
    .filter(p => p.active !== false)
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'))
    .map(p => ({
      id: p.id,
      name: p.name || '',
      cat: p.cat || 'other',
      sku: p.sku || '',
      price: Number(p.price) || 0,
      unit: p.unit || 'шт.',
      desc: p.desc || '',
      img: p.img || '',
      inStock: p.inStock !== false
    }));
  const upd = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  try {
    await setDoc(doc(db, 'pub', 'catalog'), { items: active, upd });
    if (notify) toast('Каталог магазина обновлён');
  } catch (e) {
    if (notify) toast('Не удалось обновить каталог');
  }
}
async function seedSampleProducts() {
  if (!user) return;
  const samples = [
    { name: 'IP-камера 4MP уличная (PoE, ИК 30м)', cat: 'security', sku: 'DS-2CD2043G2-I', price: 145, unit: 'шт.', desc: 'Металлический корпус IP67, детекция человека и авто.', inStock: true, active: true },
    { name: 'Сетевой видеорегистратор NVR 8 кан. PoE', cat: 'security', sku: 'DS-7608NXI-K1/8P', price: 320, unit: 'шт.', desc: 'Поддержка камер до 8MP, 1 слот HDD до 10 ТБ.', inStock: true, active: true },
    { name: 'Точка доступа Wi-Fi 6 (PoE)', cat: 'network', sku: 'U6-Plus', price: 240, unit: 'шт.', desc: 'Двухдиапазонная потолочная точка доступа Ubiquiti.', inStock: true, active: true },
    { name: 'PoE-коммутатор 8 портов Gigabit', cat: 'network', sku: 'SG108PE', price: 135, unit: 'шт.', desc: 'Управляемый коммутатор с питанием PoE+.', inStock: true, active: true },
    { name: 'IP-видеодомофон (комплект с вызывной панелью)', cat: 'access', sku: 'DS-KIS603-P', price: 380, unit: 'компл.', desc: 'Экран 7", управление со смартфона, открытие замка.', inStock: false, active: true },
    { name: 'Кабель витая пара Cat6 (медь, уличный)', cat: 'cable', sku: 'UTP Cat6 PE', price: 1.5, unit: 'м', desc: '100% медь, устойчив к УФ-излучению.', inStock: true, active: true }
  ];
  try {
    const batch = writeBatch(db);
    const now = Date.now();
    samples.forEach((s, i) => batch.set(doc(db, 'products', uid()), Object.assign({ img: '', created: now + i }, s)));
    await batch.commit();
    scheduleCatalog(400);
    toast('Добавлено 6 примеров товаров');
  } catch (e) {
    toast('Ошибка: проверьте правила Firestore (products)');
  }
}

const REQ_OBJ = { flat: 'Квартира', house: 'Частный дом', office: 'Офис', enterprise: 'Предприятие', other: 'Другое' };
const REQ_ROLE = { owner: 'Собственник', foreman: 'Прораб', master: 'Мастер', builder: 'Представитель строительной организации', other: 'Другое' };
const REQ_SVC = { inspect: 'Осмотр / консультация', buy: 'Покупка оборудования', install: 'Установка оборудования', setup: 'Настройка оборудования', other: 'Другое' };
const REQ_CAT = { security: 'Системы безопасности', network: 'Сетевые решения', smarthome: 'Умный дом', av: 'Аудио-видео системы', other: 'Другое' };

function fmtReqList(ids, dict, otherText) {
  const arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
  return arr.map(id => id === 'other' ? (otherText ? `Другое: ${otherText}` : 'Другое') : (dict[id] || id)).join(', ');
}
function reqNoteText(r) {
  const lines = [];
  const role = fmtReqList(r.role, REQ_ROLE, r.roleOther);
  const objs = fmtReqList(r.objects, REQ_OBJ, r.objectsOther);
  const svcs = fmtReqList(r.services, REQ_SVC, r.servicesOther);
  const cats = fmtReqList(r.categories, REQ_CAT, r.categoriesOther);
  if (role) lines.push('Статус: ' + role);
  if (objs) lines.push('Объект: ' + objs);
  if (svcs) lines.push('Услуги: ' + svcs);
  if (cats) lines.push('Задачи: ' + cats);
  if (r.lang) lines.push('Язык анкеты: ' + String(r.lang).toUpperCase());
  return lines.join('\n');
}
async function copyUrl(rel, label) {
  const url = new URL(rel, location.href).href;
  try {
    await navigator.clipboard.writeText(url);
    toast(label + ' скопирована');
  } catch (e) {
    prompt(label + ':', url);
  }
}

// --- Portal (pub/portal) sync state & crypto ---
const PORTAL_ITER = 600000;
const PORTAL_WH = [9, 18];
const PORTAL_DUR_H = 1;
const keyCache = new Map();
let portalSalt = null;
let portalExists = false;
let portalLastUpd = '';
let portalStatus = '';
let portalTimer = null;
let portalRunning = false;
let portalDirty = false;
let portalChecked = false;

const toB64 = u8 => {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
};
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toHex = u8 => Array.from(u8, x => x.toString(16).padStart(2, '0')).join('');
const normPhone = p => String(p || '').replace(/\D/g, '').slice(-9);

function toast(m) {
  const old = $('#toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function note(m) {
  const n = $('#note');
  n.textContent = m;
  n.hidden = !m;
}

async function ensurePortalSalt() {
  if (portalSalt) return portalSalt;
  try {
    const snap = await getDoc(doc(db, 'pub', 'portal'));
    if (snap.exists()) {
      const d = snap.data();
      portalExists = true;
      portalLastUpd = d.upd || '';
      if (typeof d.salt === 'string' && fromB64(d.salt).length === 16) {
        portalSalt = d.salt;
        return portalSalt;
      }
    }
  } catch (e) {}
  portalSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  return portalSalt;
}

async function deriveForPhone(phone9, saltB64) {
  const ck = saltB64 + ':' + phone9;
  if (keyCache.has(ck)) return keyCache.get(ck);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(phone9), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({
    name: 'PBKDF2',
    salt: fromB64(saltB64),
    iterations: PORTAL_ITER,
    hash: 'SHA-256'
  }, km, 384));
  const id = toHex(bits.slice(0, 16));
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['encrypt']);
  const entry = { id, key };
  keyCache.set(ck, entry);
  return entry;
}

async function buildPortalPayload(clientsList, tasksList, saltB64) {
  const busyMap = new Map();
  const fullSet = new Set();
  for (const t of tasksList) {
    const d = t.date;
    if (t.done || !d) continue;
    const tm = (t.time || '').trim();
    if (!tm) {
      fullSet.add(d);
      continue;
    }
    const parts = tm.split(':');
    const h = Number(parts[0]), m = Number(parts[1] || 0);
    if (!Number.isFinite(h) || !Number.isFinite(m)) {
      fullSet.add(d);
      continue;
    }
    const s = h * 60 + m, e = s + PORTAL_DUR_H * 60;
    for (let H = PORTAL_WH[0]; H < PORTAL_WH[1]; H++) {
      if (H * 60 < e && (H + 1) * 60 > s) {
        if (!busyMap.has(d)) busyMap.set(d, new Set());
        busyMap.get(d).add(H);
      }
    }
  }
  const busy = {};
  for (const [d, hs] of busyMap.entries()) {
    busy[d] = [...hs].sort((a, b) => a - b);
  }
  const full = [...fullSet].sort();

  const groups = new Map();
  for (const c of clientsList) {
    const n = normPhone(c.phone);
    if (n.length < 7) continue;
    const ts = tasksList
      .filter(t => t.clientId === c.id && t.pub !== false)
      .map(t => ({
        t: t.title || '',
        w: t.work || '',
        e: t.equip || '',
        d: t.date || '',
        tm: t.time || '',
        x: Boolean(t.done),
        st: t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo'),
        n: t.pubNote || '',
        it: Array.isArray(t.items) ? t.items.map(x => ({
          n: x.name || '',
          q: Number(x.qty) || 1,
          p: Number(x.price) || 0,
          s: x.status || 'pending',
          dt: x.eta || ''
        })) : []
      }));
    const pctRaw = c.pubPct;
    const pct = (pctRaw !== undefined && pctRaw !== '' && pctRaw !== null && Number.isFinite(Number(pctRaw)))
      ? Math.max(0, Math.min(100, Math.round(Number(pctRaw))))
      : null;
    if (!groups.has(n)) groups.set(n, []);
    groups.get(n).push({
      name: c.name || '',
      phone: c.phone || '',
      addr: c.showAddress !== false ? (c.address || '') : '',
      proj: c.pubProject || '',
      msg: c.pubMsg || '',
      pct,
      cal: c.showCal !== false,
      tasks: ts
    });
  }

  const enc = new TextEncoder();
  const recs = [];
  for (const [n, cl] of groups.entries()) {
    const { id, key } = await deriveForPhone(n, saltB64);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const pt = enc.encode(JSON.stringify({ clients: cl }));
    const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt);
    recs.push({ id, iv: toB64(iv), ct: toB64(new Uint8Array(ctBuf)) });
  }

  const upd = new Date().toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  return { salt: saltB64, iter: PORTAL_ITER, wh: [...PORTAL_WH], busy, full, recs, upd };
}

function updatePortalStatusEl() {
  const el = $('#pstat');
  if (el) el.textContent = portalStatus || (portalLastUpd ? 'Обновлено: ' + portalLastUpd : 'Ещё не опубликовано');
}

function schedulePortal(delayMs = 3000) {
  if (!user) return;
  portalDirty = true;
  if (portalTimer) clearTimeout(portalTimer);
  portalTimer = setTimeout(() => {
    portalTimer = null;
    rebuildPortal(false);
  }, delayMs);
}

async function rebuildPortal(notify = false) {
  if (!user || ready < 2) return;
  if (!(window.crypto && crypto.subtle)) {
    portalStatus = 'WebCrypto недоступен';
    updatePortalStatusEl();
    return;
  }
  if (!navigator.onLine) {
    portalDirty = true;
    portalStatus = 'Ожидает подключения к сети';
    updatePortalStatusEl();
    return;
  }
  if (portalRunning) {
    portalDirty = true;
    return;
  }
  portalRunning = true;
  portalDirty = false;
  portalStatus = 'Обновляется…';
  updatePortalStatusEl();
  try {
    const saltB64 = await ensurePortalSalt();
    const payload = await buildPortalPayload(clients, tasks, saltB64);
    await setDoc(doc(db, 'pub', 'portal'), payload);
    portalExists = true;
    portalLastUpd = payload.upd;
    portalStatus = 'Обновлено: ' + payload.upd;
    updatePortalStatusEl();
    if (notify) toast('Страница клиента обновлена');
  } catch (e) {
    portalDirty = true;
    portalStatus = 'Ошибка обновления';
    updatePortalStatusEl();
    if (notify) toast('Не удалось обновить страницу клиента');
  } finally {
    portalRunning = false;
    if (portalDirty && navigator.onLine) schedulePortal(1500);
  }
}

async function checkInitialPortal() {
  if (portalChecked || !user || ready < 2) return;
  portalChecked = true;
  try {
    const snap = await getDoc(doc(db, 'pub', 'portal'));
    if (snap.exists()) {
      const d = snap.data();
      portalExists = true;
      portalLastUpd = d.upd || '';
      if (typeof d.salt === 'string' && fromB64(d.salt).length === 16) portalSalt = d.salt;
      portalStatus = portalLastUpd ? 'Обновлено: ' + portalLastUpd : 'Опубликовано';
      updatePortalStatusEl();
    } else if (clients.length || tasks.length) {
      schedulePortal(500);
    }
  } catch (e) {}
}

window.addEventListener('online', () => {
  if (user) {
    note('');
    if (portalDirty) schedulePortal(1000);

});
window.addEventListener('offline', () => {

});

function exportJson() {
  const payload = {
    exported: today(),
    note: 'Личные данные. НЕ загружать в публичный репозиторий.',
    clients,
    tasks,
    products
  };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planner-backup-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Файл резервной копии скачан');
}

async function importJsonFile(file) {
  if (!user || !file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    toast('Ошибка чтения JSON-файла');
    return;
  }
  const impClients = Array.isArray(data.clients) ? data.clients : [];
  const impTasks = Array.isArray(data.tasks) ? data.tasks : [];
  if (!impClients.length && !impTasks.length) {
    toast('В файле нет клиентов и задач');
    return;
  }
  const ops = [];
  for (const c of impClients) {
    const id = String(c.id || uid());
    const docData = {
      name: String(c.name || '').trim(),
      phone: String(c.phone || '').trim(),
      address: String(c.address || '').trim(),
      note: String(c.note || '').trim(),
      created: Number(c.created) || Date.now()
    };
    if (c.showAddress !== undefined) docData.showAddress = Boolean(c.showAddress);
    if (c.showCal !== undefined) docData.showCal = Boolean(c.showCal);
    if (c.pubProject) docData.pubProject = String(c.pubProject).trim();
    if (c.pubMsg) docData.pubMsg = String(c.pubMsg).trim();
    if (c.pubPct !== undefined && c.pubPct !== '' && c.pubPct !== null && Number.isFinite(Number(c.pubPct))) docData.pubPct = Number(c.pubPct);
    ops.push({ col: 'clients', id, doc: docData });
  }
  for (const t of impTasks) {
    const id = String(t.id || uid());
    const isDone = Boolean(t.done);
    const st = isDone ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo');
    const docData = {
      clientId: String(t.clientId || ''),
      title: String(t.title || '').trim(),
      work: String(t.work || ''),
      equip: String(t.equip || ''),
      date: String(t.date || ''),
      time: String(t.time || ''),
      details: String(t.details || '').trim(),
      high: Boolean(t.high),
      done: isDone,
      status: st,
      pub: t.pub !== false,
      pubNote: String(t.pubNote || '').trim(),
      items: Array.isArray(t.items) ? t.items.map(x => ({
        name: String(x.name || '').trim(),
        qty: Math.max(1, Number(x.qty) || 1),
        price: Number(x.price) || 0,
        status: ITEM_ST[x.status] ? x.status : 'pending',
        eta: String(x.eta || '')
      })).filter(x => x.name) : [],
      created: Number(t.created) || Date.now()
    };
    ops.push({ col: 'tasks', id, doc: docData });
  }
  const impProds = Array.isArray(data.products) ? data.products : [];
  for (const p of impProds) {
    const id = String(p.id || uid());
    ops.push({
      col: 'products',
      id,
      doc: {
        name: String(p.name || '').trim(),
        cat: SHOP_CATS[p.cat] ? p.cat : 'other',
        sku: String(p.sku || '').trim(),
        price: Number(p.price) || 0,
        unit: String(p.unit || 'шт.').trim(),
        desc: String(p.desc || '').trim(),
        img: String(p.img || '').trim(),
        inStock: p.inStock !== false,
        active: p.active !== false,
        created: Number(p.created) || Date.now()
      }
    });
  }
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const batch = writeBatch(db);
      for (const op of ops.slice(i, i + 400)) {
        batch.set(doc(db, op.col, op.id), op.doc);
      }
      await batch.commit();
    }
    toast(`Импортировано: ${impClients.length} кл., ${impTasks.length} зад.`);
    schedulePortal(500);
  } catch (e) {
    toast('Ошибка импорта: проверьте доступ к базе');
  }
}

// --- Rendering ---
function dayLabel(d) {
  if (!d) return 'Без даты';
  const t = today();
  if (d < t) return 'Просрочено';
  if (d === t) return 'Сегодня';
  if (d === addDays(t, 1)) return 'Завтра';
  return new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
}
const shortDate = d => new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const cname = id => { const c = clients.find(x => x.id === id); return c ? c.name : '—'; };
const tel = p => String(p || '').replace(/[^\d+]/g, '');

function authHtml() {
  return `<section class="auth">
    <h3>Вход в планировщик</h3>
    <div class="meta">Введите почту и пароль учётной записи Firebase.</div>
    <form id="loginForm">
      <label for="l-email">Почта</label>
      <input id="l-email" name="email" type="email" autocomplete="username" required>
      <label for="l-pass">Пароль</label>
      <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
      <div id="l-err" class="err"></div>
      <div class="row"><button class="btn p" id="l-btn" type="submit">Войти</button></div>
    </form>
  </section>`;
}

function wireLoginForm() {
  const form = $('#loginForm');
  if (!form) return;
  form.onsubmit = async e => {
    e.preventDefault();
    const email = form.email.value.trim();
    const pass = form.password.value;
    const btn = $('#l-btn');
    const err = $('#l-err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Входим…';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (ex) {
      const code = ex && ex.code || '';
      if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
        err.textContent = 'Неверная почта или пароль.';
      } else if (code === 'auth/invalid-email') {
        err.textContent = 'Проверьте формат почты.';
      } else if (code === 'auth/too-many-requests') {
        err.textContent = 'Слишком много попыток. Подождите немного.';
      } else if (code === 'auth/network-request-failed') {
        err.textContent = 'Нет подключения к интернету.';
      } else if (code === 'auth/unauthorized-domain') {
        err.textContent = 'Домен не добавлен в Authorized domains в Firebase.';
      } else {
        err.textContent = 'Не удалось войти (' + (code || 'ошибка') + ').';
      }
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  };
}

function tasksHtml() {
  const t0 = today();
  const pass = {
    today: t => !t.done && t.date && t.date <= t0,
    later: t => !t.done && (!t.date || t.date > t0),
    all: t => !t.done,
    done: t => t.done
  };
  const cnt = k => tasks.filter(t => (!clientFilter || t.clientId === clientFilter) && pass[k](t)).length;
  let h = '<div class="chips">' + [['today', 'Сегодня'], ['later', 'Позже'], ['all', 'Все'], ['done', 'Готово']].map(([k, l]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${l}<b>${cnt(k)}</b></button>`).join('') + '</div>';
  if (clientFilter) h += `<div class="bar"><span>Клиент: <b>${esc(cname(clientFilter))}</b></span><button class="btn" data-act="clearc">Сбросить</button></div>`;
  const list = tasks.filter(t => (!clientFilter || t.clientId === clientFilter) && pass[filter](t))
    .sort((a, b) => ((a.date || '9999') + (a.time || '99:99')).localeCompare((b.date || '9999') + (b.time || '99:99')));
  if (!list.length) return h + `<div class="empty">${tasks.length || clients.length ? 'Здесь пока пусто.' : 'Начните с вкладки «Клиенты» или импортируйте данные в меню (⋯).'}</div>`;
  const gs = [];
  for (const t of list) {
    const lb = filter === 'done' ? 'Выполнено' : dayLabel(t.date), g = gs[gs.length - 1];
    if (g && g.lb === lb) g.items.push(t); else gs.push({ lb, items: [t] });
  }
  for (const g of gs) h += `<h2 class="${g.lb === 'Просрочено' ? 'late' : ''}">${esc(g.lb[0].toUpperCase() + g.lb.slice(1))}<span>${g.items.length}</span></h2>` + g.items.map(t => cardHtml(t)).join('');
  return h;
}

function cardHtml(t) {

  const itemSummary = items.length ? `Товары: ${items.length} (получено ${items.filter(x => x.status === 'received').length})` : '';

  if (o) {
    const links = [];
    if (c && c.phone) links.push(`<a href="tel:${esc(tel(c.phone))}">${esc(c.phone)}</a>`);
    if (c && c.address) links.push(`<a href="https://maps.apple.com/?q=${encodeURIComponent(c.address)}" target="_blank" rel="noopener">${esc(c.address)}</a>`);

    <div class="row">${!t.done ? `<button class="btn${inProg ? '' : ' p'}" data-act="inprog" data-id="${t.id}">${inProg ? 'Снять «В работе»' : 'В работу'}</button>` : ''}<button class="btn" data-act="edittask" data-id="${t.id}">Изменить</button><button class="btn d" data-act="deltask" data-id="${t.id}">Удалить</button></div></div>`;

}

    <button class="chip ${shopTab === 'catalog' ? 'on' : ''}" data-act="shoptab" data-st="catalog">Каталог<b>${products.length}</b></button>
  </div>`;

  if (shopTab === 'orders') {
    if (ordErr) return h + '<div class="empty">Нет доступа к заказам. Обновите правила Firestore (разделы <code>products</code> и <code>orders</code>) и обновите страницу.</div>';
    if (!orders.length) return h + '<div class="empty">Заказов из магазина пока нет. Отправьте клиенту ссылку на магазин.</div>';
    const list = [...orders].sort((a, b) => (Number(b.created) || 0) - (Number(a.created) || 0));
    return h + list.map(o => {
      const dt = o.created ? new Date(o.created).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
      const linked = o.status === 'linked';
      const badge = linked ? '<span class="tag ok">В задаче</span>' : '<span class="tag">Новый</span>';
      const langTag = o.lang ? `<span class="tag info">${esc(String(o.lang).toUpperCase())}</span>` : '';
      const its = Array.isArray(o.items) ? o.items : [];
      const tot = Number(o.total) > 0 ? fmtAzn(o.total) : '';
      return `<div class="cl"><div class="main">
        <div class="ttl">${esc(o.name || 'Без имени')}${badge}${langTag}</div>
        ${dt ? `<div class="meta">${esc(dt)}${tot ? ' · Итого: ' + esc(tot) : ''}</div>` : ''}
        ${o.phone ? `<div class="links meta"><a href="tel:${esc(tel(o.phone))}">${esc(o.phone)}</a></div>` : ''}
        <div class="it-list">${its.map(x => `<div class="it-row"><div><b>${esc(x.name)}</b> × ${Number(x.qty) || 1}</div><div>${x.price > 0 ? esc(fmtAzn(x.price * (x.qty || 1))) : ''}</div></div>`).join('')}</div>
        ${o.comment ? `<div class="meta" style="white-space:pre-wrap;margin-top:4px">Комментарий: ${esc(o.comment)}</div>` : ''}
        <div class="row">
          <button class="btn p" data-act="linkord" data-id="${o.id}">${linked ? 'Добавить ещё раз' : 'Привязать к задаче'}</button>
          <button class="btn d" data-act="delord" data-id="${o.id}">Удалить</button>
        </div>
      </div></div>`;
    }).join('');
  }

  if (prodErr) return h + '<div class="empty">Нет доступа к каталогу. Обновите правила Firestore (раздел <code>products</code>) и обновите страницу.</div>';
  if (!products.length) {
    return h + `<div class="empty">В каталоге пока нет товаров.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn p" data-act="newprod">Добавить товар</button><button class="btn" data-act="seedprod">Добавить 6 примеров</button></div></div>`;
  }
  const list = [...products].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
  return h + list.map(p => {
    const catLbl = SHOP_CATS[p.cat] || 'Другое';
    const pr = fmtAzn(p.price) || 'По запросу';
    const tags = (p.inStock !== false ? '<span class="tag ok">В наличии</span>' : '<span class="tag warn">Под заказ</span>')
      + (p.active === false ? '<span class="tag info">Скрыт</span>' : '');
    return `<div class="cl"><div class="main">
      <div class="ttl">${esc(p.name)}${tags}</div>
      <div class="meta">${esc([catLbl, p.sku, pr + (p.price > 0 && p.unit ? ' / ' + p.unit : '')].filter(Boolean).join(' · '))}</div>
      ${p.desc ? `<div class="meta">${esc(p.desc)}</div>` : ''}
      <div class="row">
        <button class="btn" data-act="editprod" data-id="${p.id}">Изменить</button>
        <button class="btn d" data-act="delprod" data-id="${p.id}">Удалить</button>
      </div>
    </div></div>`;
  }).join('');
}

// --- Modals ---
function modal(title, body, onSave, delOpts) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  const delBtn = delOpts ? `<button class="btn d" type="button" data-del style="margin-left:auto">Удалить</button>` : '';
  ov.innerHTML = `<form><h3>${title}</h3>${body}<div class="row"><button class="btn p" type="submit">Сохранить</button><button class="btn" type="button" data-x>Отмена</button>${delBtn}</div></form>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-x]').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  if (delOpts) {
    let sure = false;
    const dbBtn = ov.querySelector('[data-del]');
    dbBtn.onclick = async () => {
      if (!sure) { sure = true; dbBtn.textContent = delOpts.confirm || 'Точно удалить?'; return; }
      ov.remove();
      await delOpts.run();
    };
  }
  ov.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    e.target.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.name) f[cb.name] = cb.checked; });
    ov.remove();
    await onSave(f);
  };
  const first = ov.querySelector('input[type=text]');
  if (first) first.focus();
  return ov;
}

const EQUIPS = ['IP-камера', 'Видеорегистратор (NVR/DVR)', 'Wi-Fi точка доступа', 'Коммутатор', 'Маршрутизатор', 'Домофон / СКУД', 'Сигнализация', 'Сервер / NAS', 'Принтер / МФУ', 'Компьютер', 'Кабельная сеть'];
const val = (f, n) => f[n] === '__other' ? (f[n + 'Other'] || '').trim() : (f[n] || '');

function pick(name, label, list, v) {
  const other = !!v && !list.includes(v);
  return `<label>${label}</label><select name="${name}"><option value="">Не выбрано</option>${list.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}<option value="__other"${other ? ' selected' : ''}>Другое…</option></select><input type="text" name="${name}Other" placeholder="Укажите вручную" value="${other ? esc(v) : ''}"${other ? '' : ' hidden'}>`;
}

function openTask(id, clientId, prefill) {
  if (!clients.length) { toast('Сначала добавьте клиента'); view = 'clients'; render(); return openClient(); }
  const t = tasks.find(x => x.id === id) || Object.assign({ clientId: clientId || clientFilter || clients[0].id, title: '', date: today(), time: '', details: '', high: false, done: false, status: 'todo', pub: true, pubNote: '', items: [] }, prefill || {});
  const curSt = t.done ? 'done' : (t.status === 'in_progress' ? 'in_progress' : 'todo');
  const opts = [...clients].sort((a, b) => a.name.localeCompare(b.name, 'ru')).map(c => `<option value="${c.id}" ${c.id === t.clientId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const prodOpts = [...products].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru')).map(p => `<option value="${p.id}">${esc(p.name)}${p.price > 0 ? ' (' + fmtAzn(p.price) + ')' : ''}</option>`).join('');
  let draftItems = (Array.isArray(t.items) ? t.items : []).map(x => ({
    name: x.name || '',
    qty: Number(x.qty) || 1,
    price: Number(x.price) || 0,
    status: ITEM_ST[x.status] ? x.status : 'pending',
    eta: x.eta || ''
  }));

  const ov = modal(id ? 'Задача' : 'Новая задача', `<label>Клиент</label><select name="clientId">${opts}</select>
  <label>Что нужно сделать</label><input type="text" name="title" required value="${esc(t.title)}">
  <label>Статус выполнения</label><select name="status">
    <option value="todo"${curSt === 'todo' ? ' selected' : ''}>Запланировано</option>
    <option value="in_progress"${curSt === 'in_progress' ? ' selected' : ''}>В работе (выделяется у клиента)</option>
    <option value="done"${curSt === 'done' ? ' selected' : ''}>Выполнено</option>
  </select>
  ${pick('work', 'Вид работ', WORKS, t.work || '')}${pick('equip', 'Тип оборудования', EQUIPS, t.equip || '')}
  <label>Дата</label><input type="hidden" name="date" value="${esc(t.date)}"><div id="seld" class="meta"></div>
  <div class="qk"><button type="button" class="btn" data-d="today">Сегодня</button><button type="button" class="btn" data-d="tom">Завтра</button><button type="button" class="btn" data-d="">Без даты</button></div><div id="cal"></div>
  <label>Время</label><input type="time" name="time" value="${esc(t.time)}">
  <div class="qk">${['08:00', '09:00', '10:00', '11:00', '12:00', '14:00', '16:00', '18:00'].map(x => `<button type="button" class="btn" data-t="${x}">${x}</button>`).join('')}<button type="button" class="btn" data-t="">Без времени</button></div>
  <label>Детали мастера (личные, клиенту не видны)</label><textarea name="details">${esc(t.details)}</textarea>
  <div class="sec">
    <div class="sec-t">Товары и закупка (видны клиенту в кабинете)</div>
    <div id="itWrap"></div>
    <div class="it-add">
      ${prodOpts ? `<select id="itCatSel"><option value="">Выбрать из каталога…</option>${prodOpts}</select><button type="button" class="btn" id="itAddCat">+ Из каталога</button>` : ''}
      <button type="button" class="btn" id="itAddCust">+ Свой товар</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-t">Отображение в кабинете клиента</div>
    <label class="inl" style="margin-top:4px"><input type="checkbox" name="pub" ${t.pub !== false ? 'checked' : ''}> Показывать эту задачу клиенту</label>
    <label>Комментарий для клиента (виден в кабинете)</label><textarea name="pubNote" placeholder="Например, Кабели проложены, настраиваем регистратор" style="min-height:64px">${esc(t.pubNote || '')}</textarea>
  </div>
  <label class="inl"><input type="checkbox" name="high" ${t.high ? 'checked' : ''}> Срочно</label>`,
  f => {
    const st = f.status === 'done' ? 'done' : (f.status === 'in_progress' ? 'in_progress' : 'todo');
    const cleanItems = draftItems
      .map(x => ({ name: String(x.name || '').trim(), qty: Math.max(1, Number(x.qty) || 1), price: Number(x.price) || 0, status: ITEM_ST[x.status] ? x.status : 'pending', eta: String(x.eta || '') }))
      .filter(x => x.name);
    return save('tasks', id || uid(), {
      clientId: f.clientId,
      title: f.title.trim(),
      work: val(f, 'work'),
      equip: val(f, 'equip'),
      date: f.date,
      time: f.time,
      details: f.details.trim(),
      high: !!f.high,
      done: st === 'done',
      status: st,
      pub: !!f.pub,
      pubNote: (f.pubNote || '').trim(),
      items: cleanItems,
      created: t.created || Date.now()
    });
  }, id ? { confirm: 'Точно удалить?', run: () => del('tasks', id) } : null);

  function drawItems() {
    const wrap = ov.querySelector('#itWrap');
    if (!draftItems.length) {
      wrap.innerHTML = '<div class="meta">Товары к задаче не добавлены.</div>';
      return;
    }
    wrap.innerHTML = draftItems.map((it, idx) => `<div class="it-box" data-idx="${idx}">
      <div class="it-top">
        <input type="text" data-if="name" placeholder="Название товара / модели" value="${esc(it.name)}">
        <button type="button" class="btn d" data-irem="${idx}" aria-label="Удалить товар">×</button>
      </div>
      <div class="it-g">
        <input type="number" data-if="qty" min="1" step="1" title="Кол-во" placeholder="Шт" value="${esc(it.qty)}">
        <input type="number" data-if="price" min="0" step="0.5" title="Цена, ₼" placeholder="Цена ₼" value="${it.price > 0 ? esc(it.price) : ''}">
        <select data-if="status">${Object.entries(ITEM_ST).map(([k, l]) => `<option value="${k}"${it.status === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
      </div>
      <div class="it-g2">
        <div class="meta" style="align-self:center">Дата получения:</div>
        <input type="date" data-if="eta" value="${esc(it.eta || '')}">
      </div>
    </div>`).join('');
    wrap.querySelectorAll('.it-box').forEach(box => {
      const idx = Number(box.dataset.idx);
      box.querySelectorAll('[data-if]').forEach(inp => {
        inp.oninput = inp.onchange = () => {
          const fld = inp.dataset.if;
          draftItems[idx][fld] = (fld === 'qty' || fld === 'price') ? Number(inp.value) : inp.value;
        };
      });
    });
    wrap.querySelectorAll('[data-irem]').forEach(b => b.onclick = () => {
      draftItems.splice(Number(b.dataset.irem), 1);
      drawItems();
    });
  }
  drawItems();
  const addCatBtn = ov.querySelector('#itAddCat');
  if (addCatBtn) {
    addCatBtn.onclick = () => {
      const pid = ov.querySelector('#itCatSel').value;
      const p = products.find(x => x.id === pid);
      if (!p) return;
      draftItems.push({ name: p.name, qty: 1, price: Number(p.price) || 0, status: 'pending', eta: '' });
      ov.querySelector('#itCatSel').value = '';
      drawItems();
    };
  }
  ov.querySelector('#itAddCust').onclick = () => {
    draftItems.push({ name: '', qty: 1, price: 0, status: 'pending', eta: '' });
    drawItems();
    const last = ov.querySelector('#itWrap .it-box:last-child input[data-if="name"]');
    if (last) last.focus();
  };

  initCal(ov);
  ['work', 'equip'].forEach(n => {
    const s = ov.querySelector('[name=' + n + ']'), o = ov.querySelector('[name=' + n + 'Other]');
    s.onchange = () => { o.hidden = s.value !== '__other'; if (!o.hidden) o.focus(); };
  });
}

    <label>Название товара</label><input type="text" name="name" required value="${esc(p.name)}">
    <label>Категория</label><select name="cat">${catOpts}</select>
    <label>Модель / бренд (необязательно)</label><input type="text" name="sku" placeholder="Например, Hikvision DS-2CD2043G2-I" value="${esc(p.sku || '')}">
    <div class="two">
      <div><label>Цена, ₼ (пусто = по запросу)</label><input type="number" name="price" min="0" step="0.5" value="${p.price > 0 ? esc(p.price) : ''}"></div>
      <div><label>Единица</label><input type="text" name="unit" value="${esc(p.unit || 'шт.')}"></div>
    </div>
    <label>Краткое описание</label><textarea name="desc" style="min-height:64px">${esc(p.desc || '')}</textarea>
    <label>Ссылка на фото (необязательно)</label><input type="text" name="img" placeholder="https://..." value="${esc(p.img || '')}">
    <label class="inl"><input type="checkbox" name="inStock" ${p.inStock !== false ? 'checked' : ''}> В наличии</label>
    <label class="inl"><input type="checkbox" name="active" ${p.active !== false ? 'checked' : ''}> Показывать в магазине</label>`,
  async f => {
    try {
      await setDoc(doc(db, 'products', id || uid()), {
        name: f.name.trim(),
        cat: SHOP_CATS[f.cat] ? f.cat : 'other',
        sku: (f.sku || '').trim(),
        price: Number(f.price) > 0 ? Number(f.price) : 0,
        unit: (f.unit || 'шт.').trim() || 'шт.',
        desc: (f.desc || '').trim(),
        img: (f.img || '').trim(),
        inStock: !!f.inStock,
        active: !!f.active,
        created: p.created || Date.now()
      });
      scheduleCatalog(800);
      toast('Товар сохранён');
    } catch (e) {
      toast('Не удалось сохранить товар');
    }
  }, id ? {
    confirm: 'Точно удалить?',
    run: async () => {
      try { await deleteDoc(doc(db, 'products', id)); scheduleCatalog(800); toast('Товар удалён'); }
      catch (e) { toast('Не удалось удалить товар'); }
    }
  } : null);
}

function openLinkOrder(ordId) {
  const o = orders.find(x => x.id === ordId);
  if (!o) return;
  const p9 = normPhone(o.phone);
  const matchedClient = p9.length >= 7 ? clients.find(c => normPhone(c.phone) === p9) : null;
  const openTasks = [...tasks].filter(t => !t.done).sort((a, b) => {
    const am = matchedClient && a.clientId === matchedClient.id ? 0 : 1;
    const bm = matchedClient && b.clientId === matchedClient.id ? 0 : 1;
    return am - bm || (a.date || '9999').localeCompare(b.date || '9999');
  });
  const taskOpts = openTasks.map(t => `<option value="${t.id}">${esc(cname(t.clientId))} — ${esc(t.title)}</option>`).join('');
  modal('Привязать заказ к задаче', `
    <div class="meta">Клиент: <b>${esc(o.name)}</b> (${esc(o.phone)}) · позиций: ${(o.items || []).length}</div>
    <label>Куда добавить товары</label>
    <select name="targetTask">
      <option value="__new">+ Создать новую задачу${matchedClient ? ' для ' + esc(matchedClient.name) : ' и клиента'}</option>
      ${taskOpts}
    </select>
    <div class="two">
      <div><label>Статус закупки</label><select name="ist">${Object.entries(ITEM_ST).map(([k, l]) => `<option value="${k}"${k === 'ordered' ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div><label>Дата получения</label><input type="date" name="eta"></div>
    </div>`,
  async f => {
    const newItems = (o.items || []).map(x => ({
      name: String(x.name || '').trim(),
      qty: Math.max(1, Number(x.qty) || 1),
      price: Number(x.price) || 0,
      status: ITEM_ST[f.ist] ? f.ist : 'ordered',
      eta: f.eta || ''
    })).filter(x => x.name);

    if (f.targetTask === '__new') {
      let cid = matchedClient ? matchedClient.id : null;
      if (!cid) {
        cid = uid();
        await save('clients', cid, {
          name: String(o.name || '').trim(),
          phone: String(o.phone || '').trim(),
          address: '',
          note: o.comment ? 'Из заказа магазина: ' + o.comment : '',
          showAddress: true,
          showCal: true,
          created: Date.now()
        });
      }
      await save('tasks', uid(), {
        clientId: cid,
        title: 'Закупка оборудования (заказ)',
        work: 'Монтаж',
        equip: '',
        date: f.eta || today(),
        time: '',
        details: o.comment || '',
        high: false,
        done: false,
        status: 'todo',
        pub: true,
        pubNote: '',
        items: newItems,
        created: Date.now()
      });
      toast('Создана задача с товарами заказа');
    } else {
      const t = tasks.find(x => x.id === f.targetTask);
      if (t) {
        const merged = [...(Array.isArray(t.items) ? t.items : []), ...newItems];
        const updTask = Object.assign({}, t, { items: merged });
        delete updTask.id;
        await save('tasks', t.id, updTask);
        toast('Товары добавлены в задачу');
      }
    }
    const updOrd = Object.assign({}, o, { status: 'linked' });
    delete updOrd.id;
    try { await setDoc(doc(db, 'orders', ordId), updOrd); } catch (e) {}
  });
}

function initCal(ov) {
  const inp = ov.querySelector('[name=date]'), tin = ov.querySelector('[name=time]'), box = ov.querySelector('#cal'), lab = ov.querySelector('#seld');
  const busy = new Set(tasks.filter(t => !t.done && t.date).map(t => t.date));
  let ym = (inp.value || today()).slice(0, 7);
  function draw() {
    const [y, m] = ym.split('-').map(Number), off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate(), t0 = today();
    lab.textContent = inp.value ? 'Выбрано: ' + new Date(inp.value + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Без даты';
    let h = '<div class="calh"><button type="button" class="btn" data-m="-1">‹</button><b>' + new Date(y, m - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }) + '</b><button type="button" class="btn" data-m="1">›</button></div><div class="calg">' + ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => '<span class="wd">' + d + '</span>').join('');
    for (let i = 0; i < off; i++) h += '<span></span>';
    for (let d = 1; d <= n; d++) {
      const s = y + '-' + pad(m) + '-' + pad(d);
      h += '<button type="button" class="day' + (s === inp.value ? ' sel' : '') + (s === t0 ? ' tod' : '') + '" data-d="' + s + '">' + d + (busy.has(s) ? '<i></i>' : '') + '</button>';
    }
    box.innerHTML = h + '</div>';
  }
  ov.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.m) { const [y, m] = ym.split('-').map(Number); ym = iso(new Date(y, m - 1 + Number(b.dataset.m), 1)).slice(0, 7); }
    else if (b.dataset.t !== undefined) { tin.value = b.dataset.t; return; }
    else if (b.dataset.d !== undefined) { const k = b.dataset.d; inp.value = k === 'today' ? today() : k === 'tom' ? addDays(today(), 1) : k; if (inp.value) ym = inp.value.slice(0, 7); }
    else return;
    draw();
  });
  draw();
}

function wireContacts(ov) {
  const ph = ov.querySelector('[name=phone]'), nm = ov.querySelector('[name=name]'), pk = ov.querySelector('[data-pick]');
  const can = 'contacts' in navigator && navigator.contacts && navigator.contacts.select;
  if (can) ov.querySelector('#chint').hidden = true; else pk.hidden = true;
  pk.onclick = async () => {
    try {
      const r = await navigator.contacts.select(['name', 'tel'], { multiple: false }), c = r && r[0];
      if (c) { if (c.tel && c.tel[0]) ph.value = c.tel[0]; if (c.name && c.name[0] && !nm.value) nm.value = c.name[0]; }
    } catch (e) { toast('Не удалось открыть контакты'); }
  };
  ov.querySelector('[data-paste]').onclick = async () => {
    let s = '';
    try { s = await navigator.clipboard.readText(); }
    catch (e) { toast('Нет доступа к буферу: нажмите на поле и выберите «Вставить»'); return; }
    if (/BEGIN:VCARD/i.test(s)) {
      const fn = (s.match(/^FN[^:]*:(.+)$/mi) || [])[1], tl = (s.match(/^(?:item\d+\.)?TEL[^:]*:(.+)$/mi) || [])[1];
      if (tl) ph.value = tl.trim(); if (fn && !nm.value) nm.value = fn.trim(); return;
    }
    const m = s.match(/\+?\d[\d\s().-]{6,}\d/);
    if (m) ph.value = m[0].trim(); else toast('В буфере нет номера');
  };
}

async function deleteClientWithTasks(cid) {
  if (!user || !cid) return;
  const cTasks = tasks.filter(t => t.clientId === cid);
  if (clientFilter === cid) clientFilter = '';
  portalDirty = true;
  schedulePortal(3000);
  try {
    const refs = [doc(db, 'clients', cid), ...cTasks.map(t => doc(db, 'tasks', t.id))];
    for (let i = 0; i < refs.length; i += 400) {
      const batch = writeBatch(db);
      for (const r of refs.slice(i, i + 400)) batch.delete(r);
      await batch.commit();
    }
    toast(cTasks.length ? `Клиент и ${cTasks.length} зад. удалены` : 'Клиент удалён');
  } catch (e) {
    toast('Не удалось удалить клиента');
  }
}

async function acceptRequest(reqId) {
  const r = requests.find(x => x.id === reqId);
  if (!r || !user) return;
  const p9 = normPhone(r.phone);
  const existing = p9.length >= 7 ? clients.find(c => normPhone(c.phone) === p9) : null;
  const noteBlock = reqNoteText(r);
  let cid;
  if (existing) {
    cid = existing.id;
    const mergedNote = [existing.note, noteBlock].filter(Boolean).join('\n---\n');
    const updatedClient = Object.assign({}, existing, {
      name: existing.name || r.name || '',
      phone: existing.phone || r.phone || '',
      address: existing.address || '',
      note: mergedNote,
      created: existing.created || Date.now()
    });
    delete updatedClient.id;
    await save('clients', cid, updatedClient);
    toast('Данные добавлены к существующему клиенту');
  } else {
    cid = uid();
    await save('clients', cid, {
      name: String(r.name || '').trim(),
      phone: String(r.phone || '').trim(),
      address: '',
      note: noteBlock,
      showAddress: true,
      showCal: true,
      created: Date.now()
    });
    toast('Клиент создан из заявки');
  }
  const upd = Object.assign({}, r, { status: 'accepted', clientId: cid });
  delete upd.id;
  try { await setDoc(doc(db, 'requests', reqId), upd); } catch (e) {}
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'tab') { view = el.dataset.v; render(); }
  else if (a === 'fab') {
    if (view === 'tasks') openTask();
    else if (view === 'clients') openClient();
    else if (view === 'requests') copyUrl('register.html', 'Ссылка на анкету');
    else if (shopTab === 'catalog') openProduct();
    else copyUrl('shop.html', 'Ссылка на магазин');
  }
  else if (a === 'shoptab') { shopTab = el.dataset.st; render(); }
  else if (a === 'newprod') { openProduct(); }
  else if (a === 'editprod') { openProduct(id); }
  else if (a === 'seedprod') { await seedSampleProducts(); }
  else if (a === 'linkord') { openLinkOrder(id); }
  else if (a === 'delprod') {
    if (armed !== 'p:' + id) { armed = 'p:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'products', id)); scheduleCatalog(800); toast('Товар удалён'); }
    catch (ex) { toast('Не удалось удалить товар'); }
  }
  else if (a === 'delord') {
    if (armed !== 'o:' + id) { armed = 'o:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'orders', id)); } catch (ex) { toast('Не удалось удалить заказ'); }
  }
  else if (a === 'menu') { openMenu(); }
  else if (a === 'filter') { filter = el.dataset.f; render(); }
  else if (a === 'clearc') { clientFilter = ''; render(); }
  else if (a === 'open') { opened.has(id) ? opened.delete(id) : opened.add(id); render(); }
  else if (a === 'toggle') {
    const t = tasks.find(x => x.id === id);
    if (t) {
      const nextDone = !t.done;
      const d = Object.assign({}, t, { done: nextDone, status: nextDone ? 'done' : 'todo' });
      delete d.id;
      save('tasks', id, d);
    }
  }
  else if (a === 'inprog') {
    const t = tasks.find(x => x.id === id);
    if (t && !t.done) {
      const nextSt = t.status === 'in_progress' ? 'todo' : 'in_progress';
      const d = Object.assign({}, t, { status: nextSt });
      delete d.id;
      save('tasks', id, d);
      toast(nextSt === 'in_progress' ? 'Задача переведена «В работу»' : 'Статус «В работе» снят');
    }
  }
  else if (a === 'edittask') openTask(id);
  else if (a === 'newtask') openTask(null, id);
  else if (a === 'editclient') openClient(id);
  else if (a === 'ctasks') { clientFilter = id; filter = 'all'; view = 'tasks'; render(); }
  else if (a === 'accreq') { await acceptRequest(id); }
  else if (a === 'reqtask') {
    const r = requests.find(x => x.id === id);
    if (r && r.clientId) openTask(null, r.clientId, { title: fmtReqList(r.categories, REQ_CAT, r.categoriesOther) || 'Заявка с сайта', details: reqNoteText(r) });
  }
  else if (a === 'deltask') {
    if (armed !== 't:' + id) { armed = 't:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null; await del('tasks', id);
  }
  else if (a === 'delclient') {
    if (armed !== 'c:' + id) {
      const cnt = tasks.filter(x => x.clientId === id).length;
      armed = 'c:' + id;
      el.textContent = cnt ? `Удалить (+${cnt} зад.)?` : 'Точно удалить?';
      return;
    }
    armed = null; await deleteClientWithTasks(id);
  }
  else if (a === 'delreq') {
    if (armed !== 'r:' + id) { armed = 'r:' + id; el.textContent = 'Точно удалить?'; return; }
    armed = null;
    try { await deleteDoc(doc(db, 'requests', id)); } catch (ex) { toast('Не удалось удалить'); }
  }
});

// --- Auth & Firestore subscriptions ---
render();
onAuthStateChanged(auth, u => {
  unsubs.forEach(fn => { try { fn(); } catch (e) {} });
  unsubs = [];
  if (portalTimer) { clearTimeout(portalTimer); portalTimer = null; }
  if (catTimer) { clearTimeout(catTimer); catTimer = null; }
  user = u;
  authReady = true;
  clients = [];
  tasks = [];
  requests = [];
  products = [];
  orders = [];
  reqErr = false;
  prodErr = false;
  ordErr = false;
  ready = 0;
  portalSalt = null;
  portalExists = false;
  portalLastUpd = '';
  portalStatus = '';
  portalDirty = false;
  portalChecked = false;
  note('');
  render();
  if (!user) return;

  if (!navigator.onLine) {
    note('Нет связи: показаны сохранённые данные, изменения синхронизируются при появлении сети.');
  }
  const timer = setTimeout(() => {
    if (ready < 2) note('Данные загружаются медленно — проверьте подключение или правила Firestore.');
  }, 10000);

  const sub = (col, set) => {
    let first = true;
    const unsub = onSnapshot(collection(db, col), s => {
      set(s.docs.map(d => Object.assign({ id: d.id }, d.data())));
      if (first) { first = false; ready++; }
      if (!s.metadata.fromCache) { clearTimeout(timer); if (navigator.onLine) note(''); }
      render();
      if (ready >= 2) checkInitialPortal();
    }, err => {
      clearTimeout(timer);
      note(err && err.code === 'permission-denied'
        ? 'Нет доступа к базе: проверьте User UID в правилах Firestore.'
        : 'Ошибка загрузки данных из Firestore.');
      ready = 2;
      render();
    });
    unsubs.push(unsub);
  };
  sub('clients', v => clients = v);
  sub('tasks', v => tasks = v);
  unsubs.push(onSnapshot(collection(db, 'requests'), s => {
    reqErr = false;
    requests = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    reqErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'products'), s => {
    prodErr = false;
    products = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    prodErr = true;
    render();
  }));
  unsubs.push(onSnapshot(collection(db, 'orders'), s => {
    ordErr = false;
    orders = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, () => {
    ordErr = true;
    render();
  }));
});
</script>
