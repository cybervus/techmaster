<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет исполнителя — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Исполнитель">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--warn:#fa8c16;--warn-bg:#fff5e6;--soft:#fdecec;--blue:#2563eb;--gbg:#e6f8f1;--gbd:#00b578;--rbg:#fdecec;--rbd:#e52520;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 48px;max-width:640px;margin-inline:auto;overflow-x:clip}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{margin:0;line-height:0;flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:26px;height:26px;display:block}
h1{font-size:18px;font-weight:700;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:16px;height:11px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 span{font-weight:600;font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input[type=tel],input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 8px rgba(229,37,32,.22)}
.btn.call{background:linear-gradient(135deg,#00b578,#059669);border-color:transparent;color:#fff;box-shadow:0 3px 8px rgba(0,181,120,.24)}
.btn svg{width:17px;height:17px;flex:none}
.contact-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.contact-bar .btn{padding:11px 10px;font-size:13.5px}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--muted);padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;margin-left:5px}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-k{color:var(--muted)}.info-v{font-weight:600;text-align:right}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#fff;color:var(--accent);font-size:12px;font-weight:700;margin-left:8px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:13px 12px;margin-bottom:10px;background:var(--bg)}
.tcard.act{background:var(--soft);border-color:var(--accent)}
.tcard.hi{border-left:4px solid var(--danger)}
.tcard.dn .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600;font-size:15px}
.tm{color:var(--muted);font-size:13px;margin-top:2px}
.tm a{color:var(--blue);text-decoration:none;font-weight:500}
.tdtls{margin-top:7px;font-size:13px;padding:8px 10px;background:var(--card);border-radius:10px;border:1px solid var(--line);white-space:pre-wrap}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;vertical-align:1px;background:var(--soft);color:var(--accent)}
.tag.hi{background:var(--soft);color:var(--danger)}
.tag.ok{background:var(--gbg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.chk-list{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px}
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:5px 4px;cursor:pointer;font-size:14px;user-select:none}
.chk-item input{width:19px;height:19px;margin-top:1px;accent-color:var(--ok);flex:none;cursor:pointer}
.chk-item.x span{text-decoration:line-through;color:var(--muted)}
.sub-its{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.sub-it{display:flex;justify-content:space-between;gap:8px}
.snote-row{display:flex;gap:6px;margin-top:8px}
.snote-row input{padding:8px 10px;font-size:14px;background:var(--card)}
.fin-bal{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fin-bal.owe-staff{background:var(--gbg);color:var(--ok)}
.fin-bal.owe-master{background:var(--rbg);color:var(--danger)}
.ptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ptbl th{text-align:left;font-weight:600;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.ptbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ptbl th.r,.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:10px}
.pnote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.free{background:var(--gbg);border-color:var(--gbd)}.busy{background:var(--rbg);border-color:var(--rbd)}.part{background:linear-gradient(135deg,var(--rbg) 50%,var(--gbg) 50%);border-color:var(--rbd)}
.ch{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;text-transform:capitalize;font-weight:700}
.ch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:5px 12px;font-size:16px;cursor:pointer}.ch button:disabled{opacity:.3;cursor:default}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.d{position:relative;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:0;cursor:pointer}
.d.past{opacity:.35}.d.sel{outline:2.5px solid var(--accent);outline-offset:1px;font-weight:700}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.h{text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid;font-size:14px;font-weight:600}
h3.dayh{font-size:14px;font-weight:700;margin:12px 0 6px;text-transform:capitalize}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:12px;font-size:13px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.chat-sheet{background:var(--card);width:100%;max-width:640px;height:86dvh;max-height:760px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.chat-hd h3{margin:0;font-size:16px;font-weight:700}
.chat-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat-day{align-self:center;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:6px 0 2px}
.mbub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mbub.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.mbub.them{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbub .mw{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.mbub .mt{font-size:11px;opacity:.75;margin-top:4px;text-align:right}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-bar textarea{flex:1;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:110px;resize:none}
.chat-bar .btn{padding:10px 16px;flex:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e242b;color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:40;max-width:calc(100vw - 24px);text-align:center}
/* Responsive: small phones */
@media (max-width:420px){
  body{padding:0 10px 44px;font-size:14.5px}
  header{margin:0 -10px 10px;padding:10px;gap:8px}
  .logo{width:36px;height:36px}
  h1{font-size:16px}
  .panel{padding:13px 12px}
  .ptbl{font-size:12px}
  .ptbl th,.ptbl td{padding:6px 4px}
  .fin-bal{flex-wrap:wrap;font-size:13.5px}
  .snote-row{flex-wrap:wrap}
  .d{height:36px;font-size:13px}
}
/* Responsive: hover feedback on desktop/mouse */
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(.96)}
  .btn.p:not(:disabled):hover{filter:brightness(1.05)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .d:not(.past):hover{border-color:var(--accent)}
}
/* Responsive: wider mobile / small tablet */
@media (min-width:600px){
  .hs{grid-template-columns:repeat(5,1fr)}
}
/* Responsive: tablets (768px - 1023px) */
@media (min-width:768px){
  body{max-width:980px;padding:12px 24px 56px}
  header{margin:0 0 16px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);top:12px}
  #tasksBox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  #tasksBox>.chips,#tasksBox>.muted{grid-column:1 / -1}
  #tasksBox>.tcard{margin-bottom:0}
  .chips{flex-wrap:wrap;overflow-x:visible;padding:2px 0 4px;margin-bottom:0}
  .ov{align-items:center;padding:24px}
  .chat-sheet{border-radius:18px;max-width:720px;height:82dvh;max-height:820px;padding-bottom:0;box-shadow:0 20px 56px rgba(0,0,0,.28)}
}
/* Responsive: laptops & desktops (1024px+) */
@media (min-width:1024px){
  body{max-width:1320px;padding:16px 32px 60px}
  .panel{padding:20px 22px}
  #view:not([hidden]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #view>#staffTop,#view>section.panel:nth-of-type(1),#view>.foot{grid-column:1 / -1}
  #view>.panel,#staffTop>.panel{margin-top:0}
}
/* Responsive: wide desktop monitors (1520px+) */
@media (min-width:1520px){
  body{max-width:1580px}
  #tasksBox{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
}
/* Responsive: Full HD+ / large monitors & TVs (1920px+) */
@media (min-width:1920px){
  body{max-width:1860px;font-size:16.5px;padding:20px 40px 64px}
  .logo{width:46px;height:46px}
  h1{font-size:21px}
  .panel h2{font-size:18px}
  .d{height:46px;font-size:15.5px}
  .chat-sheet{max-width:800px}
}
/* Responsive: 4K monitors & large TVs (2400px+) */
@media (min-width:2400px){
  body{max-width:2200px;font-size:18px}
  #tasksBox{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
}

/* ===== Cinematic Login Screen (Hik-Connect Glass & Animated Tech BG) ===== */
body.auth-mode{background:#0c0f16;color:#f3f5f9;min-height:100dvh;padding-bottom:28px}
body.auth-mode header{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none;padding-top:14px;padding-bottom:6px}
body.auth-mode header .btxt{display:none}
body.auth-mode .lang{background:rgba(20,24,35,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:rgba(255,255,255,.15)}
body.auth-mode .lang button{color:rgba(255,255,255,.72)}
body.auth-mode .lang button.on{background:var(--accent);color:#fff}

.login-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 15% 15%,rgba(229,37,32,.22),transparent 65%),radial-gradient(ellipse 75% 65% at 88% 82%,rgba(37,99,235,.18),transparent 65%),linear-gradient(155deg,#0b0e15 0%,#141520 48%,#0f0d14 100%);transition:opacity .45s ease}
.login-bg.fade-out{opacity:0}
.login-bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.42}
.bg-orb{position:absolute;border-radius:50%;filter:blur(54px);opacity:.26;will-change:transform}
.bg-orb.o1{width:340px;height:340px;background:#e52520;top:-90px;left:-80px;-webkit-animation:orbFloat1 15s ease-in-out infinite;animation:orbFloat1 15s ease-in-out infinite}
.bg-orb.o2{width:380px;height:380px;background:#2563eb;bottom:-110px;right:-90px;-webkit-animation:orbFloat2 18s ease-in-out infinite;animation:orbFloat2 18s ease-in-out infinite}
@-webkit-keyframes orbFloat1{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1)}50%{-webkit-transform:translate3d(55px,42px,0) scale(1.12)}}
@keyframes orbFloat1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(55px,42px,0) scale(1.12)}}
@-webkit-keyframes orbFloat2{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1)}50%{-webkit-transform:translate3d(-50px,-38px,0) scale(1.1)}}
@keyframes orbFloat2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-50px,-38px,0) scale(1.1)}}

body.auth-mode header,body.auth-mode main{position:relative;z-index:2}
.auth-stage{min-height:calc(100dvh - 104px);display:flex;align-items:center;justify-content:center;padding:12px 0}
.auth-card{position:relative;width:100%;max-width:460px;background:rgba(20,24,35,.74);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:28px 22px 24px;box-shadow:0 24px 64px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.14);color:#f3f5f9;overflow:hidden;-webkit-animation:authIn .45s cubic-bezier(.22,.9,.32,1) both;animation:authIn .45s cubic-bezier(.22,.9,.32,1) both}
.auth-card::before{content:'';position:absolute;left:18%;right:18%;top:0;height:2px;background:linear-gradient(90deg,transparent,#f03e38,transparent);opacity:.9}
.auth-card.exiting{-webkit-animation:authExit .42s cubic-bezier(.4,0,.2,1) forwards;animation:authExit .42s cubic-bezier(.4,0,.2,1) forwards}
@-webkit-keyframes authIn{from{opacity:0;-webkit-transform:translate3d(0,20px,0) scale(.97)}to{opacity:1;-webkit-transform:translate3d(0,0,0) scale(1)}}
@keyframes authIn{from{opacity:0;transform:translate3d(0,20px,0) scale(.97)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@-webkit-keyframes authExit{to{opacity:0;-webkit-transform:translate3d(0,-16px,0) scale(1.04)}}
@keyframes authExit{to{opacity:0;transform:translate3d(0,-16px,0) scale(1.04)}}

.auth-emblem{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#f03e38,#b81410);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(229,37,32,.42);position:relative}
.auth-emblem svg{width:34px;height:34px;display:block}
.auth-card h2{margin:0 0 22px;text-align:center;font-size:21px;font-weight:700;color:#ffffff;justify-content:center}
.auth-lbl{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.58);margin:0 0 8px}

/* +994 prefix + Operator dropdown */
.ph-top{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.ph-prefix{flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 13px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#ffffff;font-weight:700;font-size:15.5px;letter-spacing:.02em}
.ph-op-sel{flex:1;height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#ffffff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}
.ph-op-sel option{background:#181c26;color:#f3f5f9}
.ph-op-sel:focus,.ph-top input.ph-op-c:focus{border-color:#f03e38;box-shadow:0 0 0 3px rgba(240,62,56,.28)}
.ph-top input.ph-op-c{flex:none;width:68px;height:44px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font:inherit;font-size:16px;font-weight:700;text-align:center;outline:none}

/* 7 Glowing Mini Digit Boxes (3 - 2 - 2) */
.digits-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.digits-row.shake{-webkit-animation:loginShake .42s ease;animation:loginShake .42s ease}
@-webkit-keyframes loginShake{0%,100%{-webkit-transform:translateX(0)}20%,60%{-webkit-transform:translateX(-7px)}40%,80%{-webkit-transform:translateX(7px)}}
@keyframes loginShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.d-sep{width:6px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);flex:none}
.digits-row input.dbox{width:100%;min-width:0;flex:1;height:52px;padding:0;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#ffffff;font:inherit;font-size:21px;font-weight:700;text-align:center;caret-color:#f03e38;outline:none;transition:transform .16s cubic-bezier(.22,.9,.32,1),border-color .16s,box-shadow .16s,background .16s;-webkit-appearance:none;appearance:none}
.digits-row input.dbox:focus{border-color:#f03e38;background:rgba(240,62,56,.16);box-shadow:0 0 0 4px rgba(240,62,56,.28),0 6px 18px rgba(229,37,32,.25);-webkit-transform:translateY(-2px) scale(1.05);transform:translateY(-2px) scale(1.05);z-index:2}
.digits-row input.dbox.filled{border-color:rgba(240,62,56,.68);background:rgba(255,255,255,.13)}
.digits-row input.dbox.pop{-webkit-animation:dPop .2s ease;animation:dPop .2s ease}
@-webkit-keyframes dPop{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.1)}100%{-webkit-transform:scale(1)}}
@keyframes dPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.digits-row.ok input.dbox{border-color:#10c988;background:rgba(16,201,136,.18);box-shadow:0 0 14px rgba(16,201,136,.28)}
.auth-err{color:#ff6b6b;font-size:13px;font-weight:500;text-align:center;margin-top:12px;min-height:19px}

/* In-card Loading & Welcome Overlay */
.auth-ov{position:absolute;inset:0;z-index:5;background:rgba(15,19,28,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;-webkit-animation:authOvIn .22s ease both;animation:authOvIn .22s ease both}
@-webkit-keyframes authOvIn{from{opacity:0}to{opacity:1}}
@keyframes authOvIn{from{opacity:0}to{opacity:1}}
.auth-spin{width:68px;height:68px;display:flex;align-items:center;justify-content:center}
.auth-spin svg{width:68px;height:68px;display:block}
.auth-st-title{font-size:17px;font-weight:700;color:#ffffff}
.auth-st-sub{font-size:13.5px;color:rgba(255,255,255,.68);max-width:300px}

/* Dramatic Cabinet Reveal Transition */
#view.cab-enter{-webkit-animation:cabEnter .5s cubic-bezier(.22,.9,.32,1) both;animation:cabEnter .5s cubic-bezier(.22,.9,.32,1) both}
@-webkit-keyframes cabEnter{from{opacity:0;-webkit-transform:translate3d(0,22px,0) scale(.985)}to{opacity:1;-webkit-transform:translate3d(0,0,0) scale(1)}}
@keyframes cabEnter{from{opacity:0;transform:translate3d(0,22px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}

@media (max-width:420px){
  .auth-card{padding:22px 14px 18px;border-radius:18px}
  .auth-card h2{font-size:19px}
  .digits-row{gap:4px}
  .d-sep{width:4px}
  .digits-row input.dbox{height:46px;font-size:19px;border-radius:10px}
}
@media (min-width:1920px){
  .auth-card{max-width:540px;padding:36px 32px 28px}
  .digits-row input.dbox{height:58px;font-size:24px}
}

/*CRYPTO*/
const norm = p => String(p).replace(/\D/g, '').slice(-9);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
async function unlockStaff(phone) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode('staff:' + norm(phone)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, km, 384));
  const recId = hex(bits.slice(0, 16));
  const rec = (D.recs || []).find(r => r.id === recId);
  if (!rec) return null;
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.iv) }, key, b64(rec.ct));
  const parsed = JSON.parse(new TextDecoder().decode(pt));
  parsed._recId = recId;
  return parsed;
}
/*END*/

// Merge base task from pub/staff with any newer local employee update
function effectiveTask(t) {
  const u = localUpdates && localUpdates[t.id];
  const baseTs = Number(t.ut) || 0;
  const useUpd = u && Number(u.ts) > baseTs;
  const st = useUpd && u.st ? u.st : (t.x || t.st === 'done' ? 'done' : (t.st === 'in_progress' ? 'in_progress' : 'todo'));
  const chk = (Array.isArray(t.chk) ? t.chk : []).map(c => ({
    id: c.id,
    t: c.t,
    x: useUpd && u.chk && typeof u.chk[c.id] === 'boolean' ? u.chk[c.id] : Boolean(c.x)
  }));
  const note = useUpd && typeof u.note === 'string' ? u.note : (t.sn || '');
  return Object.assign({}, t, { st, x: st === 'done', chk, sn: note });
}

async function pushTaskUpdate(taskId, patch) {
  if (!staffRecId || !unlocked) return;
  const base = (unlocked.tasks || []).find(x => x.id === taskId);
  if (!base) return;
  const cur = effectiveTask(base);
  const nextChk = {};
  cur.chk.forEach(c => { nextChk[c.id] = c.x; });
  if (patch.chk) Object.assign(nextChk, patch.chk);
  const now = Date.now();
  const nextRec = {
    st: patch.st !== undefined ? patch.st : cur.st,
    chk: nextChk,
    note: patch.note !== undefined ? patch.note : cur.sn,
    ts: now
  };
  const merged = Object.assign({}, localUpdates, { [taskId]: nextRec });
  localUpdates = merged;
  renderAll();
  try {
    await setDoc(doc(db, 'staff_updates', staffRecId), {
      staffId: unlocked.staff.id || '',
      staffName: unlocked.staff.name || '',
      updates: merged,
      lastTs: now
    });
    toast(I18N[lang].saved);
  } catch (e) {
    toast(I18N[lang].saveErr);
  }
}

function computeMySchedule(effTasks) {
  const busyMap = new Map(), fullSet = new Set();
  for (const t of effTasks) {
    if (t.x || !t.d) continue;
    const tm = (t.tm || '').trim();
    if (!tm) { fullSet.add(t.d); continue; }
    const parts = tm.split(':'), h = Number(parts[0]), m = Number(parts[1] || 0);
    if (!Number.isFinite(h)) { fullSet.add(t.d); continue; }
    const s = h * 60 + m, e = s + 60;
    for (let H = wh[0]; H < wh[1]; H++) {
      if (H * 60 < e && (H + 1) * 60 > s) {
        if (!busyMap.has(t.d)) busyMap.set(t.d, new Set());
        busyMap.get(t.d).add(H);
      }
    }
  }
  const busy = {};
  for (const [d, hs] of busyMap.entries()) busy[d] = [...hs].sort((a, b) => a - b);
  return { busy, full: [...fullSet] };
}

let mySched = { busy: {}, full: [] };
const hoursOf = d => mySched.full.includes(d) ? 'all' : (mySched.busy[d] || []);
function dayState(d) {
  if (d < T0) return 'past';
  const b = hoursOf(d), n = b === 'all' ? N : b.length;
  return n === 0 ? 'free' : n >= N ? 'busy' : 'part';
}

function drawCal() {
  const L = I18N[lang];
  const [y, m] = ym.split('-').map(Number), b = T0.split('-').map(Number), k = (y * 12 + m) - (b[0] * 12 + b[1]);
  const off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let h = `<div class="ch"><button id="pm" ${k <= 0 ? 'disabled' : ''}>‹</button><span>${new Date(y, m - 1, 1).toLocaleDateString(L.locale, { month: 'long', year: 'numeric' })}</span><button id="nm" ${k >= 3 ? 'disabled' : ''}>›</button></div><div class="g">` + L.wds.map(x => `<span class="wd">${x}</span>`).join('');
  for (let i = 0; i < off; i++) h += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const s = y + '-' + pad(m) + '-' + pad(d), st = dayState(s);
    h += `<button type="button" class="d ${st === 'past' ? 'past' : st}${s === sel ? ' sel' : ''}" data-d="${s}">${d}</button>`;
  }
  $('#cal').innerHTML = h + '</div>';
  $('#pm').onclick = () => { ym = iso(new Date(y, m - 2, 1)).slice(0, 7); drawCal(); };
  $('#nm').onclick = () => { ym = iso(new Date(y, m, 1)).slice(0, 7); drawCal(); };
  $('#cal').querySelectorAll('.d').forEach(e => e.onclick = () => { sel = e.dataset.d; drawCal(); drawHours(); });
}

function drawHours() {
  const L = I18N[lang];
  let h = `<h3 class="dayh">${esc(fmtD(sel))}</h3>`;
  if (sel < T0) h += `<p class="muted">${esc(L.dayPast)}</p>`;
  else {
    const b = hoursOf(sel);
    h += '<div class="hs">';
    for (let x = wh[0]; x < wh[1]; x++) h += `<div class="h ${b === 'all' || b.includes(x) ? 'busy' : 'free'}">${pad(x)}:00</div>`;
    h += '</div>';
  }
  $('#hrs').innerHTML = h;
}

  }
  let html = '', lastDay = '';
  for (const m of msgs) {
    const dStr = m.ts ? new Date(m.ts).toLocaleDateString(L.locale, { day: 'numeric', month: 'long' }) : '';
    const tStr = m.ts ? new Date(m.ts).toLocaleTimeString(L.locale, { hour: '2-digit', minute: '2-digit' }) : '';
    if (dStr && dStr !== lastDay) { lastDay = dStr; html += `<div class="chat-day">${esc(dStr)}</div>`; }
    const isMe = m.from === 'client';
    html += `<div class="mbub ${isMe ? 'me' : 'them'}">${!isMe ? `<div class="mw">${esc(L.chatMaster)}</div>` : ''}${esc(m.text)}<div class="mt">${esc(tStr)}</div></div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}
function openChat() {
  if (!staffRecId || !unlocked) return;
  const L = I18N[lang];
  chatOpen = true;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="chat-sheet">
    <div class="chat-hd"><h3>${esc(L.chatTitle)}</h3><button type="button" class="btn" id="chatClose" aria-label="Закрыть">×</button></div>
    <div class="chat-log" id="chatLog"></div>
    <form class="chat-bar" id="chatForm">
      <textarea id="chatInp" rows="1" maxlength="1000" placeholder="${esc(L.chatPh)}"></textarea>
      <button type="submit" class="btn p" id="chatSendBtn">${esc(L.chatSend)}</button>
    </form>
  </div>`;
  document.body.appendChild(ov);
  renderChatMessages();
  markStaffChatRead();
  const close = () => { chatOpen = false; ov.remove(); };
  ov.querySelector('#chatClose').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  const inp = ov.querySelector('#chatInp'), sendBtn = ov.querySelector('#chatSendBtn');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ov.querySelector('#chatForm').requestSubmit(); } });
  ov.querySelector('#chatForm').onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    const now = Date.now();
    const msg = { id: Math.random().toString(36).slice(2, 10) + now.toString(36).slice(-4), from: 'client', text, ts: now };
    const st = unlocked.staff || {};
    const ref = doc(db, 'chats', staffRecId);
    try {
      if (chatData) {
        await updateDoc(ref, {
          clientName: st.name || 'Сотрудник',
          phone: st.phone || currentPhoneRaw,
          kind: 'staff',
          messages: arrayUnion(msg),
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: increment(1),
          unreadClient: 0
        });
      } else {
        await setDoc(ref, {
          clientName: st.name || 'Сотрудник',
          phone: st.phone || currentPhoneRaw,
          kind: 'staff',
          messages: [msg],
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: 1,
          unreadClient: 0
        });
      }
      inp.value = '';
    } catch (ex) {
      alert(I18N[lang].chatErr);
    } finally {
      sendBtn.disabled = false;
      inp.focus();
    }
  };
  inp.focus();
}

async function fetchStaffPortal() {
  const snap = await getDoc(doc(db, 'pub', 'staff'));
  if (!snap.exists()) return null;
  D = snap.data();
  wh = Array.isArray(D.wh) && D.wh.length === 2 ? D.wh : [9, 18];
  N = wh[1] - wh[0];
  return D;
}

/* ===== 7-Digit Azerbaijan Phone Input & Dramatic Auth Transitions ===== */
const OP_CODES = ['50', '51', '55', '99', '70', '77', '10'];
const dBoxes = [...document.querySelectorAll('.dbox')];
let loginBusy = false;

function getOpCode() {
  const selOp = $('#phOp').value;
  return selOp === '__other' ? ($('#phOpC').value || '').replace(/\D/g, '').slice(0, 2) : selOp;
}

function getDigits7() {
  return dBoxes.map(b => (b.value || '').replace(/\D/g, '').slice(0, 1)).join('');
}

function syncHiddenPhone() {
  const op = getOpCode();
  const d7 = getDigits7();
  const formatted = d7.length === 7 ? `+994 ${op} ${d7.slice(0, 3)} ${d7.slice(3, 5)} ${d7.slice(5)}` : (op + d7);
  $('#ph').value = formatted;
  return { op, d7, full: formatted };
}

function fillPhoneFromRaw(raw, autoGo = false) {
  const digits = String(raw || '').replace(/\D/g, '');
  let d7 = '';
  if (digits.length >= 9) {
    const last9 = digits.slice(-9);
    const p2 = last9.slice(0, 2);
    d7 = last9.slice(2);
    if (OP_CODES.includes(p2)) {
      $('#phOp').value = p2;
      $('#phOpC').hidden = true;
    } else {
      $('#phOp').value = '__other';
      $('#phOpC').hidden = false;
      $('#phOpC').value = p2;
    }
  } else {
    d7 = digits.slice(0, 7);
  }
  dBoxes.forEach((b, i) => {
    b.value = d7[i] || '';
    b.classList.toggle('filled', Boolean(d7[i]));
  });
  syncHiddenPhone();
  if (autoGo && getOpCode().length === 2 && d7.length === 7) {
    dBoxes[6].blur();
    login();
  }
}

function clearPhoneBoxes() {
  dBoxes.forEach(b => { b.value = ''; b.classList.remove('filled', 'pop'); });
  $('#digitsRow').classList.remove('ok', 'shake');
  $('#ph').value = '';
}

function setAuthMode(on) {
  document.body.classList.toggle('auth-mode', on);
  $('#loginBg').hidden = !on;
  if (on) $('#loginBg').classList.remove('fade-out');
}

const SPIN_SVG = `<svg viewBox="0 0 68 68" fill="none">
  <circle cx="34" cy="34" r="28" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="34" cy="34" r="28" stroke="#f03e38" stroke-width="4" stroke-linecap="round" stroke-dasharray="56 125">
    <animateTransform attributeName="transform" type="rotate" from="0 34 34" to="360 34 34" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="34" r="19" stroke="rgba(96,165,250,0.65)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 96">
    <animateTransform attributeName="transform" type="rotate" from="360 34 34" to="0 34 34" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>`;

const OK_SVG = `<svg viewBox="0 0 68 68" fill="none">
  <circle cx="34" cy="34" r="28" fill="rgba(16,201,136,0.16)" stroke="#10c988" stroke-width="3.5">
    <animate attributeName="r" values="24;28" dur="0.3s" fill="freeze"/>
  </circle>
  <path d="M22 34.5 L30.5 43 L46.5 26" stroke="#10c988" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="42" stroke-dashoffset="42">
    <animate attributeName="stroke-dashoffset" from="42" to="0" dur="0.35s" fill="freeze"/>
  </path>
</svg>`;

function showAuthOverlay(state, title, sub) {
  const ov = $('#authOv');
  if (!state) { ov.hidden = true; return; }
  $('#authSpin').innerHTML = state === 'ok' ? OK_SVG : SPIN_SVG;
  $('#authStTitle').textContent = title || '';
  $('#authStSub').textContent = sub || '';
  ov.hidden = false;
}

function shakeDigits() {
  const row = $('#digitsRow');
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
}

$('#phOp').onchange = () => {
  const isOth = $('#phOp').value === '__other';
  $('#phOpC').hidden = !isOth;
  syncHiddenPhone();
  if (isOth) $('#phOpC').focus();
  else {
    const firstEmpty = dBoxes.find(b => !b.value) || dBoxes[0];
    firstEmpty.focus();
    if (getDigits7().length === 7) login();
  }
};

$('#phOpC').oninput = () => {
  $('#phOpC').value = $('#phOpC').value.replace(/\D/g, '').slice(0, 2);
  syncHiddenPhone();
  if ($('#phOpC').value.length === 2) {
    const firstEmpty = dBoxes.find(b => !b.value) || dBoxes[0];
    firstEmpty.focus();
    if (getDigits7().length === 7) login();
  }
};

dBoxes.forEach((box, idx) => {
  box.addEventListener('focus', () => {
    setTimeout(() => { try { box.select(); } catch (e) {} }, 0);
  });
  box.addEventListener('input', () => {
    $('#err').textContent = '';
    const digits = (box.value || '').replace(/\D/g, '');
    if (digits.length > 1) {
      fillPhoneFromRaw(digits, true);
      return;
    }
    box.value = digits;
    box.classList.toggle('filled', Boolean(digits));
    if (digits) {
      box.classList.remove('pop');
      void box.offsetWidth;
      box.classList.add('pop');
      syncHiddenPhone();
      if (idx < 6) {
        dBoxes[idx + 1].focus();
      } else if (getOpCode().length === 2 && getDigits7().length === 7) {
        box.blur();
        login();
      }
    } else {
      syncHiddenPhone();
    }
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace') {
      if (!box.value && idx > 0) {
        e.preventDefault();
        dBoxes[idx - 1].value = '';
        dBoxes[idx - 1].classList.remove('filled');
        dBoxes[idx - 1].focus();
        syncHiddenPhone();
      }
    } else if (e.key === 'ArrowLeft' && idx > 0) {
      e.preventDefault(); dBoxes[idx - 1].focus();
    } else if (e.key === 'ArrowRight' && idx < 6) {
      e.preventDefault(); dBoxes[idx + 1].focus();
    } else if (e.key === 'Enter') {
      e.preventDefault(); login();
    }
  });
  box.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const d = txt.replace(/\D/g, '');
    if (d.length >= 2) {
      e.preventDefault();
      fillPhoneFromRaw(d, true);
    }
  });
});

async function login() {
  if (loginBusy) return;
  const L = I18N[lang];
  const err = m => { $('#err').textContent = m; };
  const { op, d7, full } = syncHiddenPhone();
  if (op.length !== 2 || d7.length !== 7) {
    err(L.errShort);
    shakeDigits();
    if (op.length !== 2) { $('#phOpC').hidden = false; $('#phOpC').focus(); }
    else { (dBoxes.find(b => !b.value) || dBoxes[0]).focus(); }
    return;
  }
  if (!(window.crypto && crypto.subtle)) { err(L.errCrypto); return; }

  loginBusy = true;
  err('');
  showAuthOverlay('loading', L.checking, L.checkingSub);
  try {
    const portal = await fetchStaffPortal();
    if (!portal) { showAuthOverlay(null); err(L.errNoData); shakeDigits(); return; }
    const data = await unlockStaff(full);
    if (!data) { showAuthOverlay(null); err(L.errNotFound); shakeDigits(); dBoxes[6].focus(); return; }

    $('#digitsRow').classList.add('ok');
    const firstName = (data.staff && data.staff.name) ? data.staff.name.split(/\s+/)[0] : '';
    showAuthOverlay('ok', firstName ? L.welcome(firstName) : L.pageTitle, L.welcomeSub);

    currentPhoneRaw = full;
    unlocked = data;
    saveSession(full);
    startSubs(data._recId);

    await new Promise(r => setTimeout(r, 760));
    $('#loginCard').classList.add('exiting');
    $('#loginBg').classList.add('fade-out');
    await new Promise(r => setTimeout(r, 380));

    showAuthOverlay(null);
    $('#loginCard').classList.remove('exiting');
    $('#login').hidden = true;
    setAuthMode(false);
    $('#view').hidden = false;
    $('#view').classList.remove('cab-enter');
    void $('#view').offsetWidth;
    $('#view').classList.add('cab-enter');
    renderAll();
    window.scrollTo(0, 0);
  } catch (e) {
    showAuthOverlay(null);
    err(L.errNet);
    shakeDigits();
  } finally {
    loginBusy = false;
  }
}

async function restoreSession() {
  const saved = loadSession();
  if (!saved || !(window.crypto && crypto.subtle)) {
    setAuthMode(true);
    return;
  }
  fillPhoneFromRaw(saved.phone, false);
  setAuthMode(true);
  $('#login').hidden = true;
  $('#loading').hidden = false;
  try {
    const portal = await fetchStaffPortal();
    if (!portal) { $('#loading').hidden = true; $('#login').hidden = false; $('#err').textContent = I18N[lang].errNoData; return; }
    const data = await unlockStaff(saved.phone);
    if (!data) { clearSession(); clearPhoneBoxes(); $('#loading').hidden = true; $('#login').hidden = false; return; }
    currentPhoneRaw = saved.phone;
    unlocked = data;
    startSubs(data._recId);
    $('#loading').hidden = true;
    setAuthMode(false);
    $('#view').hidden = false;
    $('#view').classList.add('cab-enter');
    renderAll();
  } catch (e) {
    $('#loading').hidden = true;
    $('#login').hidden = false;
    $('#err').textContent = I18N[lang].errNet;
  }
}

$('#logoutBtn').onclick = () => {
  clearSession();
  stopSubs();
  unlocked = null;
  currentPhoneRaw = '';
  clearPhoneBoxes();
  showAuthOverlay(null);
  $('#loginCard').classList.remove('exiting');
  $('#view').classList.remove('cab-enter');
  $('#view').hidden = true;
  $('#login').hidden = false;
  setAuthMode(true);
  $('#err').textContent = '';
  dBoxes[0].focus();
};

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
  applyLangStatic();
  if (unlocked) renderAll();
});

applyLangStatic();
restoreSession();
</script>
