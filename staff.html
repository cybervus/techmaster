<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет исполнителя — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Исполнитель">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--warn:#fa8c16;--warn-bg:#fff5e6;--soft:#fdecec;--blue:#2563eb;--gbg:#e6f8f1;--gbd:#00b578;--rbg:#fdecec;--rbd:#e52520;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--gbg:#112e24;--gbd:#10c988;--rbg:#331819;--rbd:#f03e38;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 48px;max-width:640px;margin-inline:auto}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{margin:0;line-height:0;flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:26px;height:26px;display:block}
h1{font-size:18px;font-weight:700;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:16px;height:11px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 span{font-weight:600;font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input[type=tel],input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 8px rgba(229,37,32,.22)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--muted);padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;margin-left:5px}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-k{color:var(--muted)}.info-v{font-weight:600;text-align:right}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#fff;color:var(--accent);font-size:12px;font-weight:700;margin-left:8px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:13px 12px;margin-bottom:10px;background:var(--bg)}
.tcard.act{background:var(--soft);border-color:var(--accent)}
.tcard.hi{border-left:4px solid var(--danger)}
.tcard.dn .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600;font-size:15px}
.tm{color:var(--muted);font-size:13px;margin-top:2px}
.tm a{color:var(--blue);text-decoration:none;font-weight:500}
.tdtls{margin-top:7px;font-size:13px;padding:8px 10px;background:var(--card);border-radius:10px;border:1px solid var(--line);white-space:pre-wrap}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;vertical-align:1px;background:var(--soft);color:var(--accent)}
.tag.hi{background:var(--soft);color:var(--danger)}
.tag.ok{background:var(--gbg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.chk-list{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px}
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:5px 4px;cursor:pointer;font-size:14px;user-select:none}
.chk-item input{width:19px;height:19px;margin-top:1px;accent-color:var(--ok);flex:none;cursor:pointer}
.chk-item.x span{text-decoration:line-through;color:var(--muted)}
.sub-its{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.sub-it{display:flex;justify-content:space-between;gap:8px}
.snote-row{display:flex;gap:6px;margin-top:8px}
.snote-row input{padding:8px 10px;font-size:14px;background:var(--card)}
.fin-bal{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fin-bal.owe-staff{background:var(--gbg);color:var(--ok)}
.fin-bal.owe-master{background:var(--rbg);color:var(--danger)}
.ptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ptbl th{text-align:left;font-weight:600;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.ptbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ptbl th.r,.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:10px}
.pnote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.free{background:var(--gbg);border-color:var(--gbd)}.busy{background:var(--rbg);border-color:var(--rbd)}.part{background:linear-gradient(135deg,var(--rbg) 50%,var(--gbg) 50%);border-color:var(--rbd)}
.ch{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;text-transform:capitalize;font-weight:700}
.ch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:5px 12px;font-size:16px;cursor:pointer}.ch button:disabled{opacity:.3;cursor:default}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.d{position:relative;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:0;cursor:pointer}
.d.past{opacity:.35}.d.sel{outline:2.5px solid var(--accent);outline-offset:1px;font-weight:700}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.h{text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid;font-size:14px;font-weight:600}
h3.dayh{font-size:14px;font-weight:700;margin:12px 0 6px;text-transform:capitalize}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:12px;font-size:13px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.chat-sheet{background:var(--card);width:100%;max-width:640px;height:86dvh;max-height:760px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.chat-hd h3{margin:0;font-size:16px;font-weight:700}
.chat-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat-day{align-self:center;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:6px 0 2px}
.mbub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mbub.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:4px}
.mbub.them{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbub .mw{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.mbub .mt{font-size:11px;opacity:.75;margin-top:4px;text-align:right}
.chat-bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}
.chat-bar textarea{flex:1;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:110px;resize:none}
.chat-bar .btn{padding:10px 16px;flex:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1e242b;color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:40}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16.09 6.35 L16.57 2.33 L23.43 2.33 L23.91 6.35 A14.2 14.2 0 0 1 29.86 9.79 L33.58 8.19 L37.02 14.14 L33.78 16.56 A14.2 14.2 0 0 1 33.78 23.44 L37.02 25.86 L33.58 31.81 L29.86 30.21 A14.2 14.2 0 0 1 23.91 33.65 L23.43 37.67 L16.57 37.67 L16.09 33.65 A14.2 14.2 0 0 1 10.14 30.21 L6.42 31.81 L2.98 25.86 L6.22 23.44 A14.2 14.2 0 0 1 6.22 16.56 L2.98 14.14 L6.42 8.19 L10.14 9.79 A14.2 14.2 0 0 1 16.09 6.35 Z"/><circle cx="20" cy="20" r="8.8"/><path d="M20 20V14.2M20 20l4.2 2.4"/></svg></div>
    <div>
      <h1 id="htitle">Кабинет исполнителя</h1>
      <div class="sub">Techmaster IT Solutions</div>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ru" id="btn-ru">
      <svg class="flag" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="4" fill="#ffffff"/><rect y="4" width="18" height="4" fill="#0039a6"/><rect y="8" width="18" height="4" fill="#d52b1e"/></svg>
      <span>RU</span>
    </button>
    <button type="button" data-lang="az" id="btn-az">
      <svg class="flag" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="4" fill="#00b5e2"/><rect y="4" width="18" height="4" fill="#ef3340"/><rect y="8" width="18" height="4" fill="#509e2f"/><circle cx="8.7" cy="6" r="1.45" fill="#ffffff"/><circle cx="9.15" cy="6" r="1.15" fill="#ef3340"/><circle cx="10.4" cy="6" r=".48" fill="#ffffff"/></svg>
      <span>AZ</span>
    </button>
  </div>
</header>

<main>
  <section id="loading" class="panel" hidden>
    <div class="muted" id="loadTxt" style="text-align:center;padding:18px 0">Загрузка кабинета…</div>
  </section>

  <section id="login" class="panel">
    <h2 id="lTitle">Вход для сотрудников</h2>
    <div class="muted" id="lHint">Введите ваш номер телефона, добавленный мастером.</div>
    <label class="fld" for="ph" id="lPhLbl">Номер телефона</label>
    <input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="+994 50 123 45 67">
    <div id="err" class="err"></div>
    <div class="row"><button id="go" class="btn p full">Войти</button></div>
  </section>

  <section id="view" hidden>
    <div id="staffTop"></div>
    <section class="panel">
      <h2 id="tasksTitle">Мои задачи</h2>
      <div id="tasksBox"></div>
    </section>
    <section class="panel">
      <h2 id="finTitle">Оплаты и расчёт</h2>
      <div id="finBox"></div>
    </section>
    <section class="panel">
      <h2 id="calTitle">Мой график загруженности</h2>
      <div class="leg" id="calLeg"></div>
      <div id="cal"></div>
      <div id="hrs"></div>
    </section>
    <div class="foot">
      <span id="upd"></span>
      <button type="button" class="btn" id="logoutBtn">Выйти</button>
    </div>
  </section>
</main>

/*CRYPTO*/
const norm = p => String(p).replace(/\D/g, '').slice(-9);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
async function unlockStaff(phone) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode('staff:' + norm(phone)), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, km, 384));
  const recId = hex(bits.slice(0, 16));
  const rec = (D.recs || []).find(r => r.id === recId);
  if (!rec) return null;
  const key = await crypto.subtle.importKey('raw', bits.slice(16), 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.iv) }, key, b64(rec.ct));
  const parsed = JSON.parse(new TextDecoder().decode(pt));
  parsed._recId = recId;
  return parsed;
}
/*END*/

// Merge base task from pub/staff with any newer local employee update
function effectiveTask(t) {
  const u = localUpdates && localUpdates[t.id];
  const baseTs = Number(t.ut) || 0;
  const useUpd = u && Number(u.ts) > baseTs;
  const st = useUpd && u.st ? u.st : (t.x || t.st === 'done' ? 'done' : (t.st === 'in_progress' ? 'in_progress' : 'todo'));
  const chk = (Array.isArray(t.chk) ? t.chk : []).map(c => ({
    id: c.id,
    t: c.t,
    x: useUpd && u.chk && typeof u.chk[c.id] === 'boolean' ? u.chk[c.id] : Boolean(c.x)
  }));
  const note = useUpd && typeof u.note === 'string' ? u.note : (t.sn || '');
  return Object.assign({}, t, { st, x: st === 'done', chk, sn: note });
}

async function pushTaskUpdate(taskId, patch) {
  if (!staffRecId || !unlocked) return;
  const base = (unlocked.tasks || []).find(x => x.id === taskId);
  if (!base) return;
  const cur = effectiveTask(base);
  const nextChk = {};
  cur.chk.forEach(c => { nextChk[c.id] = c.x; });
  if (patch.chk) Object.assign(nextChk, patch.chk);
  const now = Date.now();
  const nextRec = {
    st: patch.st !== undefined ? patch.st : cur.st,
    chk: nextChk,
    note: patch.note !== undefined ? patch.note : cur.sn,
    ts: now
  };
  const merged = Object.assign({}, localUpdates, { [taskId]: nextRec });
  localUpdates = merged;
  renderAll();
  try {
    await setDoc(doc(db, 'staff_updates', staffRecId), {
      staffId: unlocked.staff.id || '',
      staffName: unlocked.staff.name || '',
      updates: merged,
      lastTs: now
    });
    toast(I18N[lang].saved);
  } catch (e) {
    toast(I18N[lang].saveErr);
  }
}

function computeMySchedule(effTasks) {
  const busyMap = new Map(), fullSet = new Set();
  for (const t of effTasks) {
    if (t.x || !t.d) continue;
    const tm = (t.tm || '').trim();
    if (!tm) { fullSet.add(t.d); continue; }
    const parts = tm.split(':'), h = Number(parts[0]), m = Number(parts[1] || 0);
    if (!Number.isFinite(h)) { fullSet.add(t.d); continue; }
    const s = h * 60 + m, e = s + 60;
    for (let H = wh[0]; H < wh[1]; H++) {
      if (H * 60 < e && (H + 1) * 60 > s) {
        if (!busyMap.has(t.d)) busyMap.set(t.d, new Set());
        busyMap.get(t.d).add(H);
      }
    }
  }
  const busy = {};
  for (const [d, hs] of busyMap.entries()) busy[d] = [...hs].sort((a, b) => a - b);
  return { busy, full: [...fullSet] };
}

let mySched = { busy: {}, full: [] };
const hoursOf = d => mySched.full.includes(d) ? 'all' : (mySched.busy[d] || []);
function dayState(d) {
  if (d < T0) return 'past';
  const b = hoursOf(d), n = b === 'all' ? N : b.length;
  return n === 0 ? 'free' : n >= N ? 'busy' : 'part';
}

function drawCal() {
  const L = I18N[lang];
  const [y, m] = ym.split('-').map(Number), b = T0.split('-').map(Number), k = (y * 12 + m) - (b[0] * 12 + b[1]);
  const off = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let h = `<div class="ch"><button id="pm" ${k <= 0 ? 'disabled' : ''}>‹</button><span>${new Date(y, m - 1, 1).toLocaleDateString(L.locale, { month: 'long', year: 'numeric' })}</span><button id="nm" ${k >= 3 ? 'disabled' : ''}>›</button></div><div class="g">` + L.wds.map(x => `<span class="wd">${x}</span>`).join('');
  for (let i = 0; i < off; i++) h += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const s = y + '-' + pad(m) + '-' + pad(d), st = dayState(s);
    h += `<button type="button" class="d ${st === 'past' ? 'past' : st}${s === sel ? ' sel' : ''}" data-d="${s}">${d}</button>`;
  }
  $('#cal').innerHTML = h + '</div>';
  $('#pm').onclick = () => { ym = iso(new Date(y, m - 2, 1)).slice(0, 7); drawCal(); };
  $('#nm').onclick = () => { ym = iso(new Date(y, m, 1)).slice(0, 7); drawCal(); };
  $('#cal').querySelectorAll('.d').forEach(e => e.onclick = () => { sel = e.dataset.d; drawCal(); drawHours(); });
}

function drawHours() {
  const L = I18N[lang];
  let h = `<h3 class="dayh">${esc(fmtD(sel))}</h3>`;
  if (sel < T0) h += `<p class="muted">${esc(L.dayPast)}</p>`;
  else {
    const b = hoursOf(sel);
    h += '<div class="hs">';
    for (let x = wh[0]; x < wh[1]; x++) h += `<div class="h ${b === 'all' || b.includes(x) ? 'busy' : 'free'}">${pad(x)}:00</div>`;
    h += '</div>';
  }
  $('#hrs').innerHTML = h;
}

    if (dStr && dStr !== lastDay) { lastDay = dStr; html += `<div class="chat-day">${esc(dStr)}</div>`; }
    const isMe = m.from === 'client';
    html += `<div class="mbub ${isMe ? 'me' : 'them'}">${!isMe ? `<div class="mw">${esc(L.chatMaster)}</div>` : ''}${esc(m.text)}<div class="mt">${esc(tStr)}</div></div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}
function openChat() {
  if (!staffRecId || !unlocked) return;
  const L = I18N[lang];
  chatOpen = true;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="chat-sheet">
    <div class="chat-hd"><h3>${esc(L.chatTitle)}</h3><button type="button" class="btn" id="chatClose" aria-label="Закрыть">×</button></div>
    <div class="chat-log" id="chatLog"></div>
    <form class="chat-bar" id="chatForm">
      <textarea id="chatInp" rows="1" maxlength="1000" placeholder="${esc(L.chatPh)}"></textarea>
      <button type="submit" class="btn p" id="chatSendBtn">${esc(L.chatSend)}</button>
    </form>
  </div>`;
  document.body.appendChild(ov);
  renderChatMessages();
  markStaffChatRead();
  const close = () => { chatOpen = false; ov.remove(); };
  ov.querySelector('#chatClose').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  const inp = ov.querySelector('#chatInp'), sendBtn = ov.querySelector('#chatSendBtn');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ov.querySelector('#chatForm').requestSubmit(); } });
  ov.querySelector('#chatForm').onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    const now = Date.now();
    const msg = { id: Math.random().toString(36).slice(2, 10) + now.toString(36).slice(-4), from: 'client', text, ts: now };
    const st = unlocked.staff || {};
    const ref = doc(db, 'chats', staffRecId);
    try {
      if (chatData) {
        await updateDoc(ref, {
          clientName: st.name || 'Сотрудник',
          phone: st.phone || currentPhoneRaw,
          kind: 'staff',
          messages: arrayUnion(msg),
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: increment(1),
          unreadClient: 0
        });
      } else {
        await setDoc(ref, {
          clientName: st.name || 'Сотрудник',
          phone: st.phone || currentPhoneRaw,
          kind: 'staff',
          messages: [msg],
          lastTs: now,
          lastFrom: 'client',
          lastText: text.slice(0, 140),
          unreadAdmin: 1,
          unreadClient: 0
        });
      }
      inp.value = '';
    } catch (ex) {
      alert(I18N[lang].chatErr);
    } finally {
      sendBtn.disabled = false;
      inp.focus();
    }
  };
  inp.focus();
}

async function fetchStaffPortal() {
  const snap = await getDoc(doc(db, 'pub', 'staff'));
  if (!snap.exists()) return null;
  D = snap.data();
  wh = Array.isArray(D.wh) && D.wh.length === 2 ? D.wh : [9, 18];
  N = wh[1] - wh[0];
  return D;
}

async function login() {
  const L = I18N[lang];
  const err = m => { $('#err').textContent = m; }, btn = $('#go');
  const rawPhone = $('#ph').value.trim();
  if (norm(rawPhone).length < 7) { err(L.errShort); return; }
  if (!(window.crypto && crypto.subtle)) { err(L.errCrypto); return; }
  err('');
  btn.disabled = true;
  btn.textContent = L.checking;
  try {
    const portal = await fetchStaffPortal();
    if (!portal) { err(L.errNoData); return; }
    const data = await unlockStaff(rawPhone);
    if (!data) { err(L.errNotFound); return; }
    currentPhoneRaw = rawPhone;
    unlocked = data;
    saveSession(rawPhone);
    startSubs(data._recId);
    $('#login').hidden = true;
    $('#view').hidden = false;
    renderAll();
    window.scrollTo(0, 0);
  } catch (e) {
    err(L.errNet);
  } finally {
    btn.disabled = false;
    btn.textContent = I18N[lang].enter;
  }
}

async function restoreSession() {
  const saved = loadSession();
  if (!saved || !(window.crypto && crypto.subtle)) return;
  $('#ph').value = saved.phone;
  $('#login').hidden = true;
  $('#loading').hidden = false;
  try {
    const portal = await fetchStaffPortal();
    if (!portal) { $('#loading').hidden = true; $('#login').hidden = false; $('#err').textContent = I18N[lang].errNoData; return; }
    const data = await unlockStaff(saved.phone);
    if (!data) { clearSession(); $('#loading').hidden = true; $('#login').hidden = false; return; }
    currentPhoneRaw = saved.phone;
    unlocked = data;
    startSubs(data._recId);
    $('#loading').hidden = true;
    $('#view').hidden = false;
    renderAll();
  } catch (e) {
    $('#loading').hidden = true;
    $('#login').hidden = false;
    $('#err').textContent = I18N[lang].errNet;
  }
}

$('#go').onclick = login;
$('#ph').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logoutBtn').onclick = () => {
  clearSession();
  stopSubs();
  unlocked = null;
  currentPhoneRaw = '';
  $('#ph').value = '';
  $('#view').hidden = true;
  $('#login').hidden = false;
  $('#err').textContent = '';
  $('#ph').focus();
};

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
  applyLangStatic();
  if (unlocked) renderAll();
});

applyLangStatic();
restoreSession();
</script>
</body>
</html>
