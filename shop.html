<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин оборудования — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--ok-bg:#e6f8f1;--warn:#fa8c16;--warn-bg:#fff5e6;--soft:#fdecec;--blue:#2563eb;--blue-bg:#eef4ff;--purp:#7c3aed;--purp-bg:#f3eeff;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--ok-bg:#112e24;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--purp:#a78bfa;--purp-bg:#24193d;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--ok-bg:#112e24;--warn:#fb923c;--warn-bg:#2e2212;--soft:#331819;--blue:#60a5fa;--blue-bg:#17253d;--purp:#a78bfa;--purp-bg:#24193d;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 104px;max-width:720px;margin-inline:auto;overflow-x:clip}

/* Header */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 12px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.logo{margin:0;line-height:0;flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:24px;height:24px;display:block}
.btxt{min-width:0}
h1{font-size:17px;font-weight:700;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.icbtn{position:relative;height:36px;min-width:36px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-decoration:none;font:inherit;font-size:12.5px;font-weight:600;flex:none;transition:border-color .15s,color .15s}
.icbtn svg{width:18px;height:18px;display:block;flex:none}
.icbtn.accent-soft{background:var(--soft);border-color:transparent;color:var(--accent)}
.icbtn.call-ic{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.icbtn .ic-lbl{display:none}
.icdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:16px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:15px;height:10px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}

/* Sub-header / back bar */
.back-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.skip-link{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px}

/* Search & filters */
.toolbar{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap svg.s-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;height:42px;padding:0 34px 0 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;box-shadow:var(--sh)}
.search-wrap input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.s-clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.flt-btn{position:relative;flex:none;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.flt-btn.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.flt-btn svg{width:17px;height:17px;display:block}
.flt-cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* Category Landing Grid (11 minimalist cards) */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.sec-head h2{margin:0;font-size:16px;font-weight:700}
.sec-head span{font-size:12.5px;color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ccard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 13px;cursor:pointer;font:inherit;color:var(--text);box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.ccard-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.cicon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.cicon svg{width:22px;height:22px;display:block}
.cbadge-wiz{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:10px;background:var(--soft);color:var(--accent)}
.ctitle{font-weight:700;font-size:14.5px;line-height:1.25}
.cdesc{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccnt{margin-top:auto;font-size:11.5px;font-weight:600;color:var(--muted)}

/* Category accent colors */
.t-red{background:var(--soft);color:var(--accent)}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-purp{background:var(--purp-bg);color:var(--purp)}
.t-gray{background:var(--bg);color:var(--muted)}

/* Interactive Wizard */
.wiz-wrap{max-width:740px;margin-inline:auto}
.wiz-prog{margin:2px 0 12px}
.wiz-ptop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.wiz-pbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.wiz-pfill{height:100%;background:linear-gradient(90deg,#f03e38,#d61c17);border-radius:6px;transition:width .22s ease}
.wiz-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--sh);overflow:hidden;will-change:transform,opacity}
.wiz-card.in-next{-webkit-animation:wizInNext .28s cubic-bezier(.22,.9,.32,1) both;animation:wizInNext .28s cubic-bezier(.22,.9,.32,1) both}
.wiz-card.in-prev{-webkit-animation:wizInPrev .28s cubic-bezier(.22,.9,.32,1) both;animation:wizInPrev .28s cubic-bezier(.22,.9,.32,1) both}
.wiz-head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.wiz-ico{width:54px;height:54px;border-radius:15px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.wiz-ico svg{width:34px;height:34px;display:block}
.wiz-htxt{flex:1;min-width:0}
.wiz-card h2{margin:0 0 3px;font-size:17.5px;font-weight:700;line-height:1.25}
.wiz-hint{color:var(--muted);font-size:13px;margin:0;line-height:1.4}
.wiz-opts{display:flex;flex-direction:column;gap:8px}
.wopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer;transition:transform .14s ease,border-color .15s,background .15s;-webkit-animation:wizOptIn .28s cubic-bezier(.22,.9,.32,1) both;animation:wizOptIn .28s cubic-bezier(.22,.9,.32,1) both;-webkit-animation-delay:calc(var(--i,0) * 28ms);animation-delay:calc(var(--i,0) * 28ms)}
.wopt:active{transform:scale(.985)}
.wopt.on{background:var(--soft);border-color:var(--accent)}
.wopt.picked{-webkit-animation:wizPop .18s ease both;animation:wizPop .18s ease both}
@-webkit-keyframes wizInNext{from{opacity:0;-webkit-transform:translate3d(18px,0,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes wizInNext{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@-webkit-keyframes wizInPrev{from{opacity:0;-webkit-transform:translate3d(-18px,0,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes wizInPrev{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@-webkit-keyframes wizOptIn{from{opacity:0;-webkit-transform:translate3d(0,8px,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes wizOptIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@-webkit-keyframes wizPop{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(.975)}100%{-webkit-transform:scale(1)}}
@keyframes wizPop{0%{transform:scale(1)}50%{transform:scale(.975)}100%{transform:scale(1)}}
@-webkit-keyframes wizFadeUp{from{opacity:0;-webkit-transform:translate3d(0,12px,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes wizFadeUp{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.res-sum,.acc-box{-webkit-animation:wizFadeUp .3s cubic-bezier(.22,.9,.32,1) both;animation:wizFadeUp .3s cubic-bezier(.22,.9,.32,1) both}
.acc-box{-webkit-animation-delay:60ms;animation-delay:60ms}
.wopt-l{flex:1;min-width:0}
.wopt-t{font-size:14.5px;font-weight:600;line-height:1.3}
.wopt-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.wopt.on .wopt-s{color:var(--accent);opacity:.9}
.wopt-r{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);flex:none;white-space:nowrap}
.wopt.on .wopt-r{background:var(--accent);border-color:var(--accent);color:#fff}
.wiz-other{margin-top:10px}
.wiz-note{margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--blue-bg);color:var(--text);border-left:3px solid var(--blue);font-size:12.5px;line-height:1.4}
.wiz-nav{display:flex;gap:10px;margin-top:16px}
.wiz-nav .btn.p{flex:1}

/* Wizard Results: Summary + Auto Accessories + Grouped Products */
.res-sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--sh);margin-bottom:14px}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.res-top h2{margin:0;font-size:16.5px;font-weight:700}
.res-tags{display:flex;gap:6px;flex-wrap:wrap}
.rtag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.rtag b{color:var(--muted);font-weight:500;margin-right:4px}

.acc-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--sh);margin-bottom:16px}
.acc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.acc-hd h3{margin:0;font-size:15.5px;font-weight:700}
.acc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.acc-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.acc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc-row:last-child{border-bottom:0}
.acc-chk{width:19px;height:19px;accent-color:var(--accent);flex:none;cursor:pointer}
.acc-info{flex:1;min-width:0}
.acc-n{font-weight:600;font-size:13.5px;line-height:1.3}
.acc-d{font-size:12px;color:var(--muted);margin-top:1px}
.acc-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.grp-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px;font-size:14px;font-weight:700}
.grp-h span{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px}

/* Active filter pills */
.active-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-2px 0 10px}
.apill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:0;border-radius:16px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.apill-reset{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px}

/* Clean Product Grid & Cards */
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,transform .15s}
.pthumb{width:54px;height:54px;border-radius:12px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);color:var(--accent)}
.pthumb svg{width:26px;height:26px;display:block}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
.pname{font-weight:600;font-size:14.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px}
.sdot{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.sdot::before{content:'';width:6px;height:6px;border-radius:50%;flex:none}
.sdot.ok{color:var(--ok)}.sdot.ok::before{background:var(--ok)}
.sdot.warn{color:var(--warn)}.sdot.warn::before{background:var(--warn)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.price{font-weight:700;font-size:15.5px;color:var(--text)}
.price small{font-weight:500;font-size:12px;color:var(--muted)}
.more-hint{font-size:12.5px;font-weight:600;color:var(--muted)}

/* Controls & forms */
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;font:inherit;font-size:15.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
textarea{min-height:74px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);box-shadow:0 3px 8px rgba(229,37,32,.22)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.qty{display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.qty button{border:0;background:var(--soft);color:var(--accent);width:30px;height:30px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.qty span{min-width:28px;text-align:center;font-weight:700;font-size:13px;padding:0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:34px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.foot-links{margin-top:22px;text-align:center;font-size:13px;color:var(--muted);display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.foot-links a{color:var(--muted);text-decoration:none;font-weight:500}

/* Bottom floating cart bar */
.cart-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(15,23,42,.1);padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px));z-index:12}
.cart-in{max-width:720px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cart-sum{font-size:12.5px;line-height:1.3;color:var(--muted)}
.cart-sum b{display:block;font-size:15.5px;color:var(--text)}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:25}
.ov .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90dvh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-hd h2{margin:0;font-size:17px;font-weight:700}
.sheet-hd .btn{padding:5px 10px;font-size:16px;line-height:1}
.fsec{margin-top:14px}
.fsec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.fpills{display:flex;gap:7px;flex-wrap:wrap}
.fpill{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.fpill.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.det-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.det-thumb{width:68px;height:68px;border-radius:14px}
.det-thumb svg{width:32px;height:32px}
.det-desc{font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);border-radius:12px;padding:12px;margin:12px 0;white-space:pre-wrap}

const KNOWN_BRANDS = ['Hikvision', 'Ubiquiti', 'Dahua', 'MikroTik', 'TP-Link', 'Keenetic', 'Cudy', 'EZVIZ', 'Ajax', 'Uniview', 'Shturmann', 'Schneider', 'Legrand', 'Famatel', 'Zubr', 'Teltonika', 'Starlink', 'WD Purple'];
function detectBrand(p) {
  const hay = (p.name || '') + ' ' + (p.sku || '');
  for (const b of KNOWN_BRANDS) {
    if (hay.toLowerCase().includes(b.toLowerCase())) return b;
  }
  return '';
}

/* Map existing 7-cat Firestore items + new 11-cat items cleanly into the 11 categories */
function detectShopCat(p) {
  if (p.cat && CAT_IDS.includes(p.cat)) return p.cat;
  const nm = ((p.name || '') + ' ' + (p.sku || '')).toLowerCase();
  if (/шлагбаум|турникет|барьер|привод ворот/.test(nm)) return 'barriers';
  if (/домофон|вызывн|видеоглазок|глазок|intercom|ds-kh|ds-kv|ds-kis|vto|vth|dp2c|cp4/.test(nm)) return 'intercom';
  if (/\bups\b|ибп|аккумуляторн.*батаре|аккумулятор 12|бесперебойн|блок питания 12в/.test(nm)) return 'ups';
  if (/видеорегистратор|\bnvr\b|\bdvr\b|\bxvr\b|ds-7[1267]|камер|bullet|turret|dome|colorvu|acusense|turbo hd|wizsense|tioc|colorhunter|wd purple|skyhawk|солнечная панель/.test(nm)
      && !/монтажная коробка|кронштейн|шввп|кабель питания|коммутатор|switch/.test(nm)) return 'cctv';
  if (/сигнализац|ajax|ax pro|скуд|электромагнитн|электромеханическ|замок|контроллер доступ|считывател|кнопка выхода|брелок|сирена|ds-k1|ds-pwa|motionprotect|doorprotect|streetsiren|homesiren|spacecontrol/.test(nm)) return 'alarm';
  if (/монитор|телевизор|\bтв\b|\btv\b|видеостен|проектор|дисплей/.test(nm)) return 'monitors';
  if (/колонк|усилител.*звук|аудиосистем|динамик|ресивер|сабвуфер|громкоговорител/.test(nm)) return 'audio';
  if (/умный дом|умн(ое|ая|ый)\s|zigbee|tuya|датчик протечк|датчик дыма|термостат/.test(nm) || p.cat === 'smarthome') return 'smarthome';
  if (/автоматическ.*выключат|\bузо\b|дифавтомат|реле напряж|электрическ.*щит|щиток|розетк.*220|блок розеток|\bpdu\b|светильн|освещ|силовой кабель|nym|ввгнг|шввп|zubr/.test(nm)) return 'electrical';
  if (/телекоммуникационн.*шкаф|серверн.*шкаф|\brack\b|стойк|монтажн.*коробк|распаечн.*коробк|распред.*коробк|кронштейн|патч-панел|органайзер|кабель-канал|гофра-труб|ds-1280|ds-1273/.test(nm)) return 'racks';
  if (p.cat === 'network' || /роутер|маршрутизатор|коммутатор|switch|poe|точк.*доступ|wi-fi|wifi|mesh|unifi|mikrotik|cudy|keenetic|tp-link|teltonika|starlink|utp|ftp|sftp|патч-корд|коннектор.*rj45|интернет-розетк/.test(nm)) return 'network';
  if (p.cat === 'security') return 'cctv';
  if (p.cat === 'access') return 'alarm';
  if (p.cat === 'av') return 'monitors';
  return 'racks';
}

function catTone(id) {
  const f = SHOP_CATS.find(x => x.id === id);
  return f ? f.tone : 't-gray';
}

function thumbHtml(p, extraCls = '') {
  const cat = detectShopCat(p);
  const cls = `pthumb ${catTone(cat)}${extraCls ? ' ' + extraCls : ''}`;
  if (p.img) {
    return `<div class="${cls}"><img class="pimg" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden aria-hidden="true">${catIconSvg(cat)}</span></div>`;
  }
  return `<div class="${cls}" aria-hidden="true">${catIconSvg(cat)}</div>`;
}

function toast(m) {
  const old = $('#toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function fmtPrice(p) {
  const n = Number(p);
  if (!Number.isFinite(n) || n <= 0) return I18N[lang].priceAsk;
  return (Number.isInteger(n) ? n : n.toFixed(2)) + ' ₼';
}

function fmt7(d) {
  const s = String(d || '').replace(/\D/g, '').slice(0, 7);
  if (s.length <= 3) return s;
  if (s.length <= 5) return s.slice(0, 3) + ' ' + s.slice(3);
  return s.slice(0, 3) + ' ' + s.slice(3, 5) + ' ' + s.slice(5);
}

function cartTotal() { return cart.reduce((acc, it) => acc + (Number(it.price) > 0 ? Number(it.price) * it.qty : 0), 0); }
function cartCount() { return cart.reduce((acc, it) => acc + it.qty, 0); }

function addToCart(prod, delta, silent) {
  const i = cart.findIndex(x => x.id === prod.id);
  if (i < 0) {
    if (delta > 0) cart.push({ id: prod.id, name: prod.name, price: Number(prod.price) || 0, unit: prod.unit || 'шт.', qty: delta });
  } else {
    cart[i].qty += delta;
    if (cart[i].qty <= 0) cart.splice(i, 1);
  }
  if (!silent) render();
}

/* CCTV Math Helpers */
function wizCamCount() {
  switch (wizAns.cams) {
    case '1-4': return 4;
    case '4-8': return 8;
    case '8-16': return 16;
    case '16-32': return 32;
    case '32-64': return 64;
    case '64+': {
      const n = Math.round(Number(wizAns.camsCustom));
      return Number.isFinite(n) && n > 0 ? n : 64;
    }
    default: return 4;
  }
}

function wizNvrChannels() {
  const n = wizCamCount();
  if (n <= 4) return 4;
  if (n <= 8) return 8;
  if (n <= 16) return 16;
  if (n <= 32) return 32;
  if (n <= 64) return 64;
  return Math.ceil(n / 64) * 64;
}

function wizMpNum() {
  if (wizAns.mp === '1') return 1;
  if (wizAns.mp === '2') return 2;
  if (wizAns.mp === '4') return 4;
  if (wizAns.mp === '5') return 5;
  if (wizAns.mp === '6') return 6;
  if (wizAns.mp === '8+') return 8;
  return 4;
}

function calcArchiveDays(tb) {
  const cams = wizCamCount();
  const mp = wizMpNum();
  const gbPerDayMap = { 1: 7.5, 2: 13, 4: 22, 5: 26, 6: 30, 8: 41 };
  const perCam = gbPerDayMap[mp] || 22;
  const usableGb = tb * 930;
  return Math.floor(usableGb / (cams * perCam));
}

function buildWizAccessories() {
  const L = I18N[lang];
  const cams = wizCamCount();
  const isAnalog = wizAns.sys === 'analog';
  const avgMMap = { house: 25, apt: 15, office: 20, enterprise: 35, transport: 8, other: 20 };
  const perCamM = avgMMap[wizAns.obj] || 20;
  const cabFactor = wizAns.cab === 'done' ? 0 : (wizAns.cab === 'partial' ? 0.5 : 1);
  const totalMeters = Math.ceil((cams * perCamM * cabFactor) / 10) * 10;

  const list = [];
  list.push({ id: 'acc_box', on: true, name: L.accBox, desc: L.accBoxD(cams), qty: cams, unit: L.unitPcs });

  if (!isAnalog) {
    list.push({ id: 'acc_rj45', on: true, name: L.accRj45, desc: L.accRj45D, qty: cams * 2 + 4, unit: L.unitPcs });
    const swPorts = cams <= 4 ? 4 : (cams <= 8 ? 8 : 16);
    const swQty = Math.ceil(cams / swPorts);
    list.push({ id: 'acc_poe', on: true, name: L.accPoe(swPorts, swQty), desc: L.accPoeD, qty: swQty, unit: L.unitPcs });
    if (totalMeters > 0) {
      list.push({ id: 'acc_utp', on: true, name: L.accUtp, desc: L.accUtpD(Math.round(perCamM * cabFactor), cams), qty: totalMeters, unit: L.unitM });
    }
  } else {
    list.push({ id: 'acc_bnc', on: true, name: L.accBnc, desc: L.accBncD, qty: cams * 2, unit: L.unitPcs });
    list.push({ id: 'acc_dc', on: true, name: L.accDc, desc: L.accDcD, qty: cams * 2, unit: L.unitPcs });
    list.push({ id: 'acc_psu', on: true, name: L.accPsu, desc: L.accPsuD, qty: Math.max(1, Math.ceil(cams / 8)), unit: L.unitPcs });
    if (totalMeters > 0) {
      list.push({ id: 'acc_coax', on: true, name: L.accCoax, desc: L.accCoaxD(Math.round(perCamM * cabFactor), cams), qty: totalMeters, unit: L.unitM });
    }
  }

  const archTb = Number(wizAns.arch);
  if (Number.isFinite(archTb) && archTb > 0) {
    const hddUnit = archTb > 8 ? 8 : archTb;
    const hddQty = archTb > 8 ? Math.ceil(archTb / 8) : 1;
    list.push({ id: 'acc_hdd', on: true, name: L.accHdd(hddUnit), desc: L.accHddD(L.wizDaysApprox(calcArchiveDays(hddUnit * hddQty))), qty: hddQty, unit: L.unitPcs });
  }

  list.push({ id: 'acc_patch', on: true, name: L.accPatch, desc: L.accPatchD, qty: 1, unit: L.unitPcs });
  wizAccDraft = list;
}

function wizSummaryPairs() {
  const L = I18N[lang];
  const findLbl = (arr, v) => { const f = arr.find(x => x.v === v); return f ? f.t : v; };
  const objT = wizAns.obj === 'other' ? (wizAns.objOther || findLbl(L.q1Opts, 'other')) : findLbl(L.q1Opts, wizAns.obj);
  const camsT = wizAns.cams === '64+' ? `${wizCamCount()} (${wizNvrChannels()} ${L.chShort})` : `${findLbl(L.q2Opts, wizAns.cams)} (${wizNvrChannels()} ${L.chShort})`;
  const sysT = findLbl(L.q3Opts, wizAns.sys);
  const mpT = findLbl(L.q4Opts, wizAns.mp);
  const archTb = Number(wizAns.arch);
  const archT = wizAns.arch === 'other'
    ? (wizAns.archOther || L.q5OtherT)
    : (Number.isFinite(archTb) && archTb > 0 ? `${L.q5Tb(archTb)} (${L.wizDaysApprox(calcArchiveDays(archTb))})` : '—');
  const cabT = wizAns.cab === 'other' ? (wizAns.cabOther || findLbl(L.q6Opts, 'other')) : findLbl(L.q6Opts, wizAns.cab);
  const brT = wizAns.brand === 'other' ? (wizAns.brandOther || findLbl(L.q7Opts, 'other')) : findLbl(L.q7Opts, wizAns.brand);
  return [
    [L.sumObj, objT],
    [L.sumCams, camsT],
    [L.sumSys, sysT],
    [L.sumMp, mpT],
    [L.sumArch, archT],
    [L.sumCab, cabT],
    [L.sumBrand, brT]
  ];
}

function wizSummaryComment() {
  if (wizCat === 'cctv') {
    if (!wizAns.obj && !wizAns.cams) return '';
    const pairs = wizSummaryPairs().filter(([, v]) => v && v !== '—');
    return `[${I18N[lang].wizTitle}]\n` + pairs.map(([k, v]) => `${k}: ${v}`).join('\n');
  }
  const ans = wizExtraAns[wizCat];
  if (!ans || !Object.keys(ans).length) return '';
  const pairs = extraSummaryPairs(wizCat).filter(([, v]) => v && v !== '—');
  const catName = (I18N[lang].cats[wizCat] && I18N[lang].cats[wizCat].t) || wizCat;
  return `[${I18N[lang].wizCatTitle(catName)}]\n` + pairs.map(([k, v]) => `${k}: ${v}`).join('\n');
}

function extraSummaryPairs(catId) {
  const steps = WIZ_EXTRA[catId] || [];
  const ans = wizExtraAns[catId] || {};
  return steps.map(st => {
    const loc = st[lang] || st.ru;
    const v = ans[st.k] || '';
    if (!v) return [loc.sum, '—'];
    if (v === 'other') return [loc.sum, (ans[st.k + 'Other'] || '').trim() || (loc.opts.find(o => o[0] === 'other') || ['', '—'])[1]];
    const found = loc.opts.find(o => o[0] === v);
    return [loc.sum, found ? found[1] : v];
  });
}

function buildAllWizAccessories() {
  if (wizCat === 'cctv') buildWizAccessories();
  else buildExtraAccessories(wizCat);

function matchExtraProducts(catId) {
  const ans = wizExtraAns[catId] || {};
  const brRaw = (ans.brand && ans.brand !== 'any' && ans.brand !== 'other') ? ans.brand.toLowerCase() : '';
  const pool = products.filter(p => detectShopCat(p) === catId);
  const scoreBrand = p => (!brRaw ? 1 : (detectBrand(p).toLowerCase().includes(brRaw) || (p.name || '').toLowerCase().includes(brRaw) ? 3 : 0));
  const sorted = [...pool].sort((a, b) => scoreBrand(b) - scoreBrand(a));
  return sorted.slice(0, 12);
}

function matchWizProducts() {
  const br = (wizAns.brand && wizAns.brand !== 'any' && wizAns.brand !== 'other') ? wizAns.brand.toLowerCase() : '';
  const isAnalog = wizAns.sys === 'analog';
  const ch = wizNvrChannels();
  const mp = wizAns.mp && wizAns.mp !== 'specialist' ? wizAns.mp.replace('+', '') : '';

  const nmOf = p => ((p.name || '') + ' ' + (p.sku || '')).toLowerCase();
  const isReg = p => /видеорегистратор|\bnvr\b|\bdvr\b|\bxvr\b|i?ds-7[1267]|nvr[0-9]/.test(nmOf(p));
  const isCam = p => {
    const nm = nmOf(p);
    if (detectShopCat(p) !== 'cctv' || isReg(p)) return false;
    if (/солнечн|коробк|кронштейн|гофра|канал|кабель|диск|wd purple|skyhawk|блок питан|коммутатор/.test(nm)) return false;
    return /камер|bullet|turret|dome|ptz/.test(nm);
  };
  const isExtra = p => {
    const nm = nmOf(p);
    if (isReg(p) || isCam(p)) return false;
    if (/wd purple|skyhawk|\bhdd\b|монтажная коробка|распаечная коробка|солнечная панель/.test(nm)) return true;
    if (isAnalog) return /блок питания 12в|шввп|коаксиал|квк|\bbnc\b/.test(nm);
    return /poe.*коммутатор|коммутатор.*poe|poe.*switch|кабель.*utp|utp.*кабель|коннектор.*rj45/.test(nm);
  };

  const scoreBrand = p => (!br ? 1 : (detectBrand(p).toLowerCase() === br ? 3 : 0));

  // 1. Cameras (strictly real cameras only!)
  let cams = products.filter(isCam).filter(p => {
    const nm = nmOf(p);
    const isAnalogCam = /turbo hd|hd-tvi|hd-cvi|ds-2ce|hac-/.test(nm);
    if (isAnalog) return isAnalogCam;
    if (wizAns.sys === 'ip') return !isAnalogCam;
    return true;
  });
  if (br) {
    const brCams = cams.filter(p => detectBrand(p).toLowerCase() === br);
    if (brCams.length) cams = brCams;
  }
  if (mp) {
    const mpRx = new RegExp(`\\b${mp}\\s?(мп|mp)\\b`, 'i');
    const mpCams = cams.filter(p => mpRx.test(nmOf(p)));
    if (mpCams.length >= 2) cams = mpCams;
  }
  if (!cams.length) cams = products.filter(isCam);
  cams.sort((a, b) => scoreBrand(b) - scoreBrand(a));

  // 2. Recorders (NVR for IP, DVR/XVR for Analog)
  let nvrs = products.filter(isReg);
  const typedNvrs = nvrs.filter(p => {
    const isDvr = /\bdvr\b|\bxvr\b|hqhi|huhi|ids-72/.test(nmOf(p));
    return isAnalog ? isDvr : !isDvr;
  });
  if (typedNvrs.length) nvrs = typedNvrs;
  if (br) {
    const brNvr = nvrs.filter(p => detectBrand(p).toLowerCase() === br);
    if (brNvr.length) nvrs = brNvr;
  }
  const chRx = new RegExp(`(\\b${ch}[\\s-]?кан|[-/]${ch}[pq]?\\b|\\b${ch}ch\\b)`, 'i');
  nvrs.sort((a, b) => {
    const am = chRx.test(nmOf(a)) ? 2 : 0;
    const bm = chRx.test(nmOf(b)) ? 2 : 0;
    return (bm + scoreBrand(b)) - (am + scoreBrand(a));
  });

  // 3. Extras (HDD, PoE switch / 12V PSU, cables, mounting boxes)
  let extras = products.filter(isExtra);
  extras.sort((a, b) => scoreBrand(b) - scoreBrand(a));

  return { cams: cams.slice(0, 12), nvrs: nvrs.slice(0, 6), extras: extras.slice(0, 8) };
}

function getFiltered(opts = {}) {
  const cf = opts.cat !== undefined ? opts.cat : activeCat;
  const bf = opts.brand !== undefined ? opts.brand : brandFilter;
  const st = opts.stockOnly !== undefined ? opts.stockOnly : stockOnly;
  const q = searchQ.trim().toLowerCase();
  return products.filter(p => {
    if (cf !== 'all' && detectShopCat(p) !== cf) return false;
    if (bf !== 'all' && detectBrand(p) !== bf) return false;
    if (st && p.inStock === false) return false;
    if (q) {
      const hay = ((p.name || '') + ' ' + (p.sku || '') + ' ' + (p.desc || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function productCardHtml(p) {
  const L = I18N[lang];
  const ci = cart.find(x => x.id === p.id);
  const brand = detectBrand(p);
  const catId = detectShopCat(p);
  const catLbl = (L.cats[catId] && L.cats[catId].t) || '';
  const subLbl = brand || catLbl;
  const inStk = p.inStock !== false;
  const stockHtml = `<span class="sdot ${inStk ? 'ok' : 'warn'}">${esc(inStk ? L.inStock : L.byOrder)}</span>`;
  const hasPrice = Number(p.price) > 0;
  const leftFoot = hasPrice
    ? `<div class="price">${esc(fmtPrice(p.price))}${p.unit ? ` <small>/ ${esc(p.unit)}</small>` : ''}</div>`
    : `<span class="more-hint">${esc(L.detailsHint)}</span>`;
  const ctrl = ci
    ? `<div class="qty"><button type="button" data-dec="${esc(p.id)}">−</button><span>${ci.qty}</span><button type="button" data-inc="${esc(p.id)}">+</button></div>`
    : `<button type="button" class="btn p sm" data-inc="${esc(p.id)}">+ ${esc(L.addCart)}</button>`;
  return `<article class="pcard" data-open="${esc(p.id)}">
    ${thumbHtml(p)}
    <div class="pmain">
      <div class="pname">${esc(p.name)}</div>
      <div class="pmeta">${subLbl ? `<span>${esc(subLbl)}</span>` : ''}${stockHtml}</div>
      <div class="pfoot">${leftFoot}${ctrl}</div>
    </div>
  </article>`;
}

function bindProductCards(root) {
  root.querySelectorAll('[data-inc]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = products.find(x => x.id === b.dataset.inc);
    if (p) addToCart(p, 1);
  });
  root.querySelectorAll('[data-dec]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = products.find(x => x.id === b.dataset.dec);
    if (p) addToCart(p, -1);
  });
  root.querySelectorAll('[data-open]').forEach(card => card.onclick = e => {
    if (e.target.closest('button')) return;
    const p = products.find(x => x.id === card.dataset.open);
    if (p) openProductModal(p);
  });
}

function renderCartBar() {

function renderHome(L) {
  // If user typed in global search on Home screen, show search results right away
  let html = `<div class="toolbar">
    <div class="search-wrap">
      <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="qInp" type="search" placeholder="${esc(L.searchPh)}" value="${esc(searchQ)}">
      ${searchQ ? '<button type="button" class="s-clr" id="qClr" aria-label="×">×</button>' : ''}
    </div>
  </div>`;

  if (searchQ.trim()) {
    const res = getFiltered({ cat: 'all', brand: 'all', stockOnly: false });
    const shown = res.slice(0, pageLimit);
    const rest = res.length - shown.length;
    if (!res.length) {
      html += `<div class="empty"><div>${esc(L.notFound)}</div><div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn p" id="emptyCustomBtn">${esc(L.addOwnBtn)}</button></div></div>`;
    } else {
      html += '<div class="plist">' + shown.map(productCardHtml).join('') + '</div>';
      if (rest > 0) html += `<div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="btn" id="moreBtn">${esc(L.showMore(rest))}</button></div>`;
    }
    $('#app').innerHTML = html;
    const qInp = $('#qInp');
    qInp.oninput = () => { searchQ = qInp.value; pageLimit = 30; renderListOnly(); };
    if ($('#qClr')) $('#qClr').onclick = () => { searchQ = ''; render(); };
    if ($('#emptyCustomBtn')) $('#emptyCustomBtn').onclick = openCustomModal;
    if ($('#moreBtn')) $('#moreBtn').onclick = () => { pageLimit += 30; render(); };
    bindProductCards($('#app'));
    return;
  }

  // Count items per category
  const counts = {};
  for (const p of products) {
    const cid = detectShopCat(p);
    counts[cid] = (counts[cid] || 0) + 1;
  }

  html += `<div class="sec-head"><h2>${esc(L.homeTitle)}</h2><span>${esc(L.homeSub)}</span></div>`;
  html += '<div class="cat-grid">' + SHOP_CATS.map(c => {
    const info = L.cats[c.id];
    const cnt = counts[c.id] || 0;
    return `<button type="button" class="ccard" data-pickcat="${c.id}">
      <div class="ccard-top">
        <div class="cicon ${c.tone}">${catIconSvg(c.id)}</div>
        ${c.hasWiz ? `<span class="cbadge-wiz">${esc(L.wizBadge)}</span>` : ''}
      </div>
      <div class="ctitle">${esc(info.t)}</div>
      <div class="cdesc">${esc(info.d)}</div>
      <div class="ccnt">${esc(L.catProdCnt(cnt))}</div>
    </button>`;
  }).join('') + '</div>';

  html += `<div class="row" style="justify-content:center;margin-top:18px">
    <button type="button" class="btn" id="allCatBtn">${esc(L.allCatalogBtn)} (${products.length})</button>
  </div>`;

  $('#app').innerHTML = html;
  const qInp = $('#qInp');
  qInp.oninput = () => { searchQ = qInp.value; pageLimit = 30; renderListOnly(); };
  $('#app').querySelectorAll('[data-pickcat]').forEach(b => b.onclick = () => {
    const cid = b.dataset.pickcat;
    activeCat = cid;
    brandFilter = 'all';
    stockOnly = false;
    searchQ = '';
    pageLimit = 30;
    const catMeta = SHOP_CATS.find(x => x.id === cid);
    if (catMeta && catMeta.hasWiz) {
      wizCat = cid;
      wizStep = 0;
      wizDir = 'next';
      mode = 'wiz';
    } else {
      mode = 'cat';
    }
    render();
    window.scrollTo(0, 0);
  });
  $('#allCatBtn').onclick = () => { activeCat = 'all'; brandFilter = 'all'; stockOnly = false; searchQ = ''; pageLimit = 30; mode = 'all'; render(); window.scrollTo(0, 0); };
}

function wizAnimSvg(key) {

const CCTV_ICONS = ['home', 'cam', 'signal', 'focus', 'hdd', 'cable', 'shield'];

function renderWizard(L) {
  const isCctv = wizCat === 'cctv';
  const extraSteps = !isCctv ? (WIZ_EXTRA[wizCat] || []) : [];
  const totalSteps = isCctv ? 7 : extraSteps.length;
  if (wizStep >= totalSteps) wizStep = 0;
  const pct = Math.round(((wizStep + 1) / totalSteps) * 100);
  const catName = (L.cats[wizCat] && L.cats[wizCat].t) || '';
  const wizTitleTxt = isCctv ? L.wizTitle : L.wizCatTitle(catName);

  let qTitle = '', qHint = '', opts = [], field = '', otherField = '', otherPh = '', extraNote = '', isNumOther = false, cols2 = false, icoKey = 'shield';
  let curVal = '', curOtherVal = '';

  if (isCctv) {
    icoKey = CCTV_ICONS[wizStep] || 'shield';
    if (wizStep === 0) {
      qTitle = L.q1Title; qHint = L.q1Hint; opts = L.q1Opts; field = 'obj'; otherField = 'objOther'; otherPh = L.q1Ph; cols2 = true;
    } else if (wizStep === 1) {
      qTitle = L.q2Title; qHint = L.q2Hint; opts = L.q2Opts; field = 'cams'; otherField = 'camsCustom'; otherPh = L.q2Ph; isNumOther = true; cols2 = true;
    } else if (wizStep === 2) {
      qTitle = L.q3Title; qHint = L.q3Hint; opts = L.q3Opts; field = 'sys';
    } else if (wizStep === 3) {
      qTitle = L.q4Title; qHint = L.q4Hint; opts = L.q4Opts; field = 'mp'; extraNote = L.wizMpNote; cols2 = true;
    } else if (wizStep === 4) {
      qTitle = L.q5Title; qHint = L.q5Hint; field = 'arch'; otherField = 'archOther'; otherPh = L.q5Ph; cols2 = true;
      const tbs = [1, 2, 4, 6, 8, 16];
      opts = tbs.map(tb => ({
        v: String(tb),
        t: tb <= 8 ? L.q5Tb(tb) : `${L.q5Tb(tb)} (2 × ${L.q5Tb(8)})`,
        s: tb <= 2 ? 'WD Purple / SkyHawk' : L.q5SubBig,
        r: L.wizDaysApprox(calcArchiveDays(tb))
      }));
      opts.push({ v: 'other', t: L.q5OtherT, s: '' });
      extraNote = L.wizDaysNote(wizCamCount(), wizMpNum());
    } else if (wizStep === 5) {
      qTitle = L.q6Title; qHint = L.q6Hint; opts = L.q6Opts; field = 'cab'; otherField = 'cabOther'; otherPh = L.q6Ph;
    } else {
      qTitle = L.q7Title; qHint = L.q7Hint; opts = L.q7Opts; field = 'brand'; otherField = 'brandOther'; otherPh = L.q7Ph; cols2 = true;
    }
    curVal = wizAns[field] || '';
    curOtherVal = otherField ? (wizAns[otherField] || '') : '';
  } else {
    const st = extraSteps[wizStep];
    const loc = st[lang] || st.ru;
    icoKey = st.ico || 'shield';
    cols2 = Boolean(st.cols2);
    qTitle = loc.t;
    qHint = loc.h || '';
    opts = loc.opts.map(o => ({ v: o[0], t: o[1], s: o[2] || '', r: o[3] || '' }));
    field = st.k;
    otherField = loc.ph ? (st.k + 'Other') : '';
    otherPh = loc.ph || '';
    const store = wizExtraAns[wizCat] || (wizExtraAns[wizCat] = {});
    curVal = store[field] || '';
    curOtherVal = otherField ? (store[otherField] || '') : '';
  }

  const needsOther = (curVal === 'other' || curVal === '64+') && otherField;

  let html = `<div class="wiz-wrap">
    <div class="back-bar">
      <button type="button" class="back-btn" id="wizBackCats">${esc(L.backCats)}</button>
      <button type="button" class="skip-link" id="wizSkip">${esc(L.skipToCat)}</button>
    </div>
    <div class="wiz-prog">
      <div class="wiz-ptop"><span>${esc(wizTitleTxt)} · ${esc(L.wizStep(wizStep + 1, totalSteps))}</span><span>${pct}%</span></div>
      <div class="wiz-pbar"><div class="wiz-pfill" style="width:${pct}%"></div></div>
    </div>
    <section class="wiz-card ${wizDir === 'prev' ? 'in-prev' : 'in-next'}">
      <div class="wiz-head">
        <div class="wiz-ico" aria-hidden="true">${wizAnimSvg(icoKey)}</div>
        <div class="wiz-htxt">
          <h2>${esc(qTitle)}</h2>
          <div class="wiz-hint">${esc(qHint)}</div>
        </div>
      </div>
      <div class="wiz-opts${cols2 ? ' cols2' : ''}">
        ${opts.map((o, idx) => `<button type="button" class="wopt${curVal === o.v ? ' on' : ''}" style="--i:${idx}" data-wv="${esc(o.v)}">
          <div class="wopt-l">
            <div class="wopt-t">${esc(o.t)}</div>
            ${o.s ? `<div class="wopt-s">${esc(o.s)}</div>` : ''}
          </div>
          ${o.r ? `<span class="wopt-r">${esc(o.r)}</span>` : ''}
        </button>`).join('')}
      </div>
      ${needsOther ? `<div class="wiz-other">
        <input id="wizOtherInp" type="${isNumOther ? 'number' : 'text'}" ${isNumOther ? 'min="65" max="999" inputmode="numeric"' : 'maxlength="120"'} placeholder="${esc(otherPh)}" value="${esc(curOtherVal)}">
      </div>` : ''}
      ${extraNote ? `<div class="wiz-note">${esc(extraNote)}</div>` : ''}
      <div class="err" id="wizErr"></div>
      <div class="wiz-nav">
        ${wizStep > 0 ? `<button type="button" class="btn" id="wizPrev">${esc(L.back)}</button>` : ''}
        <button type="button" class="btn p" id="wizNext" ${!curVal ? 'disabled' : ''}>${esc(wizStep === totalSteps - 1 ? L.showResult : L.next)}</button>
      </div>
    </section>
  </div>`;

  $('#app').innerHTML = html;

  $('#wizBackCats').onclick = () => { mode = 'home'; render(); window.scrollTo(0, 0); };
  $('#wizSkip').onclick = () => { activeCat = wizCat; mode = 'cat'; render(); window.scrollTo(0, 0); };

  const setVal = (k, val) => {
    if (isCctv) wizAns[k] = val;
    else { if (!wizExtraAns[wizCat]) wizExtraAns[wizCat] = {}; wizExtraAns[wizCat][k] = val; }
  };
  const getVal = k => isCctv ? wizAns[k] : ((wizExtraAns[wizCat] && wizExtraAns[wizCat][k]) || '');

  const advance = () => {
    const errEl = $('#wizErr');
    const v = getVal(field);
    if (!v) return;
    if (v === '64+' && isNumOther) {
      const num = Math.round(Number(getVal(otherField)));
      if (!Number.isFinite(num) || num < 65) { errEl.textContent = L.wizErrCams; if ($('#wizOtherInp')) $('#wizOtherInp').focus(); return; }
    } else if (v === 'other' && otherField) {
      if (!(getVal(otherField) || '').trim()) { errEl.textContent = L.wizErrOther; if ($('#wizOtherInp')) $('#wizOtherInp').focus(); return; }
    }
    errEl.textContent = '';
    if (wizStep < totalSteps - 1) {
      wizDir = 'next';
      wizStep++;
      render();
      window.scrollTo(0, 0);
    } else {
      buildAllWizAccessories();
      mode = 'wiz_res';
      render();
      window.scrollTo(0, 0);
    }
  };

  $('#app').querySelectorAll('[data-wv]').forEach(b => b.onclick = () => {
    setVal(field, b.dataset.wv);
    if (b.dataset.wv === 'other' || b.dataset.wv === '64+') {
      render();
      if ($('#wizOtherInp')) $('#wizOtherInp').focus();
    } else {
      $('#app').querySelectorAll('[data-wv]').forEach(x => x.classList.remove('on'));
      b.classList.add('on', 'picked');
      setTimeout(advance, 140);
    }
  });

  if ($('#wizOtherInp')) {
    const inp = $('#wizOtherInp');
    inp.oninput = () => { setVal(otherField, inp.value); $('#wizErr').textContent = ''; };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); advance(); } });
  }
  if ($('#wizPrev')) $('#wizPrev').onclick = () => { wizDir = 'prev'; wizStep--; render(); window.scrollTo(0, 0); };
  $('#wizNext').onclick = advance;
}

function renderWizardResults(L) {
  const isCctv = wizCat === 'cctv';
  const catName = (L.cats[wizCat] && L.cats[wizCat].t) || '';
  const pairs = isCctv ? wizSummaryPairs() : extraSummaryPairs(wizCat);
  const selAcc = wizAccDraft.filter(a => a.on && a.qty > 0);
  const resTitle = isCctv ? L.wizResTitle : L.wizCatResTitle(catName);

  let html = `<div class="back-bar">
    <button type="button" class="back-btn" id="resBackCats">${esc(L.backCats)}</button>
    <button type="button" class="skip-link" id="resAllCat">${esc(L.skipToCat)}</button>
  </div>`;

  // 1. Summary card
  html += `<section class="res-sum">
    <div class="res-top">
      <h2>${esc(resTitle)}</h2>
      <button type="button" class="btn sm" id="resRestart">${esc(L.restartWiz)}</button>
    </div>
    <div class="res-tags">
      ${pairs.map(([k, v]) => `<span class="rtag"><b>${esc(k)}:</b>${esc(v)}</span>`).join('')}
    </div>
  </section>`;

  // 2. Auto-calculated accessories card
  html += `<section class="acc-box">
    <div class="acc-hd">
      <div>
        <h3>${esc(L.wizAccTitle)}</h3>
        <div class="acc-sub">${esc(L.wizAccSub)}</div>
      </div>
    </div>
    <div class="acc-list">
      ${wizAccDraft.map((a, idx) => `<div class="acc-row">
        <input type="checkbox" class="acc-chk" data-achk="${idx}" ${a.on ? 'checked' : ''}>
        <div class="acc-info">
          <div class="acc-n">${esc(a.name)}</div>
          <div class="acc-d">${esc(a.desc)}</div>
        </div>
        <div class="qty">
          <button type="button" data-adec="${idx}">−</button>
          <span>${a.qty} ${esc(a.unit)}</span>
          <button type="button" data-ainc="${idx}">+</button>
        </div>
      </div>`).join('')}
    </div>
    <div class="acc-foot">
      <button type="button" class="btn ok" id="addAccBtn" ${selAcc.length ? '' : 'disabled'}>${esc(L.wizAddAcc(selAcc.length))}</button>
      <button type="button" class="btn p" id="sendCalcBtn">${esc(L.wizSendCalc)}</button>
    </div>
  </section>`;

  // 3. Matching catalog items
  if (isCctv) {
    const matched = matchWizProducts();
    const ch = wizNvrChannels();
    if (matched.cams.length) {
      html += `<div class="grp-h">${esc(L.wizGrpCams)}<span>${matched.cams.length}</span></div>`;
      html += '<div class="plist">' + matched.cams.map(productCardHtml).join('') + '</div>';
    }
    if (matched.nvrs.length) {
      html += `<div class="grp-h">${esc(L.wizGrpNvr(ch))}<span>${matched.nvrs.length}</span></div>`;
      html += '<div class="plist">' + matched.nvrs.map(productCardHtml).join('') + '</div>';
    }
    if (matched.extras.length) {
      html += `<div class="grp-h">${esc(L.wizGrpExtra)}<span>${matched.extras.length}</span></div>`;
      html += '<div class="plist">' + matched.extras.map(productCardHtml).join('') + '</div>';
    }
  } else {
    const items = matchExtraProducts(wizCat);
    if (items.length) {
      html += `<div class="grp-h">${esc(L.wizGrpMain)}<span>${items.length}</span></div>`;
      html += '<div class="plist">' + items.map(productCardHtml).join('') + '</div>';
    } else {
      html += `<div class="wiz-note" style="margin-top:0">${esc(L.wizNoCatalogNote)}</div>`;
    }
  }

  $('#app').innerHTML = html;

  $('#resBackCats').onclick = () => { mode = 'home'; render(); window.scrollTo(0, 0); };
  $('#resAllCat').onclick = () => { activeCat = wizCat; mode = 'cat'; render(); window.scrollTo(0, 0); };
  $('#resRestart').onclick = () => { wizStep = 0; wizDir = 'prev'; mode = 'wiz'; render(); window.scrollTo(0, 0); };

  $('#app').querySelectorAll('[data-achk]').forEach(cb => cb.onchange = () => {
    wizAccDraft[Number(cb.dataset.achk)].on = cb.checked;
    render();
  });
  $('#app').querySelectorAll('[data-ainc]').forEach(b => b.onclick = () => {
    const it = wizAccDraft[Number(b.dataset.ainc)];
    const step = it.unit === L.unitM ? 10 : 1;
    it.qty += step;
    it.on = true;
    render();
  });
  $('#app').querySelectorAll('[data-adec]').forEach(b => b.onclick = () => {
    const it = wizAccDraft[Number(b.dataset.adec)];
    const step = it.unit === L.unitM ? 10 : 1;
    it.qty = Math.max(step, it.qty - step);
    render();
  });

  $('#addAccBtn').onclick = () => {
    let added = 0;
    for (const a of wizAccDraft) {
      if (!a.on || a.qty <= 0) continue;
      addToCart({ id: 'wiz_' + a.id, name: a.name, price: 0, unit: a.unit }, a.qty, true);
      added++;
    }
    if (added) { render(); toast(L.wizAccAdded); }
  };

  $('#sendCalcBtn').onclick = () => {
    if (!cart.length) {
      if (isCctv) {
        const sysShort = wizAns.sys === 'analog' ? L.sysAnalogShort : 'IP';
        const brShort = (wizAns.brand && wizAns.brand !== 'any') ? (wizAns.brand === 'other' ? wizAns.brandOther : wizAns.brand) : L.brandRecShort;
        addToCart({ id: 'wiz_kit_' + uid(), name: L.calcOrderItem(wizCamCount(), sysShort, wizMpNum(), brShort || '—'), price: 0, unit: L.unitPcs }, 1, true);
      } else {
        const firstAns = (pairs[0] && pairs[0][1]) || catName;
        addToCart({ id: 'wiz_kit_' + uid(), name: L.wizOrderGen(catName, firstAns), price: 0, unit: L.unitPcs }, 1, true);
      }
      for (const a of wizAccDraft) {
        if (a.on && a.qty > 0) addToCart({ id: 'wiz_' + a.id, name: a.name, price: 0, unit: a.unit }, a.qty, true);
      }
      render();
    }
    openCheckout(wizSummaryComment());
  };

  bindProductCards($('#app'));
}

function renderCatalogView(L) {
  const catInfo = activeCat === 'all' ? { t: L.allCatsTitle } : L.cats[activeCat];
  const catMeta = SHOP_CATS.find(x => x.id === activeCat);
  const pool = activeCat === 'all' ? products : products.filter(p => detectShopCat(p) === activeCat);
  const usedBrands = [...new Set(pool.map(detectBrand).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  if (brandFilter !== 'all' && !usedBrands.includes(brandFilter)) brandFilter = 'all';

  const filtered = getFiltered();
  const shown = filtered.slice(0, pageLimit);
  const rest = filtered.length - shown.length;
  const activeFltCnt = (brandFilter !== 'all' ? 1 : 0) + (stockOnly ? 1 : 0);

  let html = `<div class="back-bar">
    <button type="button" class="back-btn" id="catBack">${esc(L.backCats)}</button>
    ${catMeta && catMeta.hasWiz ? `<button type="button" class="btn p sm" id="catStartWiz">${esc(L.startWizBtn)}</button>` : ''}
  </div>`;

  html += `<div class="sec-head"><h2>${esc(catInfo ? catInfo.t : L.allCatsTitle)}</h2><span>${filtered.length}</span></div>`;

  html += `<div class="toolbar">
    <div class="search-wrap">
      <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="qInp" type="search" placeholder="${esc(L.searchCatPh)}" value="${esc(searchQ)}">
      ${searchQ ? '<button type="button" class="s-clr" id="qClr" aria-label="×">×</button>' : ''}
    </div>
    ${usedBrands.length > 1 || pool.length > 0 ? `<button type="button" class="flt-btn${activeFltCnt ? ' on' : ''}" id="openFltBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      <span>${esc(L.filtersBtn)}</span>
      ${activeFltCnt ? `<span class="flt-cnt">${activeFltCnt}</span>` : ''}
    </button>` : ''}
  </div>`;

  if (activeFltCnt) {
    html += '<div class="active-bar">';
    if (brandFilter !== 'all') html += `<button type="button" class="apill" id="clrBrand">${esc(brandFilter)} ×</button>`;
    if (stockOnly) html += `<button type="button" class="apill" id="clrStock">${esc(L.onlyInStock)} ×</button>`;
    html += `<button type="button" class="apill-reset" id="clrAllFlt">${esc(L.resetFlt)}</button></div>`;
  }

  if (!pool.length) {
    html += `<div class="empty">
      <div>${esc(L.emptyCatalog)}</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn p" id="emptyCustomBtn">${esc(L.addOwnBtn)}</button></div>
    </div>`;
  } else if (!filtered.length) {
    html += `<div class="empty">
      <div>${esc(L.notFound)}</div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button type="button" class="btn" id="emptyResetBtn">${esc(L.resetFlt)}</button>
        <button type="button" class="btn p" id="emptyCustomBtn">${esc(L.addOwnBtn)}</button>
      </div>
    </div>`;
  } else {
    html += '<div class="plist">' + shown.map(productCardHtml).join('') + '</div>';
    if (rest > 0) {
      html += `<div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="btn" id="moreBtn">${esc(L.showMore(rest))}</button></div>`;
    }
  }

  $('#app').innerHTML = html;

  $('#catBack').onclick = () => { mode = 'home'; searchQ = ''; render(); window.scrollTo(0, 0); };
  if ($('#catStartWiz')) $('#catStartWiz').onclick = () => { wizCat = activeCat; wizStep = 0; wizDir = 'next'; mode = 'wiz'; render(); window.scrollTo(0, 0); };
  const qInp = $('#qInp');
  qInp.oninput = () => { searchQ = qInp.value; pageLimit = 30; renderListOnly(); };
  if ($('#qClr')) $('#qClr').onclick = () => { searchQ = ''; pageLimit = 30; render(); };
  if ($('#openFltBtn')) $('#openFltBtn').onclick = () => openFiltersModal(usedBrands);
  if ($('#clrBrand')) $('#clrBrand').onclick = () => { brandFilter = 'all'; pageLimit = 30; render(); };
  if ($('#clrStock')) $('#clrStock').onclick = () => { stockOnly = false; pageLimit = 30; render(); };
  if ($('#clrAllFlt')) $('#clrAllFlt').onclick = () => { brandFilter = 'all'; stockOnly = false; pageLimit = 30; render(); };
  if ($('#emptyResetBtn')) $('#emptyResetBtn').onclick = () => { brandFilter = 'all'; stockOnly = false; searchQ = ''; pageLimit = 30; render(); };
  if ($('#emptyCustomBtn')) $('#emptyCustomBtn').onclick = openCustomModal;
  if ($('#moreBtn')) $('#moreBtn').onclick = () => { pageLimit += 30; render(); };
  bindProductCards($('#app'));
}

function render() {
  applyLangStatic();
  const L = I18N[lang];
  renderCartBar();

  if (orderDone) {
    $('#app').innerHTML = `<section class="ok-panel">
      <div class="ok-head"><span class="ok-badge">✓</span><h2 style="margin:0;font-size:18px">${esc(L.doneTitle)}</h2></div>
      <p style="margin:0 0 12px;color:var(--muted);font-size:14px">${esc(L.doneText(orderDone.name))}</p>
      <div style="border-top:1px solid var(--line)">
        ${orderDone.items.map(it => `<div class="citem"><div class="citem-n">${esc(it.name)} × ${it.qty} ${esc(it.unit || '')}</div><div class="citem-p">${it.price > 0 ? esc(fmtPrice(it.price * it.qty)) : ''}</div></div>`).join('')}
      </div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn" id="backShopBtn">${esc(L.backShop)}</button>
        <a class="btn p" href="client.html">${esc(L.goCab)}</a>
      </div>
    </section>`;
    $('#backShopBtn').onclick = () => { orderDone = null; mode = 'home'; render(); };
    return;
  }

  if (!loaded) {
    $('#app').innerHTML = `<div class="empty">${esc(L.loading)}</div>`;
    return;
  }

  if (mode === 'home') renderHome(L);
  else if (mode === 'wiz') renderWizard(L);
  else if (mode === 'wiz_res') renderWizardResults(L);
  else renderCatalogView(L);
}

function renderListOnly() {
  const pos = $('#qInp') ? $('#qInp').selectionStart : null;
  render();
  const qInp = $('#qInp');
  if (qInp) { qInp.focus(); if (pos !== null) qInp.setSelectionRange(pos, pos); }
}

function openProductModal(p) {
  const L = I18N[lang];
  const ov = document.createElement('div');
  ov.className = 'ov';
  const brand = detectBrand(p);
  const catId = detectShopCat(p);
  const catLbl = (L.cats[catId] && L.cats[catId].t) || '';
  const inStk = p.inStock !== false;

  function draw() {
    const ci = cart.find(x => x.id === p.id);
    const ctrl = ci
      ? `<div class="qty"><button type="button" id="dmDec">−</button><span>${ci.qty}</span><button type="button" id="dmInc">+</button></div>`
      : `<button type="button" class="btn p" id="dmAdd">+ ${esc(L.addCart)}</button>`;
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-hd">
        <h2>${esc(catLbl || L.pageTitle)}</h2>
        <button type="button" class="btn" id="dmClose" aria-label="${esc(L.close)}">×</button>
      </div>
      <div class="det-top">
        ${thumbHtml(p, 'det-thumb')}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:16px;line-height:1.3">${esc(p.name)}</div>
          <div style="margin-top:5px"><span class="sdot ${inStk ? 'ok' : 'warn'}" style="font-size:12.5px">${esc(inStk ? L.inStock : L.byOrder)}</span></div>
        </div>
      </div>
      ${p.desc ? `<div class="det-desc">${esc(p.desc)}</div>` : ''}
      <div>
        ${brand ? `<div class="det-kv"><span>${esc(L.kBrand)}</span><b>${esc(brand)}</b></div>` : ''}
        ${p.sku ? `<div class="det-kv"><span>${esc(L.kSku)}</span><b>${esc(p.sku)}</b></div>` : ''}
        <div class="det-kv"><span>${esc(L.kPrice)}</span><b>${esc(fmtPrice(p.price))}${p.price > 0 && p.unit ? ' / ' + esc(p.unit) : ''}</b></div>
      </div>
      <div class="row" style="justify-content:space-between;align-items:center;margin-top:16px">
        <button type="button" class="btn" id="dmClose2">${esc(L.close)}</button>
        ${ctrl}
      </div>
    </div>`;
    ov.querySelector('#dmClose').onclick = () => ov.remove();
    ov.querySelector('#dmClose2').onclick = () => ov.remove();
    if (ov.querySelector('#dmAdd')) ov.querySelector('#dmAdd').onclick = () => { addToCart(p, 1); draw(); };
    if (ov.querySelector('#dmInc')) ov.querySelector('#dmInc').onclick = () => { addToCart(p, 1); draw(); };
    if (ov.querySelector('#dmDec')) ov.querySelector('#dmDec').onclick = () => { addToCart(p, -1); draw(); };
  }

  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  draw();
}

function openFiltersModal(usedBrands) {
  const L = I18N[lang];
  const ov = document.createElement('div');
  ov.className = 'ov';
  let tmpBrand = brandFilter, tmpStock = stockOnly;

  function draw() {
    const cnt = getFiltered({ brand: tmpBrand, stockOnly: tmpStock }).length;
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-hd">
        <h2>${esc(L.filtersTitle)}</h2>
        <button type="button" class="btn" id="flClose" aria-label="${esc(L.close)}">×</button>
      </div>
      ${usedBrands.length > 1 ? `<div class="fsec">
        <div class="fsec-t">${esc(L.fltBrand)}</div>
        <div class="fpills">
          <button type="button" class="fpill${tmpBrand === 'all' ? ' on' : ''}" data-fb="all">${esc(L.allBrands)}</button>
          ${usedBrands.map(b => `<button type="button" class="fpill${tmpBrand === b ? ' on' : ''}" data-fb="${esc(b)}">${esc(b)}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="fsec">
        <div class="fsec-t">${esc(L.fltStock)}</div>
        <div class="fpills">
          <button type="button" class="fpill${!tmpStock ? ' on' : ''}" data-fs="0">${esc(L.allStock)}</button>
          <button type="button" class="fpill${tmpStock ? ' on' : ''}" data-fs="1">${esc(L.onlyInStock)}</button>
        </div>
      </div>
      <div class="row" style="margin-top:18px">
        <button type="button" class="btn p" id="flApply" style="flex:1">${esc(L.applyFlt(cnt))}</button>
        <button type="button" class="btn" id="flReset">${esc(L.resetFlt)}</button>
      </div>
    </div>`;

    ov.querySelector('#flClose').onclick = () => ov.remove();
    ov.querySelectorAll('[data-fb]').forEach(b => b.onclick = () => { tmpBrand = b.dataset.fb; draw(); });
    ov.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { tmpStock = b.dataset.fs === '1'; draw(); });
    ov.querySelector('#flReset').onclick = () => { tmpBrand = 'all'; tmpStock = false; draw(); };
    ov.querySelector('#flApply').onclick = () => {
      brandFilter = tmpBrand; stockOnly = tmpStock; pageLimit = 30;
      ov.remove();
      render();
    };
  }

  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  draw();
}

function openCustomModal() {
  const L = I18N[lang];
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-hd">
      <h2>${esc(L.customTitle)}</h2>
      <button type="button" class="btn" id="cmClose" aria-label="${esc(L.close)}">×</button>
    </div>
    <div style="color:var(--muted);font-size:13.5px;margin-bottom:8px">${esc(L.customHint)}</div>
    <form id="cmForm">
      <label class="fld" for="cmName">${esc(L.customNameLbl)}</label>
      <input id="cmName" type="text" maxlength="120" required placeholder="${esc(L.customPh)}" value="${esc(searchQ.trim())}">
      <label class="fld" for="cmQty">${esc(L.customQtyLbl)}</label>
      <input id="cmQty" type="number" min="1" max="999" value="1">
      <div class="row" style="margin-top:16px">
        <button type="submit" class="btn p" style="flex:1">${esc(L.customAdd)}</button>
        <button type="button" class="btn" id="cmCancel">${esc(L.close)}</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#cmClose').onclick = close;
  ov.querySelector('#cmCancel').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#cmForm').onsubmit = e => {
    e.preventDefault();
    const nm = (ov.querySelector('#cmName').value || '').trim();
    const qv = Math.max(1, Math.round(Number(ov.querySelector('#cmQty').value) || 1));
    if (nm.length < 2) { ov.querySelector('#cmName').focus(); return; }
    addToCart({ id: 'custom_' + uid(), name: nm, price: 0, unit: L.unitPcs }, qv);
    close();
    toast(L.customAdded);
  };
  ov.querySelector('#cmName').focus();
}

function openCheckout(prefillComment) {
  if (!cart.length) return;
  const L = I18N[lang];
  const ov = document.createElement('div');
  ov.className = 'ov';
  let nameVal = '';
  let commentVal = typeof prefillComment === 'string' && prefillComment ? prefillComment : wizSummaryComment();
  let opSel = '50', opCustom = '', num7 = '';

  function drawSheet() {
    const tot = cartTotal();
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-hd">
        <h2>${esc(L.sheetTitle)}</h2>
        <button type="button" class="btn" data-x aria-label="${esc(L.close)}">×</button>
      </div>
      <div style="border-top:1px solid var(--line)">
        ${cart.map(it => `<div class="citem">
          <div class="citem-n">${esc(it.name)}<div class="citem-p">${it.price > 0 ? esc(fmtPrice(it.price)) + ' × ' + it.qty + ' ' + esc(it.unit || '') + ' = ' + esc(fmtPrice(it.price * it.qty)) : esc(L.priceAsk) + ' · ' + it.qty + ' ' + esc(it.unit || '')}</div></div>
          <div class="qty"><button type="button" data-cdec="${esc(it.id)}">−</button><span>${it.qty}</span><button type="button" data-cinc="${esc(it.id)}">+</button></div>
        </div>`).join('')}
      </div>
      ${tot > 0 ? `<div style="display:flex;justify-content:space-between;padding:10px 0;font-weight:700;font-size:16px"><span>${esc(L.totalLbl)}</span><span>${esc(fmtPrice(tot))}</span></div>` : ''}
      <form id="ordForm">
        <label class="fld" for="o-name">${esc(L.nameLbl)}</label>
        <input id="o-name" name="name" type="text" autocomplete="name" maxlength="120" required placeholder="${esc(L.namePh)}" value="${esc(nameVal)}">
        <label class="fld" for="o-num">${esc(L.phoneLbl)}</label>
        <div class="ph-row">
          <div class="ph-cc">+994</div>
          <select id="o-op" class="ph-op">${OP_CODES.map(c => `<option value="${c}"${opSel === c ? ' selected' : ''}>${c}</option>`).join('')}<option value="__other"${opSel === '__other' ? ' selected' : ''}>${esc(L.otherOp)}</option></select>
          <input id="o-opc" class="ph-op-c" type="tel" inputmode="numeric" maxlength="2" placeholder="XX" value="${esc(opCustom)}" ${opSel === '__other' ? '' : 'hidden'}>
          <input id="o-num" class="ph-num" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="123 45 67" value="${esc(fmt7(num7))}">
        </div>
        <label class="fld" for="o-comm">${esc(L.commentLbl)}</label>
        <textarea id="o-comm" name="comment" maxlength="400" placeholder="${esc(L.commentPh)}">${esc(commentVal)}</textarea>
        <div class="err" id="o-err"></div>
        <div class="row">
          <button type="submit" class="btn p" id="o-send" style="flex:1">${esc(L.sendOrder)}</button>
          <button type="button" class="btn" data-x2>${esc(L.close)}</button>
        </div>
      </form>
    </div>`;

    ov.querySelector('[data-x]').onclick = () => ov.remove();
    ov.querySelector('[data-x2]').onclick = () => ov.remove();
    ov.querySelector('#o-name').oninput = e => { nameVal = e.target.value; };
    ov.querySelector('#o-comm').oninput = e => { commentVal = e.target.value; };
    ov.querySelectorAll('[data-cinc]').forEach(b => b.onclick = () => {
      const it = cart.find(x => x.id === b.dataset.cinc);
      if (it) { it.qty++; renderCartBar(); drawSheet(); }
    });
    ov.querySelectorAll('[data-cdec]').forEach(b => b.onclick = () => {
      const i = cart.findIndex(x => x.id === b.dataset.cdec);
      if (i >= 0) {
        cart[i].qty--;
        if (cart[i].qty <= 0) cart.splice(i, 1);
        render();
        if (!cart.length) ov.remove(); else drawSheet();
      }
    });

    const op = ov.querySelector('#o-op'), opc = ov.querySelector('#o-opc'), num = ov.querySelector('#o-num');
    op.onchange = () => { opSel = op.value; opc.hidden = opSel !== '__other'; if (!opc.hidden) opc.focus(); };
    opc.oninput = () => { opc.value = opc.value.replace(/\D/g, '').slice(0, 2); opCustom = opc.value; };
    num.oninput = () => {
      const digits = num.value.replace(/\D/g, '');
      if (digits.length >= 9) {
        const last9 = digits.slice(-9), p2 = last9.slice(0, 2), p7 = last9.slice(2);
        if (OP_CODES.includes(p2)) { opSel = p2; op.value = p2; opc.hidden = true; }
        else { opSel = '__other'; op.value = '__other'; opCustom = p2; opc.value = p2; opc.hidden = false; }
        num7 = p7; num.value = fmt7(p7);
      } else {
        num7 = digits.slice(0, 7); num.value = fmt7(num7);
      }
    };

    ov.querySelector('#ordForm').onsubmit = async e => {
      e.preventDefault();
      const errEl = ov.querySelector('#o-err');
      const sendBtn = ov.querySelector('#o-send');
      const name = ov.querySelector('#o-name').value.trim();
      const opCode = opSel === '__other' ? opCustom.replace(/\D/g, '').slice(0, 2) : opSel;
      const comment = ov.querySelector('#o-comm').value.trim().slice(0, 400);
      if (!cart.length) { errEl.textContent = L.errCart; return; }
      if (name.length < 2) { errEl.textContent = L.errName; return; }
      if (opCode.length !== 2) { errEl.textContent = L.errOp; return; }
      if (num7.length !== 7) { errEl.textContent = L.errPhone; return; }
      errEl.textContent = '';
      sendBtn.disabled = true;
      sendBtn.textContent = L.sending;
      const payload = {
        name,
        phone: `+994 ${opCode} ${fmt7(num7)}`,
        lang,
        items: cart.map(it => ({ name: it.name, qty: it.qty, price: Number(it.price) || 0, unit: it.unit || 'шт.' })),
        total: cartTotal(),
        comment,
        status: 'new',
        created: Date.now()
      };
      try {
        await setDoc(doc(db, 'orders', uid()), payload);
        orderDone = payload;
        cart = [];
        ov.remove();
        render();
        window.scrollTo(0, 0);
      } catch (ex) {
        errEl.textContent = L.errSend;
        sendBtn.disabled = false;
        sendBtn.textContent = L.sendOrder;
      }
    };
  }

  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  drawSheet();
}

$('#homeBrand').onclick = () => { orderDone = null; mode = 'home'; searchQ = ''; render(); window.scrollTo(0, 0); };
$('#openCartBtn').onclick = () => openCheckout();
$('#hdrCartBtn').onclick = () => openCheckout();
$('#hdrCustomBtn').onclick = openCustomModal;
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
  if (mode === 'wiz_res') buildAllWizAccessories();
  render();
});

(async () => {
  render();
  try {
    const snap = await getDoc(doc(db, 'pub', 'catalog'));
    if (snap.exists() && Array.isArray(snap.data().items)) {
      products = snap.data().items;
    }
  } catch (e) {}
  loaded = true;
  render();
})();
</script>
</body>
