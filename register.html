<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müştəri qeydiyyatı — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0f16">
<style>
:root{--accent:#f03e38;--accent2:#c81914;--ok:#10c988;--blue:#60a5fa;--text:#f3f5f9;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.13);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:#0c0f16;color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 36px;max-width:680px;margin-inline:auto;overflow-x:clip}

/* Animated Tech Background (iOS-safe SMIL + GPU orbs) */
.reg-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 15% 15%,rgba(229,37,32,.22),transparent 65%),radial-gradient(ellipse 75% 65% at 88% 82%,rgba(37,99,235,.18),transparent 65%),linear-gradient(155deg,#0b0e15 0%,#141520 48%,#0f0d14 100%)}
.reg-bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.42}
.bg-orb{position:absolute;border-radius:50%;filter:blur(54px);opacity:.26;will-change:transform}
.bg-orb.o1{width:340px;height:340px;background:#e52520;top:-90px;left:-80px;-webkit-animation:orbF1 15s ease-in-out infinite;animation:orbF1 15s ease-in-out infinite}
.bg-orb.o2{width:380px;height:380px;background:#2563eb;bottom:-110px;right:-90px;-webkit-animation:orbF2 18s ease-in-out infinite;animation:orbF2 18s ease-in-out infinite}
@-webkit-keyframes orbF1{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1)}50%{-webkit-transform:translate3d(55px,42px,0) scale(1.12)}}
@keyframes orbF1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(55px,42px,0) scale(1.12)}}
@-webkit-keyframes orbF2{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1)}50%{-webkit-transform:translate3d(-50px,-38px,0) scale(1.1)}}
@keyframes orbF2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-50px,-38px,0) scale(1.1)}}

/* Floating minimal top bar: logo + AZ/RU only */
header,main{position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;box-shadow:0 4px 14px rgba(229,37,32,.34);text-decoration:none;flex:none}
.logo svg{width:25px;height:25px;display:block}
.lang{display:flex;border:1px solid rgba(255,255,255,.15);border-radius:20px;overflow:hidden;background:rgba(20,24,35,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:rgba(255,255,255,.72);padding:5px 10px;border-radius:16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.flag{width:16px;height:11px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

/* Centered frosted glass stage */
.reg-stage{min-height:calc(100dvh - 100px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 16px}
.reg-card{position:relative;width:100%;max-width:560px;background:rgba(20,24,35,.76);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:24px 20px 22px;box-shadow:0 24px 64px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden}
.reg-card::before{content:'';position:absolute;left:18%;right:18%;top:0;height:2px;background:linear-gradient(90deg,transparent,#f03e38,transparent);opacity:.9}
.reg-body{will-change:transform,opacity}
.reg-body.in-next{-webkit-animation:stepInNext .3s cubic-bezier(.22,.9,.32,1) both;animation:stepInNext .3s cubic-bezier(.22,.9,.32,1) both}
.reg-body.in-prev{-webkit-animation:stepInPrev .3s cubic-bezier(.22,.9,.32,1) both;animation:stepInPrev .3s cubic-bezier(.22,.9,.32,1) both}
@-webkit-keyframes stepInNext{from{opacity:0;-webkit-transform:translate3d(18px,0,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes stepInNext{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@-webkit-keyframes stepInPrev{from{opacity:0;-webkit-transform:translate3d(-18px,0,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes stepInPrev{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* Segmented 5-step progress indicator */
.seg-prog{display:flex;align-items:center;gap:6px;margin-bottom:20px}
.seg-bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.seg-bar.done{background:var(--accent)}
.seg-bar.cur{background:linear-gradient(90deg,#f03e38,#ff7670);box-shadow:0 0 10px rgba(240,62,56,.55)}
.seg-lbl{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.55);margin-left:6px;white-space:nowrap}

/* Step header emblem + title */
.step-emblem{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,#f03e38,#b81410);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(229,37,32,.38)}
.step-emblem svg{width:32px;height:32px;display:block}
h2{margin:0 0 4px;font-size:20px;font-weight:700;text-align:center;color:#fff;line-height:1.28}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.4}

/* Form fields */
label.fld{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.56);margin:14px 0 7px}
input.g-inp{width:100%;height:46px;font:inherit;font-size:15.5px;color:#fff;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:12px;padding:0 14px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s}
input.g-inp::placeholder{color:rgba(255,255,255,.35)}
input.g-inp:focus{border-color:#f03e38;background:rgba(240,62,56,.11);box-shadow:0 0 0 3px rgba(240,62,56,.26)}

/* +994 prefix + Operator dropdown + 7 glowing dark glass digit boxes */
.ph-top{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.ph-prefix{flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 13px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:15.5px}
.ph-op-sel{flex:1;height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}
.ph-op-sel option{background:#181c26;color:#f3f5f9}
.ph-op-sel:focus,.ph-top input.ph-op-c:focus{border-color:#f03e38;box-shadow:0 0 0 3px rgba(240,62,56,.28)}
.ph-top input.ph-op-c{flex:none;width:68px;height:44px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:#fff;font:inherit;font-size:16px;font-weight:700;text-align:center;outline:none}

.digits-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.digits-row.shake{-webkit-animation:regShake .42s ease;animation:regShake .42s ease}
@-webkit-keyframes regShake{0%,100%{-webkit-transform:translateX(0)}20%,60%{-webkit-transform:translateX(-7px)}40%,80%{-webkit-transform:translateX(7px)}}
@keyframes regShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.d-sep{width:6px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);flex:none}
.digits-row input.dbox{width:100%;min-width:0;flex:1;height:50px;padding:0;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#ffffff;font:inherit;font-size:20px;font-weight:700;text-align:center;caret-color:#f03e38;outline:none;transition:transform .16s cubic-bezier(.22,.9,.32,1),border-color .16s,box-shadow .16s,background .16s;-webkit-appearance:none;appearance:none}
.digits-row input.dbox:focus{border-color:#f03e38;background:rgba(240,62,56,.16);box-shadow:0 0 0 4px rgba(240,62,56,.28),0 6px 18px rgba(229,37,32,.25);-webkit-transform:translateY(-2px) scale(1.05);transform:translateY(-2px) scale(1.05);z-index:2}
.digits-row input.dbox.filled{border-color:rgba(240,62,56,.68);background:rgba(255,255,255,.13)}
.digits-row input.dbox.pop{-webkit-animation:dPop .2s ease;animation:dPop .2s ease}
@-webkit-keyframes dPop{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.1)}100%{-webkit-transform:scale(1)}}
@keyframes dPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}

/* Glass Option Cards */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.055);cursor:pointer;user-select:none;transition:all .15s ease;-webkit-animation:optIn .28s cubic-bezier(.22,.9,.32,1) both;animation:optIn .28s cubic-bezier(.22,.9,.32,1) both;-webkit-animation-delay:calc(var(--i,0) * 28ms);animation-delay:calc(var(--i,0) * 28ms)}
@-webkit-keyframes optIn{from{opacity:0;-webkit-transform:translate3d(0,8px,0)}to{opacity:1;-webkit-transform:translate3d(0,0,0)}}
@keyframes optIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.opt.on{background:rgba(240,62,56,.18);border-color:#f03e38;box-shadow:0 4px 16px rgba(229,37,32,.2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-chk{width:20px;height:20px;flex:none;margin-top:1px;border-radius:6px;border:1.8px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:transparent;transition:all .15s}
.opt-chk.rad{border-radius:50%}
.opt.on .opt-chk{background:#f03e38;border-color:#f03e38;color:#fff}
.opt-t{font-size:14.5px;font-weight:600;line-height:1.35;color:#fff}
.opt-d{display:block;font-size:12.5px;font-weight:400;color:rgba(255,255,255,.6);margin-top:2px}
.other-wrap{margin-top:10px}

.err{color:#ff6b6b;font-size:13px;font-weight:500;text-align:center;margin-top:12px;min-height:18px}
.nav-row{display:flex;gap:10px;margin-top:14px}
.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;height:46px;padding:0 16px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:#fff;flex:1;box-shadow:0 6px 18px rgba(229,37,32,.34)}
.btn:disabled{opacity:.5;cursor:default}

.card-foot{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,.45)}
.card-foot a{color:#ff6b66;text-decoration:none;font-weight:600}
.card-foot a:hover{text-decoration:underline}

/* Submitting overlay & Success screen */
.reg-ov{position:absolute;inset:0;z-index:5;background:rgba(15,19,28,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.reg-ov svg{width:64px;height:64px;display:block}
.ok-icon{width:64px;height:64px;margin:0 auto 12px}
.ok-icon svg{width:64px;height:64px;display:block}
.sum{margin-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.sum-row{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px}
.sum-k{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em}
.sum-v{font-weight:600;color:#fff}

/* Responsive */
@media (max-width:420px){
  body{padding:0 10px 30px;font-size:14.5px}
  .reg-card{padding:20px 14px 18px;border-radius:18px}
  h2{font-size:18.5px}
  .digits-row{gap:4px}
  .d-sep{width:4px}
  .digits-row input.dbox{height:45px;font-size:18.5px;border-radius:10px}
}
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(1.08)}
  .opt:not(.on):hover{border-color:rgba(240,62,56,.5);background:rgba(255,255,255,.085)}
}
@media (min-width:680px){
  body{max-width:860px;padding:6px 24px 48px}
  .reg-card{max-width:620px;padding:30px 30px 26px}
  h2{font-size:22px}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opt{height:100%}
  .sum-row{flex-direction:row;justify-content:space-between;align-items:baseline;gap:16px}
  .sum-v{text-align:right}
}
@media (min-width:1920px){
  body{max-width:1040px;font-size:16.5px}
  .reg-card{max-width:720px;padding:36px 36px 30px}
  .digits-row input.dbox{height:56px;font-size:23px}
}
@media (min-width:2400px){
  body{max-width:1200px;font-size:18px}
  .reg-card{max-width:780px}
}
</style>
</head>

</div>

  <a class="logo" href="client.html" aria-label="Techmaster">

<main class="reg-stage" id="app"></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-lite.js';
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const OP_CODES = ['50', '51', '55', '99', '70', '77', '10'];
const OP_NAMES = { '50': '050 · Azercell', '51': '051 · Azercell', '55': '055 · Bakcell', '99': '099 · Bakcell', '70': '070 · Nar', '77': '077 · Nar', '10': '010 · Azercell' };

const I18N = {
  ru: {
    pageTitle: 'Регистрация',

function fmt7(d) {
  const s = String(d || '').replace(/\D/g, '').slice(0, 7);
  if (s.length <= 3) return s;
  if (s.length <= 5) return s.slice(0, 3) + ' ' + s.slice(3);
  return s.slice(0, 3) + ' ' + s.slice(3, 5) + ' ' + s.slice(5);
}

function getOp() {
  return state.opSel === '__other' ? state.opCustom.replace(/\D/g, '').slice(0, 2) : state.opSel;
}

function fullPhone() {
  return `+994 ${getOp()} ${fmt7(state.num7)}`;
}

function labelOf(list, id, otherText) {
  if (id === 'other') return otherText ? `${I18N[lang].otherLabel}: ${otherText}` : I18N[lang].otherLabel;
  const item = list.find(x => x.id === id);
  return item ? item.t : id;
}

function progressHtml() {
  let bars = '';

    bars += `<div class="seg-bar${cls}"></div>`;
  }
  return `<div class="seg-prog">${bars}<span class="seg-lbl">${step} / ${TOTAL}</span></div>`;
}

function applyLangUI() {
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.title = L.pageTitle + ' — Techmaster';
  $('#btn-ru').classList.toggle('on', lang === 'ru');
  $('#btn-az').classList.toggle('on', lang === 'az');
}

function render(animate = true) {
  applyLangUI();
  const L = I18N[lang];
  if (done) {
    $('#app').innerHTML = doneHtml();
    $('#resetBtn').onclick = () => {
      state.name = ''; state.opSel = '50'; state.opCustom = ''; state.num7 = '';
      state.objects = []; state.objectsOther = '';
      state.role = ''; state.roleOther = '';
      state.services = []; state.servicesOther = '';
      state.categories = []; state.categoriesOther = '';
      step = 1; stepDir = 'next'; done = false; errMsg = '';
      render(true);
    };
    return;
  }

  let inner = '';
  if (step === 1) inner = step1Html();
  else if (step === 2) inner = multiStepHtml(2, L.step2Title, L.objects, state.objects, state.objectsOther, L.step2OtherPh);
  else if (step === 3) inner = singleStepHtml(3, L.step3Title, L.roles, state.role, state.roleOther, L.step3OtherPh);
  else if (step === 4) inner = multiStepHtml(4, L.step4Title, L.services, state.services, state.servicesOther, L.step4OtherPh);
  else if (step === 5) inner = multiStepHtml(5, L.step5Title, L.categories, state.categories, state.categoriesOther, L.step5OtherPh);

  const animCls = animate ? (stepDir === 'prev' ? ' in-prev' : ' in-next') : '';
  const ovHtml = busy ? `<div class="reg-ov">
    <svg viewBox="0 0 68 68" fill="none">
      <circle cx="34" cy="34" r="28" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
      <circle cx="34" cy="34" r="28" stroke="#f03e38" stroke-width="4" stroke-linecap="round" stroke-dasharray="56 125">
        <animateTransform attributeName="transform" type="rotate" from="0 34 34" to="360 34 34" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div style="font-size:16px;font-weight:700">${esc(L.sending)}</div>
  </div>` : '';

  $('#app').innerHTML = `<section class="reg-card">
    ${progressHtml()}
    <div class="reg-body${animCls}">${inner}</div>
    ${ovHtml}
  </section>`;

  wireStep();
}

function wireStep() {
  if (step === 1) {
    const nm = $('#f-name'), op = $('#f-op'), opc = $('#f-op-c');
    const boxes = [...document.querySelectorAll('.dbox')];

    const syncDigits = () => {
      state.num7 = boxes.map(b => (b.value || '').replace(/\D/g, '').slice(0, 1)).join('');
    };
    const fillFromRaw = raw => {
      const digits = String(raw || '').replace(/\D/g, '');
      let d7 = '';
      if (digits.length >= 9) {
        const last9 = digits.slice(-9), p2 = last9.slice(0, 2);
        d7 = last9.slice(2);
        if (OP_CODES.includes(p2)) { state.opSel = p2; op.value = p2; opc.hidden = true; }
        else { state.opSel = '__other'; op.value = '__other'; state.opCustom = p2; opc.value = p2; opc.hidden = false; }
      } else {
        d7 = digits.slice(0, 7);
      }
      state.num7 = d7;
      boxes.forEach((b, i) => { b.value = d7[i] || ''; b.classList.toggle('filled', Boolean(d7[i])); });
      if (d7.length < 7) boxes[d7.length].focus();
      else boxes[6].focus();
    };

    nm.oninput = () => { state.name = nm.value; clearErr(); };
    nm.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); boxes[0].focus(); } });

    op.onchange = () => {
      state.opSel = op.value;
      opc.hidden = op.value !== '__other';
      clearErr();
      if (!opc.hidden) opc.focus(); else (boxes.find(b => !b.value) || boxes[0]).focus();
    };
    opc.oninput = () => {
      opc.value = opc.value.replace(/\D/g, '').slice(0, 2);
      state.opCustom = opc.value;
      clearErr();
      if (opc.value.length === 2) (boxes.find(b => !b.value) || boxes[0]).focus();
    };

    boxes.forEach((box, idx) => {
      box.addEventListener('focus', () => { setTimeout(() => { try { box.select(); } catch (e) {} }, 0); });
      box.addEventListener('input', () => {
        clearErr();
        const digits = (box.value || '').replace(/\D/g, '');
        if (digits.length > 1) { fillFromRaw(digits); return; }
        box.value = digits;
        box.classList.toggle('filled', Boolean(digits));
        if (digits) {
          box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
          syncDigits();
          if (idx < 6) boxes[idx + 1].focus();
        } else {
          syncDigits();
        }
      });
      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace') {
          if (!box.value && idx > 0) {
            e.preventDefault();
            boxes[idx - 1].value = '';
            boxes[idx - 1].classList.remove('filled');
            boxes[idx - 1].focus();
            syncDigits();
          }
        } else if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); boxes[idx - 1].focus(); }
        else if (e.key === 'ArrowRight' && idx < 6) { e.preventDefault(); boxes[idx + 1].focus(); }
        else if (e.key === 'Enter') { e.preventDefault(); goNext(); }
      });
      box.addEventListener('paste', e => {
        const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
        const d = txt.replace(/\D/g, '');
        if (d.length >= 2) { e.preventDefault(); fillFromRaw(d); }
      });
    });
  } else {
    const keyMap = { 2: ['objects', 'objectsOther', true], 3: ['role', 'roleOther', false], 4: ['services', 'servicesOther', true], 5: ['categories', 'categoriesOther', true] };
    const [field, otherField, isMulti] = keyMap[step];
    const otherWrap = $('.other-wrap');
    const otherInp = $('#otherInp');
    document.querySelectorAll('[data-opt]').forEach(inp => {
      inp.onchange = () => {
        const id = inp.dataset.opt;
        if (isMulti) {
          if (inp.checked) { if (!state[field].includes(id)) state[field].push(id); }
          else state[field] = state[field].filter(x => x !== id);
          inp.closest('.opt').classList.toggle('on', inp.checked);
          const showO = state[field].includes('other');
          otherWrap.hidden = !showO;
          if (showO && id === 'other') otherInp.focus();
        } else {
          state[field] = id;
          document.querySelectorAll('.opt').forEach(el => el.classList.remove('on'));
          inp.closest('.opt').classList.add('on');
          const showO = id === 'other';
          otherWrap.hidden = !showO;
          if (showO) otherInp.focus();
        }
        clearErr();
      };
    });
    if (otherInp) {
      otherInp.oninput = () => { state[otherField] = otherInp.value; clearErr(); };
      otherInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goNext(); } });
    }
  }

  const prev = $('#prevBtn');
  if (prev) prev.onclick = () => { errMsg = ''; stepDir = 'prev'; step--; render(true); window.scrollTo(0, 0); };
  $('#nextBtn').onclick = goNext;
}

function clearErr() {
  if (!errMsg) return;
  errMsg = '';
  const el = $('#err');
  if (el) el.textContent = '';
}

function setErr(m) {
  errMsg = m;
  const el = $('#err');
  if (el) el.textContent = m;
}

function shakeDigits() {
  const r = $('#digitsRow');
  if (!r) return;
  r.classList.remove('shake');
  void r.offsetWidth;
  r.classList.add('shake');
}

function validateStep() {
  const L = I18N[lang];
  if (step === 1) {
    if (state.name.trim().length < 2) { setErr(L.errName); $('#f-name').focus(); return false; }
    if (getOp().length !== 2) { setErr(L.errOp); (state.opSel === '__other' ? $('#f-op-c') : $('#f-op')).focus(); return false; }
    if (state.num7.length !== 7) {
      setErr(L.errPhone);
      shakeDigits();
      const boxes = [...document.querySelectorAll('.dbox')];
      (boxes.find(b => !b.value) || boxes[0]).focus();
      return false;
    }
    return true;
  }
  if (step === 2) {
    if (!state.objects.length) { setErr(L.errPickOne); return false; }
    if (state.objects.includes('other') && !state.objectsOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 3) {
    if (!state.role) { setErr(L.errPickRole); return false; }
    if (state.role === 'other' && !state.roleOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 4) {
    if (!state.services.length) { setErr(L.errPickOne); return false; }
    if (state.services.includes('other') && !state.servicesOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 5) {
    if (!state.categories.length) { setErr(L.errPickOne); return false; }
    if (state.categories.includes('other') && !state.categoriesOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  return true;
}

async function goNext() {
  if (busy) return;
  if (!validateStep()) return;
  errMsg = '';
  if (step < TOTAL) {
    stepDir = 'next';
    step++;
    render(true);
    window.scrollTo(0, 0);
    return;
  }
  busy = true;
  render(false);
  const payload = {
    name: state.name.trim(),
    phone: fullPhone(),
    lang,
    objects: [...state.objects],
    objectsOther: state.objects.includes('other') ? state.objectsOther.trim() : '',
    role: state.role,
    roleOther: state.role === 'other' ? state.roleOther.trim() : '',
    services: [...state.services],
    servicesOther: state.services.includes('other') ? state.servicesOther.trim() : '',
    categories: [...state.categories],
    categoriesOther: state.categories.includes('other') ? state.categoriesOther.trim() : '',
    status: 'new',
    created: Date.now()
  };
  try {
    await setDoc(doc(db, 'requests', uid()), payload);
    done = true;
  } catch (e) {
    errMsg = I18N[lang].errSend;
  } finally {
    busy = false;
    render(false);
    window.scrollTo(0, 0);
  }
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    lang = btn.dataset.lang;
    errMsg = '';
    render(false);
  };
});

render(true);
</script>
</body>
</html>
