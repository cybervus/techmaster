<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Регистрация клиента — Techmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--text:#1e242b;--muted:#7b8494;--line:#eceef2;--accent:#e52520;--on:#ffffff;--danger:#e52520;--ok:#00b578;--soft:#fdecec;--sh:0 2px 10px rgba(15,23,42,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--soft:#331819;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#191c22;--text:#f1f3f6;--muted:#8e97a6;--line:#272c35;--accent:#f03e38;--on:#ffffff;--danger:#f03e38;--ok:#10c988;--soft:#331819;--sh:0 2px 12px rgba(0,0,0,.35);color-scheme:dark}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:0 14px 48px;max-width:600px;margin-inline:auto;overflow-x:clip}
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{margin:0;line-height:0;flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f03e38,#c81914);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(229,37,32,.25)}
.logo svg{width:26px;height:26px;display:block}
h1{font-size:18px;font-weight:700;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);flex:none;padding:2px}
.lang button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on)}
.flag{width:16px;height:11px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.prog{margin:12px 0 14px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.prog-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#f03e38,#d61c17);border-radius:6px;transition:width .22s ease}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--sh)}
h2{margin:0 0 4px;font-size:18px;font-weight:700;line-height:1.3}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=tel],select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(229,37,32,.12)}
.ph-row{display:flex;gap:8px;align-items:stretch}
.ph-cc{flex:none;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-weight:700;font-size:16px}
.ph-op{flex:none;width:82px;text-align:center;font-weight:600}
.ph-op-c{flex:none;width:62px;text-align:center}
.ph-num{flex:1;min-width:0;letter-spacing:.03em}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;user-select:none;transition:all .15s ease}
.opt.on{background:var(--soft);border-color:var(--accent)}
.opt input{flex:none;width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.opt-t{font-size:15px;font-weight:600;line-height:1.35}
.opt-d{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.other-wrap{margin-top:10px}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
.nav-row{display:flex;gap:10px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:11px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.p{background:linear-gradient(135deg,#f03e38,#d61c17);border-color:transparent;color:var(--on);flex:1;box-shadow:0 3px 10px rgba(229,37,32,.24)}
.btn:disabled{opacity:.55;cursor:default}
.ok-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ok-badge{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sum{margin-top:14px;border-top:1px solid var(--line)}
.sum-row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-k{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sum-v{font-weight:600}
/* Responsive: small phones */
@media (max-width:420px){
  body{padding:0 10px 44px;font-size:14.5px}
  header{margin:0 -10px 10px;padding:10px;gap:8px}
  .logo{width:36px;height:36px}
  h1{font-size:16px}
  .panel{padding:15px 12px}
  .ph-row{gap:5px}
  .ph-cc{padding:0 9px;font-size:14.5px}
  .ph-op{width:70px}
  .ph-op-c{width:52px}
  .nav-row{flex-wrap:wrap}
}
/* Responsive: hover feedback on desktop/mouse */
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(.96)}
  .btn.p:not(:disabled):hover{filter:brightness(1.05)}
  .opt:hover{border-color:var(--accent)}
}
/* Responsive: tablets & laptops (700px+) */
@media (min-width:700px){
  body{max-width:760px;padding:14px 24px 64px}
  header{margin:0 0 18px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);top:14px}
  .panel{padding:26px 28px}
  h2{font-size:20px}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opt{height:100%}
  .sum-row{flex-direction:row;justify-content:space-between;align-items:baseline;gap:16px}
  .sum-v{text-align:right}
}
/* Responsive: desktops (1280px+) */
@media (min-width:1280px){
  body{max-width:840px;padding-top:20px}
  .panel{padding:30px 34px}
}
/* Responsive: Full HD+ / large monitors & TVs (1920px+) */
@media (min-width:1920px){
  body{max-width:960px;font-size:16.5px;padding-top:28px}
  .logo{width:46px;height:46px}
  h1{font-size:21px}
  h2{font-size:22px}
  .btn{font-size:16px;padding:13px 20px}
}
/* Responsive: 4K monitors & large TVs (2400px+) */
@media (min-width:2400px){
  body{max-width:1100px;font-size:18px}
}
</style>
</head>

let lang = (() => {
  try {
    const saved = localStorage.getItem('tm-reg-lang');
    if (saved === 'ru' || saved === 'az') return saved;
  } catch (e) {}
  return (navigator.language || '').toLowerCase().startsWith('az') ? 'az' : 'ru';
})();

const TOTAL = 5;
let step = 1;
let done = false;
let busy = false;
let errMsg = '';

const state = {
  name: '',
  opSel: '50',
  opCustom: '',
  num7: '',
  objects: [],
  objectsOther: '',
  role: '',
  roleOther: '',
  services: [],
  servicesOther: '',
  categories: [],
  categoriesOther: ''
};

function fmt7(d) {
  const s = String(d || '').replace(/\D/g, '').slice(0, 7);
  if (s.length <= 3) return s;
  if (s.length <= 5) return s.slice(0, 3) + ' ' + s.slice(3);
  return s.slice(0, 3) + ' ' + s.slice(3, 5) + ' ' + s.slice(5);
}

function getOp() {
  return state.opSel === '__other' ? state.opCustom.replace(/\D/g, '').slice(0, 2) : state.opSel;
}

function fullPhone() {
  return `+994 ${getOp()} ${fmt7(state.num7)}`;
}

function labelOf(list, id, otherText) {
  if (id === 'other') return otherText ? `${I18N[lang].otherLabel}: ${otherText}` : I18N[lang].otherLabel;
  const item = list.find(x => x.id === id);
  return item ? item.t : id;
}

function applyLangUI() {
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.title = L.pageTitle + ' — Techmaster';
  $('#htitle').textContent = L.pageTitle;
  $('#btn-ru').classList.toggle('on', lang === 'ru');
  $('#btn-az').classList.toggle('on', lang === 'az');
}

function renderProgress() {
  const L = I18N[lang];
  const prog = $('#prog');
  if (done) { prog.hidden = true; return; }
  prog.hidden = false;
  const pct = Math.round((step / TOTAL) * 100);
  $('#stepLbl').textContent = L.stepOf(step, TOTAL);
  $('#stepPct').textContent = pct + '%';
  $('#stepFill').style.width = pct + '%';
}

function multiStepHtml(title, list, selected, otherVal, otherPh) {
  const L = I18N[lang];
  const hasOther = selected.includes('other');
  return `<section class="panel">
    <h2>${esc(title)}</h2>
    <p class="hint">${esc(L.multiHint)}</p>
    <div class="opts">${list.map(o => {
      const on = selected.includes(o.id);
      return `<label class="opt${on ? ' on' : ''}">
        <input type="checkbox" data-opt="${o.id}" ${on ? 'checked' : ''}>
        <span class="opt-t">${esc(o.t)}${o.d ? `<span class="opt-d">${esc(o.d)}</span>` : ''}</span>
      </label>`;
    }).join('')}</div>
    <div class="other-wrap" ${hasOther ? '' : 'hidden'}>
      <input type="text" id="otherInp" maxlength="200" placeholder="${esc(otherPh)}" value="${esc(otherVal)}">
    </div>
    <div class="err" id="err">${esc(errMsg)}</div>
    ${navButtonsHtml()}
  </section>`;
}

function singleStepHtml(title, list, selected, otherVal, otherPh) {
  const L = I18N[lang];
  const hasOther = selected === 'other';
  return `<section class="panel">
    <h2>${esc(title)}</h2>
    <p class="hint">${esc(L.singleHint)}</p>
    <div class="opts">${list.map(o => {
      const on = selected === o.id;
      return `<label class="opt${on ? ' on' : ''}">
        <input type="radio" name="singleOpt" data-opt="${o.id}" ${on ? 'checked' : ''}>
        <span class="opt-t">${esc(o.t)}${o.d ? `<span class="opt-d">${esc(o.d)}</span>` : ''}</span>
      </label>`;
    }).join('')}</div>
    <div class="other-wrap" ${hasOther ? '' : 'hidden'}>
      <input type="text" id="otherInp" maxlength="200" placeholder="${esc(otherPh)}" value="${esc(otherVal)}">
    </div>
    <div class="err" id="err">${esc(errMsg)}</div>
    ${navButtonsHtml()}
  </section>`;
}

function navButtonsHtml() {
  const L = I18N[lang];
  const nextText = step === TOTAL ? (busy ? L.sending : L.submit) : L.next;
  return `<div class="nav-row">
    ${step > 1 ? `<button type="button" class="btn" id="prevBtn" ${busy ? 'disabled' : ''}>${esc(L.back)}</button>` : ''}
    <button type="button" class="btn p" id="nextBtn" ${busy ? 'disabled' : ''}>${esc(nextText)}</button>
  </div>`;
}

function step1Html() {
  const L = I18N[lang];
  const isCustom = state.opSel === '__other';
  return `<section class="panel">
    <h2>${esc(L.step1Title)}</h2>
    <p class="hint">${esc(L.step1Hint)}</p>
    <label class="fld" for="f-name">${esc(L.nameLabel)}</label>
    <input id="f-name" type="text" autocomplete="name" maxlength="120" placeholder="${esc(L.namePh)}" value="${esc(state.name)}">
    <label class="fld" for="f-num">${esc(L.phoneLabel)}</label>
    <div class="ph-row">
      <div class="ph-cc">+994</div>
      <select id="f-op" class="ph-op" aria-label="Код оператора">
        ${OP_CODES.map(c => `<option value="${c}"${state.opSel === c ? ' selected' : ''}>${c}</option>`).join('')}
        <option value="__other"${isCustom ? ' selected' : ''}>${esc(L.otherOp)}</option>
      </select>
      <input id="f-op-c" class="ph-op-c" type="tel" inputmode="numeric" maxlength="2" placeholder="XX" value="${esc(state.opCustom)}" ${isCustom ? '' : 'hidden'}>
      <input id="f-num" class="ph-num" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="123 45 67" value="${esc(fmt7(state.num7))}">
    </div>
    <div class="sub" style="margin-top:5px">${esc(L.phoneHint)}</div>
    <div class="err" id="err">${esc(errMsg)}</div>
    ${navButtonsHtml()}
  </section>`;
}

function doneHtml() {
  const L = I18N[lang];
  const objs = state.objects.map(id => labelOf(L.objects, id, state.objectsOther)).join(', ');
  const role = labelOf(L.roles, state.role, state.roleOther);
  const servs = state.services.map(id => labelOf(L.services, id, state.servicesOther)).join(', ');
  const cats = state.categories.map(id => labelOf(L.categories, id, state.categoriesOther)).join(', ');
  return `<section class="panel" style="margin-top:16px">
    <div class="ok-head">
      <span class="ok-badge">✓</span>
      <h2>${esc(L.doneTitle)}</h2>
    </div>
    <p class="hint" style="margin-bottom:0">${esc(L.doneText(state.name.trim()))}</p>
    <div class="sum">
      <div class="sum-row"><span class="sum-k">${esc(L.sumName)}</span><span class="sum-v">${esc(state.name.trim())}</span></div>
      <div class="sum-row"><span class="sum-k">${esc(L.sumPhone)}</span><span class="sum-v">${esc(fullPhone())}</span></div>
      <div class="sum-row"><span class="sum-k">${esc(L.sumObjects)}</span><span class="sum-v">${esc(objs)}</span></div>
      <div class="sum-row"><span class="sum-k">${esc(L.sumRole)}</span><span class="sum-v">${esc(role)}</span></div>
      <div class="sum-row"><span class="sum-k">${esc(L.sumServices)}</span><span class="sum-v">${esc(servs)}</span></div>
      <div class="sum-row"><span class="sum-k">${esc(L.sumCategories)}</span><span class="sum-v">${esc(cats)}</span></div>
    </div>
    <div class="nav-row">
      <button type="button" class="btn" id="resetBtn">${esc(L.newReq)}</button>
      <a class="btn p" href="client.html">${esc(L.goPortal)}</a>
    </div>
  </section>`;
}

function render() {
  applyLangUI();
  renderProgress();
  const L = I18N[lang];
  if (done) {
    $('#app').innerHTML = doneHtml();
    $('#resetBtn').onclick = () => {
      state.name = ''; state.opSel = '50'; state.opCustom = ''; state.num7 = '';
      state.objects = []; state.objectsOther = '';
      state.role = ''; state.roleOther = '';
      state.services = []; state.servicesOther = '';
      state.categories = []; state.categoriesOther = '';
      step = 1; done = false; errMsg = '';
      render();
    };
    return;
  }

  if (step === 1) $('#app').innerHTML = step1Html();
  else if (step === 2) $('#app').innerHTML = multiStepHtml(L.step2Title, L.objects, state.objects, state.objectsOther, L.step2OtherPh);
  else if (step === 3) $('#app').innerHTML = singleStepHtml(L.step3Title, L.roles, state.role, state.roleOther, L.step3OtherPh);
  else if (step === 4) $('#app').innerHTML = multiStepHtml(L.step4Title, L.services, state.services, state.servicesOther, L.step4OtherPh);
  else if (step === 5) $('#app').innerHTML = multiStepHtml(L.step5Title, L.categories, state.categories, state.categoriesOther, L.step5OtherPh);

  wireStep();
}

function wireStep() {
  if (step === 1) {
    const nm = $('#f-name'), op = $('#f-op'), opc = $('#f-op-c'), num = $('#f-num');
    nm.oninput = () => { state.name = nm.value; clearErr(); };
    op.onchange = () => {
      state.opSel = op.value;
      opc.hidden = op.value !== '__other';
      if (!opc.hidden) opc.focus();
      clearErr();
    };
    opc.oninput = () => {
      opc.value = opc.value.replace(/\D/g, '').slice(0, 2);
      state.opCustom = opc.value;
      clearErr();
    };
    num.oninput = () => {
      const digits = num.value.replace(/\D/g, '');
      // Handle full Azerbaijan number paste (+994XXXXXXXXX or 0XXXXXXXXX or 9 digits)
      if (digits.length >= 9) {
        const last9 = digits.slice(-9);
        const p2 = last9.slice(0, 2);
        const p7 = last9.slice(2);
        if (OP_CODES.includes(p2)) {
          state.opSel = p2;
          op.value = p2;
          opc.hidden = true;
        } else {
          state.opSel = '__other';
          op.value = '__other';
          state.opCustom = p2;
          opc.value = p2;
          opc.hidden = false;
        }
        state.num7 = p7;
        num.value = fmt7(p7);
      } else {
        state.num7 = digits.slice(0, 7);
        num.value = fmt7(state.num7);
      }
      clearErr();
    };
    [nm, opc, num].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goNext(); } }));
  } else {
    const keyMap = { 2: ['objects', 'objectsOther', true], 3: ['role', 'roleOther', false], 4: ['services', 'servicesOther', true], 5: ['categories', 'categoriesOther', true] };
    const [field, otherField, isMulti] = keyMap[step];
    const otherWrap = $('.other-wrap');
    const otherInp = $('#otherInp');
    document.querySelectorAll('[data-opt]').forEach(inp => {
      inp.onchange = () => {
        const id = inp.dataset.opt;
        if (isMulti) {
          if (inp.checked) { if (!state[field].includes(id)) state[field].push(id); }
          else state[field] = state[field].filter(x => x !== id);
          inp.closest('.opt').classList.toggle('on', inp.checked);
          const showO = state[field].includes('other');
          otherWrap.hidden = !showO;
          if (showO && id === 'other') otherInp.focus();
        } else {
          state[field] = id;
          document.querySelectorAll('.opt').forEach(el => el.classList.remove('on'));
          inp.closest('.opt').classList.add('on');
          const showO = id === 'other';
          otherWrap.hidden = !showO;
          if (showO) otherInp.focus();
        }
        clearErr();
      };
    });
    if (otherInp) {
      otherInp.oninput = () => { state[otherField] = otherInp.value; clearErr(); };
      otherInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goNext(); } });
    }
  }

  const prev = $('#prevBtn');
  if (prev) prev.onclick = () => { errMsg = ''; step--; render(); window.scrollTo(0, 0); };
  $('#nextBtn').onclick = goNext;
}

function clearErr() {
  if (!errMsg) return;
  errMsg = '';
  const el = $('#err');
  if (el) el.textContent = '';
}

function setErr(m) {
  errMsg = m;
  const el = $('#err');
  if (el) el.textContent = m;
}

function validateStep() {
  const L = I18N[lang];
  if (step === 1) {
    if (state.name.trim().length < 2) { setErr(L.errName); $('#f-name').focus(); return false; }
    if (getOp().length !== 2) { setErr(L.errOp); (state.opSel === '__other' ? $('#f-op-c') : $('#f-op')).focus(); return false; }
    if (state.num7.length !== 7) { setErr(L.errPhone); $('#f-num').focus(); return false; }
    return true;
  }
  if (step === 2) {
    if (!state.objects.length) { setErr(L.errPickOne); return false; }
    if (state.objects.includes('other') && !state.objectsOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 3) {
    if (!state.role) { setErr(L.errPickRole); return false; }
    if (state.role === 'other' && !state.roleOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 4) {
    if (!state.services.length) { setErr(L.errPickOne); return false; }
    if (state.services.includes('other') && !state.servicesOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  if (step === 5) {
    if (!state.categories.length) { setErr(L.errPickOne); return false; }
    if (state.categories.includes('other') && !state.categoriesOther.trim()) { setErr(L.errOther); $('#otherInp').focus(); return false; }
    return true;
  }
  return true;
}

async function goNext() {
  if (busy) return;
  if (!validateStep()) return;
  errMsg = '';
  if (step < TOTAL) {
    step++;
    render();
    window.scrollTo(0, 0);
    return;
  }
  busy = true;
  render();
  const payload = {
    name: state.name.trim(),
    phone: fullPhone(),
    lang,
    objects: [...state.objects],
    objectsOther: state.objects.includes('other') ? state.objectsOther.trim() : '',
    role: state.role,
    roleOther: state.role === 'other' ? state.roleOther.trim() : '',
    services: [...state.services],
    servicesOther: state.services.includes('other') ? state.servicesOther.trim() : '',
    categories: [...state.categories],
    categoriesOther: state.categories.includes('other') ? state.categoriesOther.trim() : '',
    status: 'new',
    created: Date.now()
  };
  try {
    await setDoc(doc(db, 'requests', uid()), payload);
    done = true;
  } catch (e) {
    errMsg = I18N[lang].errSend;
  } finally {
    busy = false;
    render();
    window.scrollTo(0, 0);
  }
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.onclick = () => {
    lang = btn.dataset.lang;
    try { localStorage.setItem('tm-reg-lang', lang); } catch (e) {}
    errMsg = '';
    render();
  };
});

render();
</script>
</body>
</html>
